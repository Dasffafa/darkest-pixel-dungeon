plugins {
    id 'io.sentry.jvm.gradle' version '6.21.0'
}

apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'
apply plugin: 'org.jetbrains.kotlin.plugin.serialization'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = '1.8'
}

sentry {
    includeSourceContext = false
    org = "thebouquet"
    projectName = "darkest-pixel-dungeon"
}

def sentryDsn = (project.findProperty('sentryDsn') ?: System.getenv('SENTRY_DSN') ?: '').toString()

def generateSentryConfig = tasks.register('generateSentryConfig') {
    def outputDir = layout.buildDirectory.dir('generated/dpd-sentry/kotlin')
    def dsn = sentryDsn
    inputs.property('dsn', dsn)
    outputs.dir(outputDir)
    doLast {
        def configFile = new File(outputDir.get().asFile, 'com/egoal/darkestpixeldungeon/SentryConfig.kt')
        configFile.parentFile.mkdirs()
        configFile.text = """package com.egoal.darkestpixeldungeon

internal object SentryConfig {
    const val DSN: String = "${dsn}"
}
"""
    }
}

sourceSets {
    main {
        java.exclude 'com/egoal/darkestpixeldungeon/android/**'
        resources.srcDir 'src/main/assets'
        kotlin.srcDir(generateSentryConfig)
    }
}

tasks.named('compileKotlin') {
    dependsOn generateSentryConfig
}

processResources {
    from('src/main/java') { include '**/*.properties' }
}

dependencies {
    api project(':SPD-classes')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
}

// ---------------------------------------------------------------------------
// Thread confinement check
//
// Game logic runs on the actor thread while the scene graph/UI lives on the
// render thread. Reaching for a render-only API from logic code (unless it is
// deferred with Game.runOnRenderThread) is the class of bug behind the
// BuffIndicator / LootIndicator / BubbleText crashes.
//
// This task scans the logic packages for render-only calls and fails the build
// on any that are not wrapped in runOnRenderThread. Existing violations are
// recorded in thread-confinement-baseline.txt; burn entries down over time.
//
// Regenerate the baseline (only when intentionally accepting new debt):
//   ./gradlew :core:checkThreadConfinement -PupdateThreadBaseline=true
// ---------------------------------------------------------------------------
def tcSourceRoot = file('src/main/java/com/egoal/darkestpixeldungeon')
def tcPackages = ['actors', 'items', 'levels', 'plants']
def tcBaselineFile = file('thread-confinement-baseline.txt')

def tcPatterns = [
        'window-construction' : ~/\bnew\s+Wnd[A-Za-z0-9_]*\s*\(/,
        'scene-text'          : ~/GameScene\.(status|sentence|sentenceFor)\s*\(/,
        'bubbletext'          : ~/BubbleText\.Show\s*\(/,
        'floatingtext'        : ~/FloatingText\.show\s*\(/,
        'camera'              : ~/Camera\.main\./,
        'group-recycle'       : ~/\.recycle\s*\(/,
        'rendered-text'       : ~/\bnew\s+(RenderedText|BitmapText|BitmapTextMultiline|TextureFilm)\b/,
        'image-construction'  : ~/\bnew\s+(Image|NinePatch)\s*\(/,
        'quickslot-refresh'   : ~/QuickSlotButton\.refresh\s*\(/,
        'scene-effect'        : ~/GameScene\.effect\s*\(/,
        'scene-fog'           : ~/GameScene\.(updateFog|afterObserve|flash)\s*\(/,
]

// A violation is tolerated when one of these appears on the same line or just
// above it (covers the common `Game.runOnRenderThread(() -> { ... })` shape).
def tcEscapes = [/runOnRenderThread/, /runOnRenderThreadAndWait/]

tasks.register('checkThreadConfinement') {
    group = 'verification'
    description = 'Fails if game-logic code touches render-thread-only APIs outside runOnRenderThread.'

    def updateBaseline = project.hasProperty('updateThreadBaseline')

    doLast {
        def violations = new TreeSet<String>()
        tcPackages.each { pkg ->
            def dir = new File(tcSourceRoot, pkg)
            if (!dir.exists()) return
            dir.eachFileRecurse { f ->
                if (!(f.name.endsWith('.java') || f.name.endsWith('.kt'))) return
                def lines = f.readLines('UTF-8')
                lines.eachWithIndex { line, idx ->
                    def trimmed = line.trim()
                    if (trimmed.startsWith('//') || trimmed.startsWith('*') || trimmed.startsWith('/*')) return
                    tcPatterns.each { name, regex ->
                        if (!(line =~ regex).find()) return
                        def from = Math.max(0, idx - 4)
                        def escaped = (from..idx).any { r -> tcEscapes.any { e -> (lines[r] =~ e).find() } }
                        if (!escaped) {
                            def rel = tcSourceRoot.toPath().relativize(f.toPath()).toString().replace('\\', '/')
                            violations.add((rel + '|' + name + '|' + trimmed).toString())
                        }
                    }
                }
            }
        }

        if (updateBaseline) {
            tcBaselineFile.text = violations.isEmpty() ? '' : violations.join('\n') + '\n'
            logger.lifecycle("Thread confinement: wrote ${violations.size()} baseline entr(y/ies) to ${tcBaselineFile.name}")
            return
        }

        def baseline = tcBaselineFile.exists()
                ? tcBaselineFile.readLines('UTF-8').findAll { it.trim() } as Set
                : ([] as Set)
        def added = violations.findAll { !baseline.contains(it) }
        def stale = baseline.findAll { !violations.contains(it) }

        if (stale) {
            logger.lifecycle("Thread confinement: ${stale.size()} stale baseline entr(y/ies) " +
                    "(fixed or moved). Regenerate with -PupdateThreadBaseline=true when convenient.")
        }
        if (added) {
            def msg = new StringBuilder()
            msg.append("Thread confinement check failed: ${added.size()} render-thread-only call(s) " +
                    "reachable from game logic without Game.runOnRenderThread.\n\n")
            added.each { msg.append("  ").append(it).append('\n') }
            msg.append("\nFix by wrapping the work in Game.runOnRenderThread, using a deferred flag, " +
                    "or make the API self-deferring.")
            throw new GradleException(msg.toString())
        }
        logger.lifecycle("Thread confinement check passed (${baseline.size()} known entr(y/ies)).")
    }
}

tasks.named('check') { dependsOn 'checkThreadConfinement' }
