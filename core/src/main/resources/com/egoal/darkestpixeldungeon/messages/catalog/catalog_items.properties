# 图鉴文本：护甲刻印 / 护甲诅咒 / 武器附魔 / 武器诅咒 / 食物 / 酒

items.armor.glyphs.affection.catalog_desc=护甲受到攻击时，有 _(护甲等级/2+1)/(护甲等级/2+10)_ 的几率魅惑攻击者：未强化约 _10%_，_+4_ 时约 _25%_，_+10_ 时约 _40%_。魅惑持续 _2~5_ 回合，并受目标抗性影响。被魅惑的敌人无法攻击魅惑它的生物，只能转而攻击其他目标（包括它的同伴）。

items.armor.glyphs.antimagic.catalog_desc=这个刻印使穿戴者的魔法抗性额外提高 _25%_，并与护甲本身提供的魔法抗性按概率方式合并：最终抗性 = _1-(1-护甲抗性)×(1-25%)_。它不改变护甲的物理防御、护盾、重量与力量需求，只提升对法术与元素魔法攻击的豁免。

items.armor.glyphs.brimstone.catalog_desc=穿戴者身上着火时不再受到火焰伤害，改为每回合回复 _护甲等级/5_ 点生命（不足 _1_ 点的部分按概率取整），同时身上装备的道具也不会被烧毁。未强化的护甲回复量为 _0_，强化到 _+5_ 时每回合回 _1_ 点，_+10_ 时每回合回 _2_ 点。

items.armor.glyphs.camouflage.catalog_desc=穿戴者踩过高草时，护甲会使其与草丛融为一体，获得 _2+护甲等级_ 回合的伪装（等同于隐身，一旦移动就立刻失效）。该效果只能由踏过高草触发，无法主动施展，强化护甲可以延长持续时间。

items.armor.glyphs.chuneng.catalog_desc=护甲受到近战攻击时蓄积能量（远程与精神类攻击不计入），每累计 _10+护甲阶数-护甲等级_ 次后爆发，最少只需 _3_ 次。爆发时对周围 _8_ 格内所有敌对单位造成 _1_ 点魔法伤害，并使其在 _2+护甲等级×0.5_ 回合内攻击全部落空。护甲等级越高所需次数越少。

items.armor.glyphs.clarifying.catalog_desc=护甲在承受伤害时，有 _25%+护甲等级×5%_ 的几率（上限 _50%_）为穿戴者附加 _1_ 回合的充能状态。充能状态会加快法杖的充能速度。未强化时约 _25%_，强化到 _+5_ 即达到 _50%_ 的上限。

items.armor.glyphs.flow.catalog_desc=穿戴者在水中移动时速度提高到 _1.5+护甲等级×0.05_ 倍：未强化 _1.5_ 倍，_+10_ 时 _2_ 倍。离开水面后效果立刻消失，因此只在水没地形中发挥作用。

items.armor.glyphs.healing.catalog_desc=装备者每回合额外回复 _0.15+护甲等级×0.03_ 点生命：未强化约每 _7_ 回合回 _1_ 点，_+10_ 时约每 _2_ 回合回 _1_ 点。饱食度低于 _500_（极度饥饿）时此刻印失效，以免连带放大饥饿伤害。

items.armor.glyphs.obfuscation.catalog_desc=穿戴者的隐匿值提高 _护甲等级_ 点，但护甲的防御等级降低 _1_ 阶，相当于牺牲防御与护盾成长来换取隐蔽。

items.armor.glyphs.peaceful.catalog_desc=装备者每回合积累 _0.5+护甲等级×0.5_ 点生命回复：未强化时每 _2_ 回合回 _1_ 点，_+10_ 时每回合约 _5.5_ 点（按整数结算，实际为 _5~6_ 点）。一旦装备者被击中，宁静就会失效 _10_ 回合：期间护甲不再提供任何防御并附带破甲效果，刻印也停止回复。极度饥饿时同样失效。

items.armor.glyphs.potential.catalog_desc=护甲被击中时，有 _(护甲等级+2)/(护甲等级+20)_ 的几率放电，未强化时约为 _10%_。放电会对装备者自身造成 _生命上限 1/20~1/10_ 的闪电伤害，伤害系数为 _0.9_ 的护甲等级次方并向下取整，同时为所有法杖回复 _1_ 点充能。由于取整，护甲强化到 _+1_ 之后该自伤系数会变成 _0_，只剩充能效果。

items.armor.glyphs.protection.catalog_desc=护甲的护盾上限额外提高 _护甲阶数+护甲等级×2_ 点。护盾在战斗中会优先代替生命值承受伤害，并随时间自动补充。

items.armor.glyphs.repulsion.catalog_desc=护甲受到攻击时，有 _(护甲等级+1)/(护甲等级+5)_ 的几率把攻击者沿攻击方向弹开 _2_ 格（未强化约 _20%_）。被弹开的敌人需要重新接近你；若被推撞到墙壁，还会额外受到伤害并被麻痹。对无法被推动的敌人无效，Boss 被推开的距离减半。

items.armor.glyphs.stone.catalog_desc=刻印使护甲更沉重也更坚固：防御下限由 _护甲等级_ 提升为 _2+护甲等级×2_，防御上限的成长也随之提高，代价是力量需求增加 _2_ 点（护甲阶数按 _+1_ 计算）。

items.armor.glyphs.swiftness.catalog_desc=护甲的防御等级降低 _2_ 阶、力量需求降低 _1_ 阶（约少 _2_ 点力量），换取 _1.1+护甲等级×0.01_ 倍的移动速度，以及 _5+护甲等级×1.5_ 的闪避加值（仅在力量足够时生效）。

items.armor.glyphs.thorns.catalog_desc=护甲受到攻击时，有 _(护甲等级/2+1)/(护甲等级/2+5)_ 的几率使攻击者流血，流血量取 _护甲等级/2_ 与本次所受伤害中的较大值。

items.armor.glyphs.tough.catalog_desc=护甲每受到一次有效伤害便积攒 _1_ 点能量，上限 _10_ 点。能量满时，下一次被施加的负面状态会被完全抵挡，并清空全部能量。刻印初始即为满能量，因此刚刚获得就能立刻抵挡一次负面效果；对中毒、虚弱、燃烧等状态均有效。

items.armor.glyphs.viscosity.catalog_desc=护甲受到伤害时，有 _(护甲等级+1)/(护甲等级+4)_ 的几率把这次伤害完全延后，转化为持续伤害而不是立刻扣除。延后的伤害每回合流失总量的 _1/10_（至少 _1_ 点），直到还清为止。延迟伤害依然可能致死。

items.armor.curses.antientropy.catalog_desc=穿戴者受到攻击时，有 _1/8_ 的几率燃烧起来；若攻击者与之相邻，还会被冰冻 _0.5~1_ 倍的正常冰冻时长。它以热能转移的方式同时伤害双方。

items.armor.curses.corrosion.catalog_desc=受到攻击时有 _1/10_ 的几率向穿戴者周围 _3×3_ 范围喷溅腐蚀性黏液，范围内所有单位（不分敌我）都会沾上腐蚀黏液。

items.armor.curses.displacement.catalog_desc=穿戴者受到攻击时，有 _1/20_ 的几率被随机传送到本层某处，同时这次伤害被完全抵消。

items.armor.curses.entanglement.catalog_desc=受到攻击时有 _1/3_ 的几率在穿戴者脚下长出根系：为其提供 _5+护甲等级_ 点植物护甲，但会使穿戴者 _5_ 回合内无法移动、闪避下降。

items.armor.curses.metabolism.catalog_desc=受到攻击时有 _1/6_ 的几率立刻治疗，每回复 _1_ 点生命消耗 _10_ 点饱食度，单次最多回复 _5_ 点（同时受剩余生命上限限制）。饥饿状态下则完全无法生效。

items.armor.curses.multiplicity.catalog_desc=受到攻击时有 _1/20_ 的几率在穿戴者身边生成一个复制体：若穿戴者是英雄，有一半几率是自己的镜像（会与你并肩作战），否则会复制攻击者；对 Boss 与迷你 Boss 则改从当前层生物中生成。复制出来的敌人会与你为敌。

items.armor.curses.stench.catalog_desc=受到攻击时有 _1/8_ 的几率在穿戴者脚下释放一团浓度 _250_ 的毒气云。毒气不分敌我，任何在其中停留的单位（包括穿戴者）都会中毒受伤，而且会持续存在一段时间。

items.weapon.enchantments.bashing.catalog_desc=武器攻击时额外造成 _1~本次伤害-1_ 的伤害（平均约 _+50%_），并有 _30%_ 的几率判定为暴击。每次生效消耗 _1_ 点附魔能量（药剂附魔约 _20_ 次，强化药剂 _30_ 次，植物炼金 _6_ 次）。

items.weapon.enchantments.blazing.catalog_desc=每次攻击额外造成 _2~本次伤害的 1/5_ 的火属性伤害，并有 _30%_ 的几率点燃目标。被点燃的敌人会持续掉血，火焰还会蔓延到周围的可燃物。被附魔的武器带有火属性。

items.weapon.enchantments.blinding.catalog_desc=每次攻击额外造成 _2~本次伤害的 1/5_ 的暗属性伤害，并有 _35%_ 的几率使目标失明 _2~3_ 回合。失明的敌人视野与命中下降，并会放弃追击、转为盲目游荡。

items.weapon.enchantments.bloodcoil.catalog_desc=每次攻击额外造成 _1~剩余附魔能量×2_ 的伤害，能量越充足加成越高；同时有 _40%_ 的几率暴击，并使这次伤害再提高 _25%_。附魔能量随每次生效而消耗。

items.weapon.enchantments.chilling.catalog_desc=每次攻击额外造成 _2~本次伤害的 1/4_ 的冰属性伤害，并有 _35%_ 的几率使目标冻伤 _2~3_ 回合，降低其移动与攻击速度。被附魔的武器带有冰属性。

items.weapon.enchantments.healing.catalog_desc=武器攻击时会治疗目标 _本次伤害的 1/4_，但对亡灵与恶魔则改为额外造成 _25%_ 的伤害。


items.weapon.enchantments.stunningecht.catalog_desc=武器每次攻击都会触发重击铭文：有 _(武器等级+1)/(武器等级+8)_ 的几率（未强化约 _13%_）使目标麻痹 _1~1.5+武器等级_ 回合，麻痹期间目标无法进行任何行动。附魔能量每次只消耗 _0.5_。

items.weapon.enchantments.magical.catalog_desc=武器造成的伤害类型改为魔法：不再被目标的物理防御削减，命中判定也更容易，但仍会被魔法抗性影响。

items.weapon.enchantments.rousing.catalog_desc=每次攻击额外附加 _2~本次伤害的 1/4_ 的光属性伤害，并使武器带有光属性。

items.weapon.enchantments.shocking.catalog_desc=每次攻击有 _35%_ 的几率触发连锁闪电：先对目标造成 _1~本次伤害的 1/3_ 的闪电伤害，电弧随后跳向目标周围的敌人，每次跳跃造成上一跳伤害的 _1/2~1_ 倍。站在水中的目标受到的闪电伤害翻倍。

items.weapon.enchantments.sophisticated.catalog_desc=每次攻击有 _20%_ 的几率暴击并造成双倍伤害，未触发时额外造成 _本次伤害的 1/8_。附魔能量每次只消耗 _0.5_。

items.weapon.enchantments.tracking.catalog_desc=被击中的目标会被标记 _5+武器等级_ 回合，标记期间你能看到它的位置，即使它不在视野内。标记本身不造成额外伤害。

items.weapon.enchantments.unstable.catalog_desc=每次攻击都会随机复制烈焰、猛击、致盲、寒霜、电击、老练、淬毒中的一种效果，该次触发按 _10_ 点能量计算，而自身能量则按攻击次数正常消耗。

items.weapon.enchantments.venomous.catalog_desc=每次攻击额外造成 _2~本次伤害的 1/4_ 的毒属性伤害，并有 _50%_ 的几率延长目标的中毒状态（延长量为目标毒素持续时间因子的 _2_ 倍）。中毒期间目标会持续掉血，被附魔的武器带有毒属性。

items.weapon.curses.annoying.catalog_desc=每次攻击有 _1/20_ 的几率大声喧哗：整层的敌人都会闻声而来，同时你的隐身状态被破除。

items.weapon.curses.arrogant.catalog_desc=每次攻击有 _1/10_ 的几率让使用者受到 _1~2_ 点精神伤害。

items.weapon.curses.bloodthirsty.catalog_desc=每次攻击额外造成 _1~本次伤害的 1/2_ 的伤害，但这部分额外伤害会被记入「饥渴」账本：之后的攻击会不断从中抵扣，并以对使用者造成等量伤害的方式偿还，直到结清为止。

items.weapon.curses.displacing.catalog_desc=每次攻击有 _1/12_ 的几率把目标（无法移动的除外）传送到本层的随机位置，并将这次攻击的伤害清零。

items.weapon.curses.exhausting.catalog_desc=仅在使用者是英雄时生效：每次攻击有 _1/20_ 的几率陷入虚弱 _5~25_ 回合。虚弱会削减 _2_ 点力量，使武器与护甲相对变重，从而拖慢攻击、降低命中。

items.weapon.curses.fragile.catalog_desc=每攻击一次伤害就永久衰减 _0.5%_，累计 _150_ 次攻击后降至原本的 _25%_。衰减量会随武器一起保存，不会自行重置。

items.weapon.curses.provocation.catalog_desc=每次攻击有 _1/10_ 的几率激怒目标，使其进入 _2~5_ 回合的狂暴状态。狂暴会大幅提升目标的攻击速度（攻击间隔减半）。

items.weapon.curses.sacrificial.catalog_desc=每次攻击有 _1/10_ 的几率使使用者流血，流血量取 _当前生命的 1/4_（至少 _1_ 点）。

items.weapon.curses.wayward.catalog_desc=武器极难命中目标：命中判定时，力量不足的惩罚会被强制视为至少 _3_ 点，也就是命中率恒定为正常值的 _1/1.5³_（约 _30%_）。只有必中类攻击（法术、标记类效果等）不受影响。

# 食物 / 酒
# Food 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/Food.kt:23-80（enery 默认 Hunger.HUNGRY、hornValue 默认 3、进食耗时 3 回合、onEat 额外回复 Random.Float(2,6) 理智、价格 10×数量）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Hunger.kt:167-186（satisfy 即降低饥饿值，下限 0、上限 500）:226-227（HUNGRY 350、STARVING 500）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroClass.kt:300（各职业开局各给一份）; core/src/main/java/com/egoal/darkestpixeldungeon/levels/Level.kt:1069（关卡生成时放置）
items.food.food.catalog_desc=进食耗时 _3_ 回合，消耗一份，回复 _350_ 点饱食度（饥饿值以 _0_ 为完全饱足、_500_ 为饿死线，进食就是把饥饿值降低对应点数），并额外回复 _2~6_ 点理智。\n装填_丰饶之角_时提供 _3_ 点充能。价格 _10_ 金币。每个职业开局都会携带一份，关卡生成时也会在地上放置。

# Pasty 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/Pasty.kt:12-66（Food(Hunger.STARVING, 5)、价格 20×数量、节日变体额外给 Recharging 2 回合）; core/src/main/java/com/egoal/darkestpixeldungeon/items/scrolls/ScrollOfRecharging.kt:30（充能期间每回合为所有法杖额外充能 0.25 点）
items.food.pasty.catalog_desc=进食耗时 _3_ 回合，回复 _500_ 点饱食度（饥饿值上限同样是 _500_，所以不论多饿都能一次回到完全饱足），额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _5_ 点充能。价格 _20_ 金币。\n它在 _12_ 月第 _3_ 周之后、或 _1_ 月第 _1_ 周变成节日形态_拐杖糖_：名称与贴图改变，进食时额外获得 _2_ 回合_充能_（约合所有法杖 _0.5_ 点），其余数值不变。

# Blandfruit 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/Blandfruit.kt:16-165（生果 potionAttrib==null 时拒绝进食并 return；cook(seed) 改名称与颜色；cast 覆写让 7 种药剂改为投掷）; core/src/main/java/com/egoal/darkestpixeldungeon/levels/features/AlchemyPot.kt:56-59（种子 + 无味果 = 熟果）
items.food.blandfruit.catalog_desc=生的_无味果_不能进食：直接食用只会提示需要先加工。\n把它与任意可入药的种子在炼金釜中合成，会得到对应药剂的"熟果"，名称、颜色与效果随种子改变。熟果进食耗时 _3_ 回合，回复 _250_ 点饱食度，额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _6_ 点充能。价格 _20_ 金币。\n熟果的效果大体等于同名药剂：可作用于自身的药剂直接生效，其中_寒霜_改为触发一次随机效果、_液火_/_毒气_/_麻痹气体_/_魔雾_改为给武器附加对应的_附魔_。此外_液火_、_毒气_、_麻痹气体_、_寒霜_、_漂浮_、_净化_、_魔雾_这七种熟果可以像药剂一样投掷出去，投掷时按药剂原本的投掷效果结算，并且不产生饱食度收益。

# ChargrilledMeat 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/ChargrilledMeat.kt:26-34（Food(Hunger.STARVING-Hunger.HUNGRY, 1)、价格 8×数量）; core/src/main/java/com/egoal/darkestpixeldungeon/items/Heap.kt:310（地上的肉被点燃）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Burning.kt:110（身上的肉被烧）
items.food.chargrilledmeat.catalog_desc=把_神秘的肉_用火焰烤成，吃下不会再触发任何随机效果。进食耗时 _3_ 回合，回复 _150_ 点饱食度（等于把饥饿值从 _500_ 的饿死线拉回 _350_），额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _1_ 点充能。价格 _8_ 金币。

# OrchidRoot 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/OrchidRoot.kt:8-17（Food(enery = 10f, hornValue = 0)，进食后 Relieve 60 回合）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Relieve.kt:26-30（每回合回复 0.3 点理智）
items.food.orchidroot.catalog_desc=进食耗时 _3_ 回合，只回复 _10_ 点饱食度，额外回复 _2~6_ 点理智；它的丰饶之角充能值为 _0_，装填时不提供充能。\n进食后获得 _60_ 回合的_缓解_，每回合回复 _0.3_ 点理智，整段合计 _18_ 点。价格 _10_ 金币。

# OverpricedRation 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/OverpricedRation.kt:26-31（Food(200f, 1)、价格 10×数量）
items.food.overpricedration.catalog_desc=进食耗时 _3_ 回合，回复 _200_ 点饱食度，额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _1_ 点充能。价格 _10_ 金币，与普通_口粮_相同，饱食度却只有它的约 _4/7_。

# FrozenCarpaccio 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/FrozenCarpaccio.kt:42-70（Food(Hunger.STARVING-Hunger.HUNGRY, 1)、Random.Int(5) 四档效果、价格 10×数量）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Invisibility.kt:73（DURATION 20）; core/src/main/java/com/egoal/darkestpixeldungeon/items/Heap.kt:406（地上的肉被冻）
items.food.frozencarpaccio.catalog_desc=把_神秘的肉_冻成，进食耗时 _3_ 回合，回复 _150_ 点饱食度，额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _1_ 点充能。\n随后再按 _1/5_ 概率抽取一次随机效果：获得 _20_ 回合_隐形_、获得护甲值等于生命上限 _1/4_ 的_树皮_、一次性清除_中毒_/_残废_/_虚弱_/_流血_/_困倦_/_缓慢_/_眩晕_、或回复生命上限的 _1/4_；五档中有一档什么都不发生。价格 _10_ 金币。

# StewedMeat 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/StewedMeat.kt:9-20（Food(Hunger.STARVING-Hunger.HUNGRY, 1)、价格 6×数量、StewedMeat.Cook(MysteryMeat)）; core/src/main/java/com/egoal/darkestpixeldungeon/levels/features/AlchemyPot.kt:70（一份神秘的肉 = 煮肉）
items.food.stewedmeat.catalog_desc=把_神秘的肉_在炼金釜中煮成，吃下不会再触发任何随机效果。进食耗时 _3_ 回合，回复 _150_ 点饱食度，额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _1_ 点充能。价格 _6_ 金币。

# SkewerMeat 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/StewedMeat.kt:23-35（Food(Hunger.STARVING-Hunger.HUNGRY, 1)、onEat 额外回复 Random.Float(1,3) 理智、价格 8×数量）; core/src/main/java/com/egoal/darkestpixeldungeon/levels/features/AlchemyPot.kt:61-62（神秘的肉 + 鱼骨 = 肉串）
items.food.skewermeat.catalog_desc=把_神秘的肉_与_鱼骨_在炼金釜中合成，吃下不会再触发任何随机效果。进食耗时 _3_ 回合，回复 _150_ 点饱食度，装填_丰饶之角_时提供 _1_ 点充能；它比_煮肉_多回复 _1~3_ 点理智，加上共有的 _2~6_ 点，实际额外回复 _3~9_ 点理智。价格 _8_ 金币。

# MysteryMeat 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/MysteryMeat.kt:36-70（Food(Hunger.STARVING-Hunger.HUNGRY, 1)、Random.Int(5) 四档效果、价格 5×数量）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Poison.kt:112-115（durationFactor 受抗性影响）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Paralysis.kt:77-80（duration 受抗性影响）
items.food.mysterymeat.catalog_desc=进食耗时 _3_ 回合，回复 _150_ 点饱食度，额外回复 _2~6_ 点理智，装填_丰饶之角_时提供 _1_ 点充能。\n随后再按 _1/5_ 概率抽取一次随机效果：被_点燃_、被_定身_（时长按麻痹时长计算）、_中毒_（强度为中毒持续因子×生命上限/5）、_缓慢_（时长按缓慢时长计算）；五档中有一档什么都不发生——也就是说吃掉它有约 _4/5_ 的概率挨一个负面状态。价格 _5_ 金币。

# Humanity 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/food/Humanity.kt:17-60（AC_CONSUME、耗时 1 回合、recoverSanity(HeroPressure()*0.5)、HP += HT/4、detach 消耗）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Pressure.kt:221-222（HeroPressure 即当前压力）; core/src/main/java/com/egoal/darkestpixeldungeon/items/unclassified/Prize.kt:63-70（出生礼物的"随便来点"里 4% 概率给出）
items.food.humanity.catalog_desc=使用耗时 _1_ 回合并消耗一份：回复的理智等于当前压力的一半，并回复生命上限的 _1/4_（不会超过生命上限），两者同时结算。\n它不属于食物：不能进食、不回复饱食度、不提供_丰饶之角_充能，也不能被强化，并且始终已鉴定。来源是创建角色时所选_出生礼物_"随便来点"一档，有 _4%_ 的概率给出。

items.food.wine.catalog_desc=饮用需要 _2_ 回合，回复的压力为 _15~当前压力×0.4_ 之间的随机值，最多 _30_ 点，压力越高越接近上限。饮用后获得 _30_ 回合的酒醉与眩晕：造成伤害提高 _20%_，受到物理伤害减少约 _1/5_，精神伤害减半，但命中下降 _25%_、视野缩短一格。价格 _20_ 金币，灌入酒葫芦占 _5_ 格容量（葫芦总容量为 _20_）。

items.food.brownale.catalog_desc=饮用需要 _2_ 回合，回复的压力为 _10~当前压力×0.3_ 之间的随机值，最多 _22.5_ 点。价格 _15_ 金币，灌入酒葫芦占 _3_ 格容量。饮用后同样会获得 _30_ 回合的酒醉与眩晕。

items.food.ricewine.catalog_desc=饮用需要 _2_ 回合，回复的压力为 _10~当前压力×0.25_ 之间的随机值，最多 _20_ 点，并额外满足 _150_ 点饱食度（相当于把饱食度从饥饿阈值提升到正常阈值）。价格 _20_ 金币，灌入酒葫芦占 _3_ 格容量，也可在炼金釜中用口粮包酿制。

items.food.meadwine.catalog_desc=饮用需要 _2_ 回合，回复的压力为 _15~当前压力×0.4_ 之间的随机值，最多 _30_ 点，并立刻回复 _当前生命的 1/5_。价格 _30_ 金币，灌入酒葫芦占 _5_ 格容量。蜜酒不会使人酒醉，因此没有酒醉带来的伤害加成与副作用。
