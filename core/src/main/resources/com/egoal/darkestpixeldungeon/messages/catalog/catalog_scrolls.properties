items.scrolls.scrollofidentify.catalog_desc=永久揭示一件未鉴定物品的等级与诅咒状态。

items.scrolls.scrollofmagicmapping.catalog_desc=显现整层的布局并揭示所有隐藏门与密室入口，但不显示物品与生物的位置。

items.scrolls.scrollofrecharging.catalog_desc=获得 _30_ 回合_充能_：期间每回合为所有法杖额外充能 _0.25_ 点。

items.scrolls.scrollofremovecurse.catalog_desc=清除一件物品的诅咒。武器与护甲也会移除诅咒铭文或刻印，被诅咒的负等级物品也会将等级置相反数。同时解除_虚弱_。

items.scrolls.scrollofteleportation.catalog_desc=将使用者随机传送到本层一处可通行的位置。Boss 未被击败时无效，卷轴仍被消耗。

items.scrolls.scrollofupgrade.catalog_desc=使一件可升级物品提升 _1_ 级并回复 _0.5~3.5_ 点压力。武器与护甲有 _1-0.9^当前等级_ 的几率在升级时抹除铭文或刻印，被诅咒的装备可能因此解除诅咒。_天赋异禀_与_铸金大师_挑战下无法使用。

items.scrolls.scrollofrage.catalog_desc=使 _16_ 格内的所有敌人察觉并前往使用者位置，视野内的敌人获得 _5_ 回合_狂怒_并优先攻击其他单位，同时唤醒全层的_宝箱怪_。

items.scrolls.scrollofterror.catalog_desc=使视野内所有敌人获得 _10_ 回合_恐惧_并转身逃跑，受到任意伤害即解除。

items.scrolls.scrolloflullaby.catalog_desc=使视野内所有敌人与使用者自身，先经历 _3~5_ 回合_困倦_倒计时，随后进入魔法睡眠。期间每回合回复 _1_ 点生命与 _0.5_ 点压力，最长 _30_ 回合，受到伤害立即醒来。对免疫_睡眠_者无效。

items.scrolls.scrollofpsionicblast.catalog_desc=对视野内所有敌人造成等于其_当前生命_的魔法伤害；Boss 所受伤害降至 _1/4_，石像降至 _4/5_。使用者自身受到 _max(生命上限/5, 当前生命/2)_ 的魔法伤害，并获得 _6~12_ 回合_虚弱_。

items.scrolls.scrollofmirrorimage.catalog_desc=在周围空格上召唤至多 _3_ 个使用者的_镜像_：每个拥有 _1_ 点生命，攻击必定命中，攻击一次后消散，伤害为召唤时使用者的一次攻击值。附近空格不足时数量减少。

items.scrolls.scrollofcurse.catalog_desc=为一件装备附着_诅咒_，其诅咒状态立即变为已知。

items.scrolls.scrolloflight.catalog_desc=自身获得 _10_ 回合照明，以自身为中心照亮 _5_ 格；同时使 _8_ 格内的敌人获得最长 _7_ 回合的_震撼_（攻击必定落空），并沿远离使用者的方向推开 _8-距离_ 格，撞上障碍者受到 _((距离+1)/2)~距离_ 的魔法伤害并_麻痹_。
