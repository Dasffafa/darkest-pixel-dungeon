windows.wnddonate.info=Мяу... На самом деле нету способа для официального пожертвования, но вы можете поддержать автора через dev.blog. Мяу\n\nКроме сундучка я предложу вам маленький совет. мяу...\nПОМНИ перейди по ссылке если хочешь дать подертвование.\n\n1 Последний релиз DPD всегда доступен через веб ссылку.\n2 Пожертвование не влияет на игру.\n\nИ конечно ты можешь просто посмотреть на кота.\nМяу? Ну, этот кот просто стоит сдесь, Не так ли? Мяу...
