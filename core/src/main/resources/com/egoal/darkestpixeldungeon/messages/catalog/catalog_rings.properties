# 图鉴文本：戒指
#
# 每一条都从实现里读出来，随后的注释给出依据（文件:行）。
items.rings.ringofarcane.catalog_desc=装备时，所有法杖的充能速度变为 _1.06^戒指等级_ 倍：_+1_ 约 _×1.06_，_+5_ 约 _×1.34_，_+10_ 约 _×1.79_；负等级则按同样比例拖慢充能。\n\n此外，只有等级为正，且使用_伤害类法杖_攻击时，才有 _min(100%, 80%×(1-0.925^等级))_ 的几率触发_奥术暴击_，令该次法杖伤害变为 _×1.5_：_+1_ 约 _6%_，_+5_ 约 _25.8%_，_+10_ 约 _43.3%_，概率上限趋近 _80%_。\n\n两枚同类戒指的等级会相加。
# RingOfArcane 依据: items/wands/DamageWand.kt:163-167（roa>0 且 Random.Float()<0.8×(1-0.925^roa) 时 af×1.5 并标记 CRITICAL）; actors/hero/Hero.kt:268-270（wandChargeFactor ×= 1.06^bonus）; items/rings/Ring.kt:238（getBonus 按同 Buff 等级求和）

items.rings.ringofevasion.catalog_desc=完全闪避一次攻击的几率为 _1-(1-0.01×等级)×0.975^等级_：_+1_ 约 _3.5%_，_+5_ 约 _16.3%_，_+10_ 约 _30.1%_。\n\n未能完全闪避时仍会进行_灵巧判定_，戒指把该次判定值乘以 _1.1^等级_，等级越高实际承受的伤害越低：_+5_ 约 _×1.61_，_+10_ 约 _×2.59_。负等级时两者都会反向，使佩戴者更易被命中且受伤更重。
# RingOfEvasion 依据: actors/hero/Hero.kt:403-404（e = 1-0.01×level）; 416（e ×= 0.975^level，返回 1-e）; 429-440（dexRoll 中 Random.Float()<evasionProbability() 直接全额闪避，否则 dex ×= 1.1^roe）; items/rings/Ring.kt:238

items.rings.ringofresistance.catalog_desc=装备时同时提供三份加成。\n\n_魔法抗性 + (50% - 50%×0.8^(等级/2))_：_+1_ 约 _+5.3%_，_+2_ 约 _+10%_，_+10_ 约 _+33.6%_，上限趋近 _50%_。\n_全部元素抗性 + (100% - 100%×0.9^(等级/3))_：_+3_ 约 _+10%_，_+10_ 约 _+29.6%_，上限趋近 _100%_。\n_负面状态持续系数 (1+0.5×等级)/(1+等级)_（等级为负时按 _1_ 计）：_+1_ 为 _0.75_，_+5_ 约 _0.583_，_+10_ 约 _0.545_，下限趋近 _0.5_。\n\n持续系数作用于_燃烧、冰霜、麻痹、中毒、迟缓、灵魂燃烧、眩晕、虚弱、魅惑与酒醉_等负面状态的回合数。
# RingOfResistance 依据: items/rings/RingOfResistance.kt:71（durationFactor）; 77（magicalResistance）; 79（elementalResistance）; 56-66（attach/detach 累加与扣除）; 消费者: actors/buffs/Burning.kt:201、Frost.kt:132、Paralysis.kt:79、Poison.kt:112-115、Slow.kt:52、SoulBurning.kt:102、Vertigo.kt:47、Weakness.kt:64、Charm.kt:82、Drunk.kt:66

items.rings.ringofforce.catalog_desc=戒指等级 _L_ 会换算成一套徒手伤害。先由力量换算_档位_：_档位 = max(1, (力量-8)/2)_，超过 _5_ 的部分减半：_档位 = 5 + (档位-5)/2_，因此每 _2_ 点力量提升 _1_ 档，_18_ 点之后每 _4_ 点才提升 _1_ 档。\n\n徒手攻击（或手持_战斗手套_）的伤害为 _round(档位+L) ~ round(5×(档位+1) + L×(档位+1))_。\n_力量 10_（档位 _1_）：_+0_ 为 _1~10_，_+5_ 为 _6~20_，_+10_ 为 _11~30_。\n_力量 15_（档位 _3.5_）：_+0_ 为 _4~23_，_+5_ 为 _9~45_，_+10_ 为 _14~68_。\n\n持握普通武器时，戒指只提供 _+L_ 点固定伤害；只有手持_战斗手套_时才会额外附加一次完整的徒手伤害掷骰。负等级会使徒手攻击更弱，并拖累武器伤害。
# RingOfForce 依据: items/rings/RingOfForce.kt:48-55（tier 计算）; 57-67（damageRoll、min、max）; actors/hero/Hero.kt:482-498（有武器时 dmg += bonus，战斗手套时 dmg += damageRoll，徒手时取 damageRoll）

items.rings.ringoffuror.catalog_desc=攻击间隔变为 _0.25 + (基础间隔-0.25) × 0.8^等级_，攻击间隔的下限为 _0.25_。\n普通间隔 _1.0_：_+1_ 为 _0.85_，_+5_ 约 _0.496_，_+10_ 约 _0.331_；
# RingOfFuror 依据: items/weapon/Weapon.kt:134-144（speedFactor = 0.25+(delayFactor(DLY)-0.25)×0.8^bonus）; actors/hero/Hero.kt:640-647（徒手 speed ×= 0.25+0.75×0.8^bonus，即间隔 1.0）; 649（max(0.25, speed)）; items/rings/Ring.kt:238

items.rings.ringofhaste.catalog_desc=移动速度变为 _1.2^戒指等级_ 倍：_+1_ 为 _×1.2_，_+2_ 约 _×1.44_，_+5_ 约 _×2.49_，_+10_ 约 _×6.19_。负等级按同样比例减慢移动。
# RingOfHaste 依据: actors/hero/Hero.kt:583-584（speed ×= 1.2^hlvl）; items/rings/Ring.kt:238

items.rings.ringofcritical.catalog_desc=等级为正时，玩家的暴击率先加上 _1%×等级_，随后整体乘以 _1.15^等级_。即 _最终暴击率 = (基础暴击率 + 1%×L) × 1.15^L_；_L≤0_ 时不加固定值，只乘 _1.15^L_。\n以基础暴击率 _10%_ 为例：_+1_ 为 _12.65%_，_+5_ 约 _30.2%_，_+10_ 约 _80.9%_。\n基础 _20%_ 时：_+5_ 约 _50.3%_，_+10_ 已超过 _100%_。\n暴击的倍率与效果由攻击自身决定，戒指只提高触发概率。
# RingOfCritical 依据: actors/hero/Hero.kt:289-298（level>0 时 c += 0.01×level，之后 c ×= 1.15^level）; items/rings/Ring.kt:238

items.rings.ringofmight.catalog_desc=每级提供 _+1 力量_。力量直接影响武器的命中率、伤害与护甲的力量需求惩罚，因此这枚戒指几乎对每个方面都有帮助。\n\n装备时生命上限 _+5×等级_，卸下时如数扣除：_+5_ 为 _+5 力量、+25 生命上限_，_+10_ 为 _+10 力量、+50 生命上限_。\n负等级的戒指会同时降低力量与生命上限。
# RingOfMight 依据: actors/hero/Hero.kt:139-142（STR() += RingOfMight 等级）; items/rings/RingOfMight.kt:29-67（doEquip/doUnequip/upgrade/level 中的 HT ±level×5）

items.rings.ringofsharpshooting.catalog_desc=作用于_投掷与飞弹类武器_，以及作为飞弹释放的_伤害类法杖_：\n命中 _×1.1^等级_：_+5_ 约 _×1.61_，_+10_ 约 _×2.59_。\n伤害 _× (2.5 - 1.5×0.9^等级)_：_+1_ 为 _×1.15_，_+2_ 约 _×1.29_，_+5_ 约 _×1.61_，_+10_ 约 _×1.98_，上限趋近 _×2.5_。\n负等级会使伤害系数小于 _1_，并降低命中。由于伤害是乘法缩放，等级越高每次再升级的收益越小。
# RingOfSharpshooting 依据: items/weapon/Weapon.kt:125-128（MissileWeapon 的 acc ×= 1.1^bonus）; items/weapon/missiles/MissileWeapon.kt:148-156（damage ×= 2.5-1.5×0.9^bonus）; items/wands/DamageWand.kt:156-160（isMissile 的伤害同系数）; items/rings/Ring.kt:238

items.rings.ringofhealth.catalog_desc=装备时按_当时的生命上限_的一个比例提升上限，系数为 _(1.25^(0.3×等级) - 1)_：_+1_ 约 _+6.9%_，_+5_ 约 _+39.8%_，_+10_ 约 _+95.3%_。该增益会在英雄升级、上限变化时按新数值重新计算，所以越到后期收益越大；卸下时按同一数值扣除。\n\n每回合额外回复 _0.0333×等级_ 点生命：_+5_ 约 _+0.167/回合_，_+10_ 为 _+0.333/回合_。等级为负时改为每级 _-0.05/回合_，惩罚比正收益更重。
# RingOfHealth 依据: items/rings/RingOfHealth.kt:34（ratio = 1.25^(level×0.3)-1）; 60-74（attach/detach/modHT）; 90-95（onHeroUpgraded 重算）; actors/hero/Hero.kt:236-239（health<0 → reg += 0.05×health，否则 reg += 0.0333×health）

items.rings.ringofwealth.catalog_desc=财富加值 _L = min(10, 戒指等级)_（_枪骑兵_转职 _-1_，_幸运_状态 _+1_）。\n\n_幸运打击_：每次攻击或施放伤害法杖时进行 _L+1_ 次 _0.889%_ 判定，任一成功即本次攻击_必定命中、必定暴击且伤害取最大值_：_+5_ 约 _5.3%/击_，_+10_ 约 _9.8%/击_。\n\n_未鉴定装备的品质掷骰_：首轮成功率为 _min(100%, 2%+10%×L)_，每成功一次额外获得 _1_ 级并把下一次概率减半。\n_首次拾取_时，等级与诅咒都未知的诅咒装备有 _2%×L_ 的几率被悄悄净化。\n_击杀掉落_：怪物掉落几率 _×1.15^L_（精英怪再 _×2_）。\n_地面物品堆_有 _25%+5%×L_ 的几率额外生成一件物品。\n_陷阱_转为_奖励陷阱_的几率提高 _5%×L_（基础 _20%_）。\n_保留掉落_升级为更优品质的几率为 _0.925^L_。\n_被动探知_在_暗门_上会额外进行 _L/2_ 次判定。
# RingOfWealth 依据: actors/hero/Hero.kt:302-317（wealthBonus 上限 10、转职与幸运修正；rollLuckyStrike n=wealthBonus+1 次 0.00889）; 476-480（幸运打击必中暴击满伤）; items/wands/DamageWand.kt:63; items/Item.kt:112-125（品质掷骰 p=min(1,0.02+0.1×luck)，成功后 p/=2）; 131-145（静默净化 2%×luck）; actors/mobs/Mob.kt:624-628（掉落 ×1.15^luck）; items/Heap.kt:135（0.25+0.05×luck）; levels/Level.kt:818-822（0.2+0.05×luck）; 1040-1042（p=0.925^luck）; actors/hero/Hero.kt:1445-1448（暗门额外 luck/2 次）
