items.weapon.melee.invisibleblade.catalog_desc=每次命中都有 _0.2+0.04×等级_ 的几率将该次伤害变为_纯粹伤害_。该几率随武器等级线性提高，未强化时为 _0.2_。
# BoethiahsBlade 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/BoethiahsBlade.kt:32,34-52,54-106, core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:233-235,1272-1276
items.weapon.melee.boethiahsblade.catalog_desc=命中时附加 _2~本次伤害/4-1_ 的_暗属性_伤害（会被目标的暗影抗性削减），_暴击_时再追加 _3×(等级+2)_ 点伤害，并永久削弱目标的生命上限：物理状态下削弱 _等级+1_，被诅咒时效果为1.5倍，生命上限最低保留 _1_，削减的生命上限会转化为攻击者的护盾。\n装备期间持有者的生命回复降低 _(生命上限+等级×5)×0.005_，一切治疗量减半。卸下需要确认，并会诅咒一件已装备的未诅咒物品，若没有这样的物品则永久降低 _0.2_ 点生命回复。\n卸下时会直接掉落在地，这件物品在地面上的时候无法被拾起。\n武僧、缴械陷阱和小偷均无法在你非自愿的情况下移除这把武器，偷窃失败的小偷还会受到6-12暗属性伤害。
# Flag 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Flag.kt:15,17,19-25
items.weapon.melee.flag.catalog_desc=装备后提供被动减伤：受到物理攻击时减少 _1~(等级+1)_ 点，受到_远程_攻击时翻倍为 _1~2×(等级+1)_ 点，每次的实际数值在范围内随机。即使你的力量不足，该减伤也不受到影响。
# TengusKatana 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/TengusKatana.kt:29-49, core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:555-557
items.weapon.melee.tenguskatana.catalog_desc=_伏击_时，若目标是等级上限不高于你等级加 _5_ 的非 Boss 敌人，就有 _(等级+1)/(10+2×等级)_ 的几率触发斩杀：该次伤害被提高到不低于目标当前的生命上限，并为_纯粹伤害_。未强化时该几率为 _1/10_。
# CarvedStaff 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/CarvedStaff.kt:15-24, core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:75-83
items.weapon.melee.carvedstaff.catalog_desc=附魔后，攻击延迟乘 _0.8_；同时每次攻击会_触发两次_附魔效果。
# Longsword 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Longsword.kt:25-31；无独有机制，不单独列出。

# BattleAxe 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/BattleAxe.kt:25-37；无独有机制，不单独列出。

# Flail 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Flail.kt:25-44; actors/mobs/Mob.kt:514-539、actors/hero/Hero.kt:463-471
items.weapon.melee.flail.catalog_desc=链枷_无法伏击_。
# RunicBlade 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/RunicBlade.kt:25-41（仅重写 max 与 STRReq，数值由面板呈现）；无独有机制，不单独列出。

# AssassinsBlade 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/AssassinsBlade.kt:43-56; items/weapon/Weapon.kt:147-159; actors/hero/Hero.kt:314-318
items.weapon.melee.assassinsblade.catalog_desc=_伏击_时，伤害骰下限为 _(最小值+最大值)/2_，即至少造成最大伤害的 _50%_；伏击时多余的力量全额附加到伤害，而通常武器只额外附加 _1_ 到该超出值之间的随机数。
# SpikeShield 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/SpikeShield.kt:8-28; items/weapon/melee/Shield.kt:41-83; actors/Char.kt:594-597
items.weapon.melee.spikeshield.catalog_desc=受到攻击时先做一次格挡判定，成功则减免 _4+2×等级_ 点，失败仍减免 _4_ 点；判定由攻防双方的技巧决定。受到相邻单位的命中时，盾面尖刺会把当前的格挡值原样送回给攻击者，造成一次独立伤害。魔法伤害与纯粹伤害不经过盾牌结算，因此不会触发反弹。
# Pitchfork 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Pitchfork.kt:11-28; actors/buffs/Bleeding.kt:54-56
items.weapon.melee.pitchfork.catalog_desc=强化草叉的每次命中都有 _1/5_ 的几率使目标_流血_，强度取 _min(10, 本次伤害÷4)_，单次最多 _10_ 点；_流血_每回合结算一次并随回合逐渐衰减。触发只取决于是否命中，伤害被防御挡下时同样照常触发。
# Halberd 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Halberd.kt:10-35
items.weapon.melee.halberd.catalog_desc=斧枪命中目标时，会对目标周围 _8_ 格内的所有敌对单位各追加一次溅射，伤害取 _本次伤害×0.4_（四舍五入），伤害类型与主攻击相同。溅射不会重复命中主目标，也不会波及友方与中立单位。
# Scythe 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Scythe.kt:15-84
items.weapon.melee.scythe.catalog_desc=薙刀镰拥有 _下段_、_中段_、_上段_ 三种架势，可用「切换」动作循环变换（需先鉴定且未被诅咒），切换会消耗一回合；三种架势的伤害、攻速、攻击距离与力量需求各不相同。_上段_ 挥舞时会对目标周围 _8_ 格内的敌对单位造成 _本次伤害的 1/2_ 的溅射，但该架势_无法伏击_：敌人即使尚未察觉你，也会正常进行闪避判定。\n当前架势是武器自身保存的状态，会随着武器一起被带进下一层。
# Kusarigama 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Kusarigama.kt:27-210; actors/buffs/Bleeding.kt:54-56
items.weapon.melee.kusarigama.catalog_desc=锁镰有 _近战形态_ 与 _远程形态_，可用「切换形态」动作互换（需未被诅咒），切换会消耗一回合。_近战形态_ 的伤害只按基准的 _0.50_ 倍计算，_远程形态_ 则提高到 _1.33_ 倍，但只有命中最大攻击距离上的目标才保留这份加成，距离更近时伤害会除以 _1.33_ 退回基准值。在最大距离命中会附加相当于 _伤害0.1倍_ 的_流血_；中距离的攻击本身不结算伤害，而是把敌人拽到身边并使其_残废_ _3_ 回合，随后自动补上一次近战形态的攻击；若目标无法被拉动或通道被阻挡，该次攻击会被取消。完全贴身的敌人在远程形态下够不着，必须先切换形态。
# LongestSpear 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/LongestSpear.kt:14-51; actors/Damage.kt:37-45
items.weapon.melee.longestspear.catalog_desc=当目标与使用者的距离大于 _1_ 格时，每次命中有 _0.1+(距离-1)×0.2+0.5×(1-0.7^(等级÷2))_ 的几率触发「突破」：清空目标的_护盾_，并使该次伤害变为_纯粹伤害_，无视目标的防御与格挡。触发几率随距离与强化等级一同提高，只看距离与武器等级，与目标的护盾余量或抗性无关；距离为 _1_ 格时该机制不触发。
# Claymore 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Claymore.kt:25-31（仅设 tier，无任何重写）；无独有机制，不单独列出。

# WarHammer 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/WarHammer.kt:31（ACC=1.15f）、34-37（重写 max，无 proc 等其它重写）；无独有机制，不单独列出。

# Glaive 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Glaive.kt:25-37（仅 DLY=1.5f、RCH=2、重写 max，无 proc 等其它重写）；无独有机制，不单独列出。

# Greataxe 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Greataxe.kt:43-52（proc 溅射，48 行 dmg.value/2，45 行 NEIGHBOURS8）、SPD-classes/src/main/java/com/watabou/utils/PathFinder.java:71（NEIGHBOURS8 为 8 个相邻格）
items.weapon.melee.greataxe.catalog_desc=每次命中目标时，都会对目标周围 _8_ 格内的所有敌对单位额外造成相当于本次伤害 _1/2_ 的溅射伤害；溅射同样要经过各目标自身的防御结算。溅射只波及主目标周围的 _8_ 格。
# Greatshield 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Greatshield.kt:36（重写 max）、38（def=8+3*level）；core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Shield.kt:48（顶盾 r=1.5）、56-63（defendDamage，成功取 def(level)、失败取 def(0)）、65-80（defendValue：69 行力量不足 -2/点、74 行远程 +1/5、76-79 行魔法 ×2/3）
items.weapon.melee.greatshield.catalog_desc=在被击中时额外判定一次格挡：格挡成功时减免 _8+等级×3_ 点（未强化为 _8_ 点），失败时仍减免 _8_ 点，_顶盾_架势能让格挡判定更容易成功。对远程攻击的格挡量额外提高 _1/5_；力量不足时，每差 _1_ 点力量格挡量减少 _2_ 点。升级只提升成功格挡时的减免量。
# Lance 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Lance.kt:22（canSurpriseAttack=false）、27-33（giveDamage 系数 29 行 3-2*0.8^(2*speed-2)）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:580-613（speed 受加速等影响）、core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:78（baseSpeed=1f）、376-378（残废时速度减半）
items.weapon.melee.lance.catalog_desc=_无法伏击_。造成的伤害会随使用者的_移动速度_变化：最终伤害乘以系数 _3-2×0.8^(2×速度-2)_。速度为 _1_ 时系数恰为 _1_；移动越快加成越高，被_残废_等效果减速时反而会打出更低的伤害。
# LongSpear 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/LongSpear.kt:12（crippleRatio=.2f）、26-35（proc：29 行 Random、30 行 2f+level()、31 行重置 .2f、32 行 +.05f）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:376-378（残废移动速度减半）
items.weapon.melee.longspear.catalog_desc=命中怪物时，按武器自带的几率使其_残废_：初始几率 _20%_，每次未触发就提高 _5%_，一旦触发便重置回 _20%_。_残废_持续 _2+武器等级_ 回合，期间目标的移动速度减半。未触发时提高的几率会一直累加在同一件武器上。
# MagicBow 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/MagicBow.kt:36,44-56,59-60,62-76,83-101; core/src/main/java/com/egoal/darkestpixeldungeon/mechanics/Ballistica.java:50; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.melee.magicbow.catalog_desc=装备后可以执行专属的_射击_：指定目标后箭矢沿直线弹道飞行，只被地形或路径上的第一个单位挡下，可以打到视线所及的任何距离，而且无需消耗任何弹药。射击伤害按_魔法_结算，无视目标护甲提供的防御与护盾、直接削减生命值，但会被魔法抗性削减，命中判定还享受魔法攻击的 _×2_ 加成；开火会立刻破除自身的_隐形_。\n若射击与你_相邻_的敌人，自身会获得_失衡_：_女猎手 1.5_ 回合、其他职业 _2.5_ 回合，其间无法闪避攻击。
# PairSwords 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/PairSwords.kt:19,29-41,45-50,54-56,62-72,74-77,87,90-91,108-114,116-131; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Sword.kt:42-48,61-82
items.weapon.melee.pairswords.catalog_desc=由两把_剑_合成而成（在剑的菜单里执行_双持_），也可以随时_拆分_还原（被诅咒时无法拆分），但自身_无法直接升级_，需拆开后分别强化再合并。伤害与命中都取决于两把剑的等级是否接近：等级相同时最大伤害 ×_7/4_，相差 _1_ 级 ×_6/4_，相差 _2_ 级 ×_5/4_，相差 _3_ 级以上则只有 ×_4/5_；命中同样随等级差变化，差越小越准。\n两把剑各自保留自己的_附魔_与_铭文_，攻击时两边的效果都会触发（先右剑后左剑）；新的附魔与铭文会优先加在还没有的那一把上，而解除诅咒铭文每次只能清掉一把（优先左手）。
# Boomerang 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Boomerang.kt:45-49,66-70,83-87,89-107,109-111,113-132,136-156,214-219; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:98-104,123-132; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:373-383; core/src/main/java/com/egoal/darkestpixeldungeon/items/specials/Shadowmoon.kt:67-76,155; SPD-classes/src/main/java/com/watabou/utils/Random.java:49-51
items.weapon.missiles.boomerang.catalog_desc=投出后无条件飞回使用者手中，可以反复使用。一般投掷武器在相邻格投掷时命中会降到 _0.4 倍_，回旋镖不受此影响。\n_星月骑士_命中时可为_影月_充能：每次成功命中累计 _1_ 次，累计满 _5_ 次即可发动；\n_星月骑士_也可装备作为近战武器，装备后近战命中同样为_影月_充能，并在受到攻击时额外减免 _1~等级_ 点伤害（_+0_ 时固定为 _1_ 点）。\n\n经_伟大图纸_强化后还会获得 _1_ 次_弹射_：首次命中后自动飞向 _4_ 格内的另一名敌人，找不到目标就直接回手。
# Dart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Dart.kt:25,30; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:74-80,123-132,154-156; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/PinCushion.kt:34-48; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:465-467; core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:42,185; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47
items.weapon.missiles.dart.catalog_desc=飞镖命中后会插在目标身上。随机生成时每堆 _5~13_ 支；相邻格投掷时命中会降至 _0.4 倍_。
# SmokeSparks 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SmokeSparks.kt:22-36; core/src/main/java/com/egoal/darkestpixeldungeon/actors/blobs/SmokeOfBlindness.kt:16-21; core/src/main/java/com/egoal/darkestpixeldungeon/actors/blobs/Blob.kt:148-198,229-239; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:548-556; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47
items.weapon.missiles.smokesparks.catalog_desc=命中目标时目标立刻_失明_ _3_ 回合，_必定命中_。投掷后在落点留下80单位的致盲烟雾：烟雾只沿非实心格扩散并逐回合衰减，烟雾中每个单位每回合都会刷新 _1~2_ 回合的_失明_，使用者自己也会被波及。随机生成时每堆 _3~4_ 个。
# Salt 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Salt.kt:10-31; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.missiles.salt.catalog_desc=投掷造成_魔法_伤害，_必定命中_。投空时也会直接消失。
# RefinedSalt 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Salt.kt:34-53; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.missiles.refinedsalt.catalog_desc=投掷造成的伤害按_魔法_结算：无视目标护甲提供的防御与护盾、直接削减生命值，但会被魔法抗性削减；同时这次伤害带_必定命中_特性，落点只要有敌人就一定会命中，不会被闪避掉。投空时它同样只化作一阵水汽，不会落在格子上。精炼盐的机制与粗盐完全一致，仅品阶更高。
# Shuriken 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Shuriken.kt:27-41; core/src/main/java/com/egoal/darkestpixeldungeon/items/armor/HuntressArmor.kt:39-42; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:31-40,76-80,154-156
items.weapon.missiles.shuriken.catalog_desc=手里剑没有任何附加状态，也不钉入敌人体内；生成时一叠通常有 _7~15_ 枚。\n女猎手护甲的专属特技「幻影飞刀」便是以手里剑的形式，向视野内 _8_ 格以内的每个敌人各掷出一枚。
# SwallowDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SwallowDart.kt:5-11; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80
items.weapon.missiles.swallowdart.catalog_desc=燕尾镖的精准较高。
# IncendiaryDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/IncendiaryDart.kt:37,45-51,53,55-58,60-63; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Burning.kt:157-159,194; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:595-599
items.weapon.missiles.incendiarydart.catalog_desc=命中会让目标_燃烧_ _8_ 回合，之后每回合持续掉血。掷向没有敌人且可燃的地面时，飞镖不会落地，而是直接引燃那一格，留下强度 _4_ 的火焰；命中时也一样，即使伤害被护甲全部挡下，点燃依然生效。\n它是一次性投掷物，掷出即消耗，不会钉在敌人身上，也没有回收手段。
# CurareDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/CurareDart.kt:31,39-42,44,46-49,51-53; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Paralysis.kt:35-42; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:230-234
items.weapon.missiles.curaredart.catalog_desc=命中后让目标_麻痹_ _3_ 回合：_麻痹_期间它完全无法行动，既不能移动也不能攻击。效果不依赖伤害高低，只要打中就会生效，被护甲挡下也不影响。\n它是一次性消耗品，掷出即碎，不会留在敌人体内；生成时一叠只有 _2~4_ 枚。_麻痹_本身不造成伤害。
# CeremonialDagger 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/CeremonialDagger.kt:30-31,33-35,37,43-53,57-58,60-89,92-95
items.weapon.missiles.ceremonialdagger.catalog_desc=专属的_献祭_动作消耗一把匕首：第 _n_ 次献祭对自己造成 _最大生命/10×n_ 点_纯粹伤害_（无视护甲，最少 _1_ 点），并附加强度为 _最大生命/20×n_ 的_流血_；若这一下会打掉你当前生命的 _2/3_ 以上，游戏会先弹出确认窗。\n之后回复 _20~30_ 点理智，取值是 _20_ 与 _当前压力×0.4_ 之间的随机数并以 _30_ 封顶，与献祭次数无关；而自伤与_流血_强度会随次数不断累加。
# FlyCutter 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/FlyCutter.kt:5-10; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroClass.kt:257-259
items.weapon.missiles.flycutter.catalog_desc=飞刀没有任何附加效果、特殊判定或钉入能力，也不会留下任何后续效果，掷出后若未损坏就落在敌人脚下，捡回来可以继续用。\n它是_流放者_出身时随身携带的投掷物。
# SeventhDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SeventhDart.kt:9,16,18,20-23; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:54-56,64-90
items.weapon.missiles.seventhdart.catalog_desc=命中会给目标挂上_流血_，强度固定为_目标最大生命值的 1/10_，与这一击打出的伤害无关；此后每回合都在_强度的一半到强度_之间随机结算一次流血伤害，并逐回合衰减，直到归零。\n它不钉入敌人，未损坏时落在敌人脚下可以捡回；若目标身上已有更强的流血，则两者取较高者。
# Javelin 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Javelin.kt:31,39,41-44; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Cripple.kt:50; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:376-378; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/PinCushion.kt:44-48
items.weapon.missiles.javelin.catalog_desc=命中后让目标_残废_ _10_ 回合，移动速度减半；它的攻击速度不受影响。\n标枪会_钉在敌人体内_：只要这一击没有损坏且目标还活着，它就会留在对方身上，等敌人死亡后才掉落，可以捡回来继续用。
# Tamahawk 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Tamahawk.kt:31,39,41-44; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80,134-152; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:595-599; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:54-56
items.weapon.missiles.tamahawk.catalog_desc=命中后附加_流血_，强度就等于这一击经护甲减免后的伤害点数；若目标身上已有更强的流血，则保留较高者。\n飞斧不钉入敌人，未损坏时落在敌人脚下可以捡回。
