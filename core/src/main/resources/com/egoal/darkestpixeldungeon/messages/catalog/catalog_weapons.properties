# AssassinsBlade 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/AssassinsBlade.kt:43-56; items/weapon/Weapon.kt:147-159; actors/hero/Hero.kt:314-318
items.weapon.melee.assassinsblade.catalog_desc=_伏击_时，伤害骰下限为 _(最小值+最大值)/2_，即至少造成最大伤害的 _50%_；伏击时多余的力量全额附加到伤害，而通常武器只额外附加 _1_ 到该超出值之间的随机数。
# SpikeShield 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/SpikeShield.kt:8-28; items/weapon/melee/Shield.kt:41-83; actors/Char.kt:594-597
items.weapon.melee.spikeshield.catalog_desc=受到攻击时先做一次格挡判定，成功则减免 _4+2×等级_ 点，失败仍减免 _4_ 点；判定由攻防双方的技巧决定。受到相邻单位的命中时，盾面尖刺会把当前的格挡值原样送回给攻击者，造成一次独立伤害。魔法伤害与纯粹伤害不经过盾牌结算，因此不会触发反弹。
# Pitchfork 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Pitchfork.kt:11-28; actors/buffs/Bleeding.kt:54-56
items.weapon.melee.pitchfork.catalog_desc=强化草叉的每次命中都有 _1/5_ 的几率使目标_流血_，强度取 _min(10, 本次伤害÷4)_，单次最多 _10_ 点；_流血_每回合结算一次并随回合逐渐衰减。
# Halberd 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Halberd.kt:10-35
items.weapon.melee.halberd.catalog_desc=斧枪命中目标时，会对目标周围 _8_ 格内的所有敌对单位各追加一次溅射，伤害取 _本次伤害×0.4_（四舍五入），伤害类型与主攻击相同。溅射不会重复命中主目标，也不会波及友方与中立单位。
# Scythe 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Scythe.kt:15-84
items.weapon.melee.scythe.catalog_desc=薙刀镰拥有 _下段_、_中段_、_上段_ 三种架势，可用「切换」动作循环变换（需先鉴定且未被诅咒），切换会消耗一回合；三种架势的伤害、攻速、攻击距离与力量需求各不相同。_上段_ 挥舞时会对目标周围 _8_ 格内的敌对单位造成 _本次伤害的 1/2_ 的溅射，但该架势_无法伏击_。\n_中段_架势是常规的长柄远程武器。\n_下段_是力量需求较少的快速近战武器。\n当前架势是武器自身保存的状态，会随着武器一起被带进下一层。
# Kusarigama 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Kusarigama.kt:27-210; actors/buffs/Bleeding.kt:54-56
items.weapon.melee.kusarigama.catalog_desc=锁镰有 _近战形态_ 与 _远程形态_，可用「切换形态」动作互换（需未被诅咒），切换会消耗一回合。_近战形态_ 的伤害只按基准的 _0.50_ 倍计算，攻击间隔是0.66，_远程形态_ 攻击间隔是1.5，伤害提高到 _1.33_ 倍，附加相当于 _伤害1/7_ 的_流血_，但只能命中最大攻击距离上的目标。中距离的攻击本身不结算伤害，而是把敌人拽到身边并使其_残废_ _3_ 回合，随后自动补上一次近战形态的攻击；若目标无法被拉动或通道被阻挡，该次攻击会被取消。完全贴身的敌人在远程形态下够不着，必须先切换形态。
# LongestSpear 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/LongestSpear.kt:14-51; actors/Damage.kt:37-45
items.weapon.melee.longestspear.catalog_desc=当目标与使用者的距离大于 _1_ 格时，每次命中有 _0.1+(距离-1)×0.2+0.5×(1-0.7^(等级÷2))_ 的几率触发「突破」：清空目标的_护盾_，并使该次伤害变为_纯粹伤害_，无视目标的防御与格挡。距离为 _1_ 格时该机制不触发。
# Claymore 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Claymore.kt:25-31（设 tier，无任何重写）；无独有机制，不单独列出。

# WarHammer 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/WarHammer.kt:31（ACC=1.15f）、34-37（重写 max，无 proc 等其它重写）；无独有机制，不单独列出。

# Glaive 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Glaive.kt:25-37（ DLY=1.5f、RCH=2、重写 max，无 proc 等其它重写）；无独有机制，不单独列出。

# Greataxe 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Greataxe.kt:43-52（proc 溅射，48 行 dmg.value/2，45 行 NEIGHBOURS8）、SPD-classes/src/main/java/com/watabou/utils/PathFinder.java:71（NEIGHBOURS8 为 8 个相邻格）
items.weapon.melee.greataxe.catalog_desc=每次命中目标时，都会对目标周围 _8_ 格内的所有敌对单位额外造成相当于本次伤害 _1/2_ 的溅射伤害；溅射同样要经过各目标自身的防御结算。溅射只波及主目标周围的 _8_ 格。
# Greatshield 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Greatshield.kt:36（重写 max）、38（def=8+3*level）；core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Shield.kt:48（顶盾 r=1.5）、56-63（defendDamage，成功取 def(level)、失败取 def(0)）、65-80（defendValue：69 行力量不足 -2/点、74 行远程 +1/5、76-79 行魔法 ×2/3）
items.weapon.melee.greatshield.catalog_desc=在被击中时额外判定一次格挡：格挡成功时减免 _8+等级×3_ 点（未强化为 _8_ 点），失败时仍减免 _8_ 点，_顶盾_架势能让格挡判定更容易成功。对远程攻击的格挡量额外提高 _1/5_；力量不足时，每差 _1_ 点力量格挡量减少 _2_ 点。升级只提升成功格挡时的减免量。
# Lance 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Lance.kt:22（canSurpriseAttack=false）、27-33（giveDamage 系数 29 行 3-2*0.8^(2*speed-2)）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:580-613（speed 受加速等影响）、core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:78（baseSpeed=1f）、376-378（残废时速度减半）
items.weapon.melee.lance.catalog_desc=_无法伏击_。造成的伤害会随使用者的_移动速度_变化：最终伤害乘以系数 _3-2×0.8^(2×速度-2)_。速度为 _1_ 时系数恰为 _1_；移动越快加成越高，被_残废_等效果减速时反而会打出更低的伤害。
# LongSpear 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/LongSpear.kt:12（crippleRatio=.2f）、26-35（proc：29 行 Random、30 行 2f+level()、31 行重置 .2f、32 行 +.05f）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:376-378（残废移动速度减半）
items.weapon.melee.longspear.catalog_desc=命中怪物时，按武器自带的几率使其_残废_：初始几率 _20%_，每次未触发就提高 _5%_，一旦触发便重置回 _20%_。_残废_持续 _2+武器等级_ 回合，期间目标的移动速度减半。未触发时提高的几率会一直累加在同一件武器上。
# MagicBow 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/MagicBow.kt:36,44-56,59-60,62-76,83-101; core/src/main/java/com/egoal/darkestpixeldungeon/mechanics/Ballistica.java:50; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.melee.magicbow.catalog_desc=装备后可以执行专属的_射击_：指定目标后箭矢沿直线弹道飞行，只被地形或路径上的第一个单位挡下，可以打到视线所及的任何距离，而且无需消耗任何弹药。射击伤害按_魔法_结算，无视目标护甲提供的防御与护盾、直接削减生命值，但会被魔法抗性削减，命中判定还享受魔法攻击的 _×2_ 加成；开火会立刻破除自身的_隐形_。\n若射击与你_相邻_的敌人，自身会获得_失衡_：_女猎手 1.5_ 回合、其他职业 _2.5_ 回合，其间无法闪避攻击。
# PairSwords 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/PairSwords.kt:19,29-41,45-50,54-56,62-72,74-77,87,90-91,108-114,116-131; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/Sword.kt:42-48,61-82
items.weapon.melee.pairswords.catalog_desc=由两把_剑_合成而成（在剑的菜单里执行_双持_），也可以随时_拆分_还原（被诅咒时无法拆分），但自身_无法直接升级_，需拆开后分别强化再合并。伤害与命中都取决于两把剑的等级是否接近：等级相同时最大伤害 ×_7/4_，相差 _1_ 级 ×_6/4_，相差 _2_ 级 ×_5/4_，相差 _3_ 级以上则只有 ×_4/5_；命中同样随等级差变化，差越小越准。\n两把剑各自保留自己的_附魔_与_铭文_，攻击时两边的效果都会触发（先右剑后左剑）；新的附魔与铭文会优先加在还没有的那一把上，而解除诅咒铭文每次只能清掉一把（优先左手）。
# Boomerang 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Boomerang.kt:45-49,66-70,83-87,89-107,109-111,113-132,136-156,214-219; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:98-104,123-132; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:373-383; core/src/main/java/com/egoal/darkestpixeldungeon/items/specials/Shadowmoon.kt:67-76,155; SPD-classes/src/main/java/com/watabou/utils/Random.java:49-51
items.weapon.missiles.boomerang.catalog_desc=投出后无条件飞回使用者手中，可以反复使用。一般投掷武器在相邻格投掷时命中会降到 _0.4 倍_，回旋镖不受此影响。\n_星月骑士_命中时可为_影月_充能：每次成功命中累计 _1_ 次，累计满 _5_ 次即可发动；\n_星月骑士_也可装备作为近战武器，装备后近战命中同样为_影月_充能，并在受到攻击时额外减免 _1~等级_ 点伤害（_+0_ 时固定为 _1_ 点）。\n\n经_伟大图纸_强化后还会获得 _1_ 次_弹射_：首次命中后自动飞向 _4_ 格内的另一名敌人，找不到目标就直接回手。
# Dart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Dart.kt:25,30; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:74-80,123-132,154-156; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/PinCushion.kt:34-48; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:465-467; core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:42,185; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47
items.weapon.missiles.dart.catalog_desc=飞镖命中后会插在目标身上。随机生成时每堆 _5~13_ 支；相邻格投掷时命中会降至 _0.4 倍_。
# SmokeSparks 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SmokeSparks.kt:22-36; core/src/main/java/com/egoal/darkestpixeldungeon/actors/blobs/SmokeOfBlindness.kt:16-21; core/src/main/java/com/egoal/darkestpixeldungeon/actors/blobs/Blob.kt:148-198,229-239; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:548-556; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47
items.weapon.missiles.smokesparks.catalog_desc=命中目标时目标立刻_失明_ _3_ 回合，_必定命中_。投掷后在落点留下80单位的致盲烟雾：烟雾只沿非实心格扩散并逐回合衰减，烟雾中每个单位每回合都会刷新 _1~2_ 回合的_失明_，使用者自己也会被波及。随机生成时每堆 _3~4_ 个。
# Salt 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Salt.kt:10-31; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.missiles.salt.catalog_desc=投掷造成_魔法_伤害，_必定命中_。投空时也会直接消失。
# RefinedSalt 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Salt.kt:34-53; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:221,249-250,561-564,595-597
items.weapon.missiles.refinedsalt.catalog_desc=投掷造成的伤害按_魔法_结算：无视目标护甲提供的防御与护盾、直接削减生命值，但会被魔法抗性削减；同时这次伤害带_必定命中_特性，落点只要有敌人就一定会命中，不会被闪避掉。投空时它同样只化作一阵水汽，不会落在格子上。精炼盐的机制与粗盐完全一致，品阶更高。
# Shuriken 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Shuriken.kt:27-41; core/src/main/java/com/egoal/darkestpixeldungeon/items/armor/HuntressArmor.kt:39-42; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:31-40,76-80,154-156
items.weapon.missiles.shuriken.catalog_desc=手里剑没有任何附加状态，也不钉入敌人体内；生成时一叠通常有 _7~15_ 枚。\n女猎手护甲的专属特技「幻影飞刀」便是以手里剑的形式，向视野内 _8_ 格以内的每个敌人各掷出一枚。
# SwallowDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SwallowDart.kt:5-11; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80
items.weapon.missiles.swallowdart.catalog_desc=燕尾镖的精准较高。
# IncendiaryDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/IncendiaryDart.kt:37,45-51,53,55-58,60-63; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Burning.kt:157-159,194; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:595-599
items.weapon.missiles.incendiarydart.catalog_desc=命中会让目标_燃烧_ _8_ 回合，之后每回合持续掉血。掷向没有敌人且可燃的地面时，飞镖不会落地，而是直接引燃那一格，留下强度 _4_ 的火焰；命中时也一样，即使伤害被护甲全部挡下，点燃依然生效。\n它是一次性投掷物，掷出即消耗，不会钉在敌人身上，也没有回收手段。
# CurareDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/CurareDart.kt:31,39-42,44,46-49,51-53; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Paralysis.kt:35-42; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:230-234
items.weapon.missiles.curaredart.catalog_desc=命中后让目标_麻痹_ _3_ 回合：_麻痹_期间它完全无法行动，既不能移动也不能攻击。效果不依赖伤害高低，只要打中就会生效，被护甲挡下也不影响。\n它是一次性消耗品，掷出即碎，不会留在敌人体内；生成时一叠只有 _2~4_ 枚。_麻痹_本身不造成伤害。
# CeremonialDagger 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/CeremonialDagger.kt:30-31,33-35,37,43-53,57-58,60-89,92-95
items.weapon.missiles.ceremonialdagger.catalog_desc=专属的_献祭_动作消耗一把匕首：第 _n_ 次献祭对自己造成 _最大生命/10×n_ 点_纯粹伤害_（无视护甲，最少 _1_ 点），并附加强度为 _最大生命/20×n_ 的_流血_；若这一下会打掉你当前生命的 _2/3_ 以上，游戏会先弹出确认窗。\n之后回复 _20~30_ 点理智，取值是 _20_ 与 _当前压力×0.4_ 之间的随机数并以 _30_ 封顶，与献祭次数无关；而自伤与_流血_强度会随次数不断累加。
# FlyCutter 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/FlyCutter.kt:5-10; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroClass.kt:257-259
items.weapon.missiles.flycutter.catalog_desc=飞刀没有任何附加效果、特殊判定或钉入能力，也不会留下任何后续效果，掷出后若未损坏就落在敌人脚下，捡回来可以继续用。\n它是_流放者_出身时随身携带的投掷物。
# SeventhDart 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/SeventhDart.kt:9,16,18,20-23; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:54-56,64-90
items.weapon.missiles.seventhdart.catalog_desc=命中会给目标挂上_流血_，强度固定为_目标最大生命值的 1/10_，与这一击打出的伤害无关；此后每回合都在_强度的一半到强度_之间随机结算一次流血伤害，并逐回合衰减，直到归零。\n它不钉入敌人，未损坏时落在敌人脚下可以捡回；若目标身上已有更强的流血，则两者取较高者。
# Javelin 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Javelin.kt:31,39,41-44; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Cripple.kt:50; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:376-378; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/PinCushion.kt:44-48
items.weapon.missiles.javelin.catalog_desc=命中后让目标_残废_ _10_ 回合，移动速度减半；它的攻击速度不受影响。\n标枪会_钉在敌人体内_：只要这一击没有损坏且目标还活着，它就会留在对方身上，等敌人死亡后才掉落，可以捡回来继续用。
# Tamahawk 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Tamahawk.kt:31,39,41-44; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-80,134-152; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:595-599; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:54-56
items.weapon.missiles.tamahawk.catalog_desc=命中后附加_流血_，强度就等于这一击经护甲减免后的伤害点数；若目标身上已有更强的流血，则保留较高者。\n飞斧不钉入敌人，未损坏时落在敌人脚下可以捡回。

# ---- 武器铭文（Inscription，正面）----
# Dazzling 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Dazzling.kt:36-52（命中 proc：43 行 Random.Int(等级+5)>=4 判定，45 行失明 Random.Float(1,1+等级)，46 行残废 Random.Float(1,1+等级/2)）; SPD-classes/src/main/java/com/watabou/utils/Random.java:41-43（Int(max) 取 0~max-1）; SPD-classes/src/main/java/com/watabou/utils/Random.java:27-29（Float(min,max) 取 min~max 浮点）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:376-378（残废时移动速度×0.5）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:100-103（每次命中依序执行铭文 proc）
items.weapon.inscriptions.dazzling.catalog_desc=每次命中都有 _(等级+1)/(等级+5)_ 的几率使目标_失明_ _1~等级+1_ 回合、并_残废_ _1~1+等级/2_ 回合，时长均为浮点随机值；_残废_期间移动速度减半。未强化时几率仅 _20%_，等级越高触发越频繁、持续也越长；重复命中会刷新两项状态的时长。
# Eldritch 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Eldritch.kt:34-52（42 行同 (等级+1)/(等级+5) 判定，44-48 行目标是英雄则 Vertigo.duration，否则 Terror.DURATION 并把 objectid 设为攻击者）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Vertigo.kt:43-48（DURATION=10，受抗性系数缩减）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Terror.kt:51-52（DURATION=10）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:348（恐惧→FLEEING，会逃离）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:478-486（眩晕时相邻移动会随机偏移一格）; core/src/main/java/com/egoal/darkestpixeldungeon/items/rings/RingOfResistance.kt:69-73（抗性系数缩减负面状态时长）
items.weapon.inscriptions.eldritch.catalog_desc=每次命中都有 _(等级+1)/(等级+5)_ 的几率使目标陷入 _10_ 回合的_恐惧_或_眩晕_；未强化时几率仅 _20%_。目标不是英雄时施加_恐惧_，它会逃离攻击者；目标是英雄时改为_眩晕_，令其每次移动随机偏移一格。_眩晕_的时长还会被目标身上的_抗性_属性按系数缩减。
# Lucky 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Lucky.kt:35-49（37-38 行取 wealth 与 baseChance=0.55+0.05×wealth，39 行叠加累计 chanceFix 并夹在 0~1，41 行判定；成功 42 行伤害×2.5 四舍五入并清零 chanceFix，失败 45 行伤害归零、46 行 chanceFix+=0.01×等级）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:302-308（wealthBonus=财富之戒加成，流放者-1，幸运等级加成）
items.weapon.inscriptions.lucky.catalog_desc=每次命中必定触发：以 _55%+5%×财富加成_ 的几率把本次伤害乘以 _2.5_（四舍五入），失败时本次伤害直接归零。每次失败都会让下一次的几率提高 _1%×等级_，且该补偿会一直累积到成功为止；几率上限为 _100%_。未强化且没有财富加成时，命中只有 _55%_ 打出 _2.5_ 倍伤害，其余 _45%_ 完全打空。
# Projecting 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Projecting.kt:28-34（proc 本身无任何效果）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:182（reachFactor=RCH+1）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:617-632（近战可达判定使用 reachFactor，需路径可绕到）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:51-57（投掷目标在 4 格内且为非实心格时直接返回该格）; core/src/main/java/com/egoal/darkestpixeldungeon/items/Item.kt:450-452（默认 throwPos 以弹道计算碰撞点）
items.weapon.inscriptions.projecting.catalog_desc=它本身不改变伤害，而是让武器攻击得更远：_近战_攻击距离 +_1_ 格，可以打到不相邻、但在射程内且路径可绕到的敌人；_投掷武器_则可以把落点选在 _4_ 格内任意非实心格上，无视普通弹道的阻挡，直接命中该格上的敌人。
# Storming 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Storming.kt:16-29（对手 id 与上次相同则 acc+=max(1,等级) 并把 acc 加入伤害，否则仅记录新 id 并清零 acc）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Storming.kt:31-41（id 与 acc 随武器一起存档）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:100-103（每次命中依序执行铭文 proc）
items.weapon.inscriptions.storming.catalog_desc=对_同一个敌人_连续命中时伤害会逐次叠高：首次命中无加成，第 _n_ 次连续命中额外造成 _(n-1)×max(1,武器等级)_ 点伤害；中途更换目标则累计清零。未强化时为 _1×(n-1)_ 点，_+3_ 时为 _3×(n-1)_ 点。该累计值会随武器一起保存，因此攻速快的武器收益更大。
# Heavy 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Heavy.kt:9-16（13 行 str=max(1,STRReq()-10+等级)，14 行 Random.Int(1,str) 加入伤害）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/MeleeWeapon.kt:40-42（STRReq(lvl)=8+2×tier-(lvl+1)/2）; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47（Int(min,max) 取 min~max-1）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:100-103（每次命中依序执行铭文 proc）
items.weapon.inscriptions.heavy.catalog_desc=每次命中都额外附加一段随机伤害，上限随_武器力量需求_提高，因此越重、品阶越高的武器收益越大。具体为 _1~(max(1,力量需求-10+等级)-1)_ 点：_一阶_武器未强化时力量需求仅 _10_，只会稳定附加 _1_ 点；_五阶_武器未强化时上限为 _8_，附加 _1~7_ 点。
# Suppress 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Suppress.kt:15-23（proc：pm=1-目标HP/HT，ratio=1+pm³×(等级>3?1:.5)，damage.value×ratio 取整；等级=max(0,weapon.level())）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:100-120（铭文 proc 在每次命中时必定执行，无内置几率）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:592-599（武器 proc 在护甲 defendDamage 之后结算，故基于经护甲减免后的伤害）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38（正面铭文按 70/30/0 分三组，Suppress 属权重 70% 的第 0 组）
items.weapon.inscriptions.suppress.catalog_desc=每次命中必定生效，没有触发几率：目标已损失的生命比例越高，这一击越重。加成系数为 _1+(1-当前生命/生命上限)³×(等级>3 ? 1 : 0.5)_，即目标满血时无加成，濒死时最多提高 _100%_（武器等级不高于 _3_ 时只提高 _50%_）。数值向下取整后计入伤害，等级按 _max(0,武器等级)_ 计。
# Vorpal 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Vorpal.kt:36-51（proc：Random.Int(等级+3)>=2 时 Buff.affect(Bleeding).set(damage.value/4)；等级=max(0,weapon.level())）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Vorpal.kt:38-40（注释给出 lvl0 33%、lvl1 50%、lvl2 60%）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:54-56（set 只取较大值，不叠加）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Bleeding.kt:64-70（每回合先 level=NormalIntRange(level/2,level)，再按该值造成伤害并衰减）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38（第 0 组）
items.weapon.inscriptions.vorpal.catalog_desc=每次命中都有 _(等级+1)/(等级+3)_ 的几率使目标_流血_，强度为本次伤害（经护甲减免后）的 _1/4_；未强化时几率约 _33%_，_+1_ 约 _50%_，_+2_ 约 _60%_。_流血_每回合结算一次，强度在每回合开始时衰减为 _随机(强度/2~强度)_ 并据此刻造成伤害，因此逐回合减弱直至归零；重复命中取较高强度，不会叠加。等级按 _max(0,武器等级)_ 计。
# Grim 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Grim.kt:37-58（proc：enemyHealth=HP-damage.value，为 0 时不触发；chance=round((HT-enemyHealth)/HT×30+等级)，Random.Int(100)<chance 时对目标 takeDamage(Damage(defender.HP,…).type(MAGICAL).addFeature(DEATH))；等级=max(0,weapon.level())）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:566-569（DEATH 特征对 BOSS 伤害÷4）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Statue.kt:128-131（DEATH 特征对石像伤害×4/5）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:201-205,345-352（魔法伤害经 magicalResistance 削减，非纯粹伤害）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38（第 1 组）
items.weapon.inscriptions.grim.catalog_desc=每次命中时，按 _四舍五入((目标受击后预计损失的生命/生命上限)×30+等级)_ 的几率发动斩杀：立刻对目标造成等于其_当前生命_的_魔法_伤害，可无视护甲但会被魔法抗性削减，对 _Boss_ 只造成该伤害的 _1/4_，对石像造成 _4/5_。目标生命越低几率越高，濒死时约为 _30+等级_（%）；若目标被这一击斩杀，本次普通伤害不再结算。等级按 _max(0,武器等级)_ 计。
# Stunning 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Stunning.kt:36-48（proc：Random.Int(等级+8)>=7 时 Buff.prolong(Paralysis, Random.Float(1,1.5+等级))；等级=max(0,weapon.level())）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Stunning.kt:38-40（注释给出 lvl0 13%、lvl1 22%、lvl2 30%）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Buff.kt:105（prolong 只延长持续时间，不缩短）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Paralysis.kt:35-48（以 paralysed 计数标记麻痹）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:514-524（麻痹时闪避判定为 0）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38（第 1 组）
items.weapon.inscriptions.stunning.catalog_desc=每次命中都有 _(等级+1)/(等级+8)_ 的几率使目标_麻痹_ _随机(1~1.5+等级)_ 回合；未强化时几率约 _13%_，_+1_ 约 _22%_，_+2_ 约 _30%_。_麻痹_期间目标完全无法行动，且被看见时闪避判定为 _0_，无法闪避攻击；重复命中只延长持续时间，不会叠加。等级按 _max(0,武器等级)_ 计。
# Vampiric 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Vampiric.kt:34-54（proc：目标不含 UNDEAD/MACHINE 时 maxValue=round(damage.value×(等级+10)/(等级+40))，effValue=min(Random.IntRange(0,maxValue), attacker.HT-attacker.HP)，effValue>0 时 attacker.recoverHP；等级=max(0,weapon.level())）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:385-395（recoverHP 上限为 HT）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:520-527（Property.UNDEAD/MACHINE 定义）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38（第 1 组）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/npcs/Statuary.kt:203-208（恶魔雕塑献血奖励分支中 1/5 几率刻上血饮）
items.weapon.inscriptions.vampiric.catalog_desc=目标既非_亡灵_也非_机械_时，每次命中吸取生命：回复量为 _0~round(本次伤害×(等级+10)/(等级+40))_ 之间的随机整数，并受自身缺失生命限制，最多回满。未强化时上限为本次伤害的 _1/4_，_+1_ 约 _26.8%_，_+2_ 约 _28.6%_。对_亡灵_与_机械_无效；自身满血时不会回复。等级按 _max(0,武器等级)_ 计。
# Holy 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/inscriptions/Holy.kt:17-34（proc：对 UNDEAD/DEMONIC 的 Mob 播放粒子；未暴击且有 10% 几率 value+=value/4 并加 CRITICAL；始终 setAdditionalDamage(Holy, value/4)）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Damage.kt:61-70（setAdditionalDamage：同元素叠加，否则取较大值）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:348-352（附加元素伤害按目标元素抗性增减，负抗性会放大）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:90-99（Mob 由配置写入元素抗性）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Wraith.kt:54-56（亡灵 圣抗 -0.5）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Yog.kt:198-201（恶魔 圣抗 -0.25）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Inscription.kt:32-38,47（第 2 组权重 0，randomPositive 不会取到）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/npcs/Statuary.kt:99-128（女神雕塑祈祷时 dice 8/9 刻上圣洁，需手持武器）
items.weapon.inscriptions.holy.catalog_desc=每次命中都额外附加相当于本次伤害 _1/4_ 的_圣_属性伤害；该附加伤害会按目标的_圣_抗性增减，_亡灵_与_恶魔_通常为负抗性（例如 _-0.5_、_-0.25_），因此实际受到的额外伤害更高，命中它们时还会迸出暗影粒子作提示。此外有 _10%_ 的独立几率触发暴击：若本次伤害尚未是暴击，则提高 _1/4_ 并标记为暴击；角色原本的暴击判定不受影响。附加伤害按暴击判定后的伤害值计算。\n圣洁无法从随机武器上出现（其分组权重为 _0_），只能在_女神雕塑_前祈祷时以 _2/10_ 的几率被刻上（需手持武器）。

# ---- 武器诅咒铭文（Inscription.Curse，负面）----
# Annoying 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Annoying.kt:40-54（命中时 Random.Int(20)==0 触发，对全层 mobs 调 beckon(attacker.pos)、Invisibility.dispel() 并喊话）; actors/mobs/Mob.kt:676-684（beckon 令敌人 notice 并朝目标格移动）; actors/buffs/Invisibility.kt:75-79（dispel 解除隐形与暗影斗篷潜行）; items/weapon/Weapon.kt:100-120（每次命中依次触发铭文 proc）; actors/hero/Hero.kt:655-658（英雄攻击后调用武器 proc）; SPD-classes/src/main/java/com/watabou/utils/Random.java:41-43（Int(20)==0 即 1/20）
items.weapon.curses.annoying.catalog_desc=每次攻击命中时都有 _5%_（_1/20_）的几率触发：当前层所有敌人都会察觉你并朝你的位置靠拢，同时解除你的_隐形_（含暗影斗篷的潜行）。代价就是暴露位置与拉怪——潜行或想避免战斗时它很容易坏事。触发概率与武器等级、强化无关。
# Arrogant 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Arrogant.kt:19-24（Random.Int(10)==0 时对 damage.from 造成 Random.Int(1,3) 点 MENTAL 伤害）; actors/hero/Hero.kt:730,820-848（MENTAL 伤害不扣生命，改为提升 Pressure）; actors/hero/Hero.kt:550-556（MENTAL 跳过护甲减伤）; actors/buffs/Pressure.kt:36-42,87-101,110-130（压力分级，_崩溃_时持续受到纯粹伤害）; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47（Int(1,3) 取 1~2）
items.weapon.curses.arrogant.catalog_desc=每次命中都有 _10%_ 的几率让持有者承受 _1~2_ 点_精神伤害_。精神伤害不扣除生命，而是累积_压力_；压力进入_崩溃_等级后会持续受到伤害。数值与概率不随武器等级改变。
# Bloodthirsty 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Bloodthirsty.kt:13-31（extra=Random.Int(1,value/2) 直接加伤；thirsty 冲抵，剩余为正时对 attacker 造成等量 NORMAL 伤害；onDeath→Dungeon.fail）; actors/hero/Hero.kt:1660-1662（死亡来源实现 Hero.Doom 时调用 onDeath）; actors/Char.kt:178-252（直接 takeDamage 结算，抗性可减免、不经护甲）; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47
items.weapon.curses.bloodthirsty.catalog_desc=每次命中都会附加 _1~(本次伤害/2-1)_ 的额外伤害，同时把该额外值记为「渴血」。此后每次命中先以新的额外值冲抵渴血：冲抵后若仍为正，就对持有者造成该剩余量的_物理_伤害；否则把渴血重置为本次的额外值。它是唯一会把死亡直接归咎于自身的诅咒（死因记为_嗜血_）。
# Displacing 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Displacing.kt:36-71（Random.Int(12)==0 且目标非 IMMOVABLE 时，randomRespawnCell 传送目标、HUNTING 转 WANDERING、damage.value=0）; levels/Level.kt:527-533（落点须可通行、不可见且无单位）; Dungeon.kt:306-309（isBossAlive 时不触发）; actors/Char.kt:233-252（只清 value，add_value 元素伤害仍结算）
items.weapon.curses.displacing.catalog_desc=每次命中都有 _1/12_（约 _8%_）的几率把目标传送到本层一个随机的、不可见的空格，并把这次攻击的_物理_伤害归零（附带的元素伤害仍会结算）。正在追杀你的敌人会因此转为游荡。目标为_不可移动_单位、或当层 Boss 仍存活、或找不到落点时，该效果不会触发。
# Exhausting 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Exhausting.kt:35-44（attacker===Dungeon.hero 且 Random.Int(20)==0 时施加 Weakness Random.Float(5,25)）; actors/buffs/Weakness.kt:39-53,59-65（weakened=true）; actors/hero/Hero.kt:140-143（weakened 使力量-2）; SPD-classes/src/main/java/com/watabou/utils/Random.java:29-31,41-43
items.weapon.curses.exhausting.catalog_desc=只有你（英雄）发动攻击时才会触发：每次命中都有 _5%_（_1/20_）的几率让你_虚弱_ _5~25_ 回合。虚弱期间_力量_下降 _2_ 点，会连带拖累依赖力量的命中与攻击速度。
# Fragile 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Fragile.kt:31-42（damage.value=round(value×(1-hits×0.005))，hits 上限 150，即 100%→25%）; items/weapon/curses/Fragile.kt:44-54（hits 随存档持久化）; items/weapon/Weapon.kt:100-120（每次命中触发一次 proc）
items.weapon.curses.fragile.catalog_desc=每次命中都会让该武器在减伤结算之后按 _1-命中次数×0.005_ 衰减伤害，从 _100%_ 一路降到 _25%_；累计 _150_ 次命中后不再下降，最低仍保留 _25%_ 伤害。该命中计数会永久记录在这件武器上并随存档保存，重新装备不会清零。
# Provocation 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Provocation.kt:18-28（Random.Int(10)==0 时对 damage.to 施加 Rage Random.Float(2,5)）; actors/buffs/Rage.kt:6-18（纯状态）; actors/mobs/Mob.kt:486-492（敌人狂暴时攻速×0.5）; actors/hero/Hero.kt:635-640（英雄狂暴时间隔×0.667）; SPD-classes/src/main/java/com/watabou/utils/Random.java:29-31
items.weapon.curses.provocation.catalog_desc=每次命中都有 _10%_ 的几率激怒目标，使其获得 _2~5_ 回合的_狂暴_。狂暴会让敌人攻击速度翻倍（攻击间隔乘以 _0.5_），因此挨打会更密集。它不改变武器自身的任何属性。
# Sacrificial 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Sacrificial.kt:34-43（Random.Int(10)==0 时对 attacker 施加 Bleeding，强度 max(1,HP/4)）; actors/buffs/Bleeding.kt:54-56（set 只取更大值）; actors/buffs/Bleeding.kt:64-73（每回合按 NormalIntRange(level/2,level) 流失并逐渐衰减）; SPD-classes/src/main/java/com/watabou/utils/Random.java:57-59
items.weapon.curses.sacrificial.catalog_desc=每次命中都有 _10%_ 的几率让持有者_流血_，流血强度为 _max(1, 当前生命/4)_。流血每回合造成介于 _强度/2_ 与 _强度_ 之间的伤害并逐回合衰减，直到归零。你当前生命越满，这一口被抽走的血就越多。
# Wayward 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/curses/Wayward.kt:28-31（proc 无效果）; items/weapon/Weapon.kt:154-168（负重=max(3,STRReq-STR+3)，命中额 acc/1.5^负重）; actors/hero/Hero.kt:385-392（英雄精准乘以 accuracyFactor）; actors/Char.kt:545-567（带 ACCURATE 特性时直接命中）; actors/mobs/Mob.kt:514-525（未察觉时防守方 dex=0，偷袭必中）
items.weapon.curses.wayward.catalog_desc=命中判定中的_精准_会被大幅削减：负重至少按 _3_ 计算，精准乘以 _1/1.5^负重_，也就是最高只剩正常的 _1/3.375_（约 _30%_）；力量低于武器需求时负重还会更高。它不影响伤害，只影响命中。_伏击_、偷袭等必然命中的攻击不受影响。
