# 图鉴：怪物与 NPC 的详细条目（catalog_desc），由图鉴界面按类名查找
# 键名 = 类全名去掉 com.egoal.darkestpixeldungeon. 前缀后全部小写，再加 .catalog_desc
# 段落之间以 \n\n 分隔；数值与专有名词用下划线 _ 包裹以高亮。
# 通则：怪物有约一成至两成的概率以精英形态出现（层数越深概率越高，_全员恶人_ 挑战再提高一成），
# 精英会从该怪物自己的词条池里加权随机获得 1 条（六成）、2 条（三成）或 3 条（一成）额外能力，
# 经验与掉落率随之提高；条目里的「精英词条」段即该怪物的完整词条池，与固有技能分开列出。
# 没有列出精英词条的怪物没有词条池，永远不会成为精英。
actors.mobs.acidic.catalog_desc=酸液蝎子：巨型蝎子的稀有变种，约三十分之一的概率替代 _23_ 至 _24_ 层的巨型蝎子出现，击杀后会被记入稀有图鉴。\n\n它沿用巨型蝎子的全部面板与行为：视野 _6_ 格，只在与你相隔一格以上时远程射击，每次攻击附带 _0_ 至 _12_ 点毒素伤害，并有三分之一概率让你_残废_ _6_ 回合；发现你之后会边后退边射击。它还额外自带_反震_：每次挨打都会把 _0_ 到本次伤害之间的随机伤害弹回给攻击者。
actors.mobs.albino.catalog_desc=白化老鼠：啮齿小鼠的稀有变种，约三十分之一的概率替代 _1_ 至 _4_ 层的啮齿小鼠出现，击杀后会被记入稀有图鉴。\n\n它的伤害和攻击间隔与啮齿小鼠相同，但生命值更高、攻防技能更强，且不再掉落_幸运硬币_。它额外自带_流血攻击_：一半概率造成等于该次伤害的流血，流血的每回合伤害会随剩余时间递减。\n\n精英词条（随机获得 _1_ 条）：_吸血攻击_（回复造成伤害三分之一的自身生命（精神伤害不触发））。
actors.mobs.ashesskull.catalog_desc=灰烬头骨：亡灵，飞行，免疫火焰与流血。它每三次行动中有一次原地不动（实际移动速度约为普通怪物的三分之二），但具备跳跃能力：只要你在 _6_ 格内被它看见且不在相邻位置，它就会每隔 _4_ 回合扑到你身边发动攻击。\n\n它的扑击为魔法伤害；若它从你的视野之外起跳，还会额外附带 _1_ 至 _5_ 点精神伤害。它死亡时若你在 _2_ 格内，会造成 _1_ 至层数一半再加 _1_ 的精神伤害。出现在 _11_ 至 _14_ 层。
actors.mobs.ballista.catalog_desc=弩炮：机械单位。它只在装填有弩矢时才能开火，每射一箭就把弹药打光，需要一个回合重新装填；开火要求它与目标之间没有障碍，视野 _6_ 格。\n\n它的弩矢自带_击退_：目标相邻时约 _40%_、_2_ 至 _5_ 格时约 _25%_ 概率被击飞。它免疫狂乱、恐惧、睡眠与流血。出现在 _13_ 至 _19_ 层，约三十分之一的概率会被速射炮替代。
actors.mobs.bandit.catalog_desc=疯狂强盗：疯狂小偷的稀有变种，约三十分之一的概率替代 _6_ 至 _9_ 层的疯狂小偷出现，击杀后会被记入稀有图鉴。\n\n它保留了疯狂小偷的全部手段：只要它身上还没有赃物、你又被它打中，它就会从你背包里顺走一件未装备、等级低于 _1_ 且非唯一的物品，得手后造成 _1_ 至 _5_ 点精神伤害并转身逃跑（逃跑时移动速度为正常值的 _83%_）；被逼到无路可退时会瞬移到远处带着赃物彻底消失，并再造成 _2_ 至 _6_ 点无视抗性的精神伤害。\n\n与疯狂小偷相比，它偷窃得手后还会额外附加盲目 _2_ 至 _4_ 回合、中毒 _5_ 至 _6_ 回合（时长受抗性影响）以及残废 _3_ 至 _7_ 回合，暴击率也更高；代价是攻击间隔比疯狂小偷慢一倍。
actors.mobs.bat.catalog_desc=吸血蝙蝠：飞行，速度是普通怪物的两倍，一个回合能移动两次。它的视野随昼夜变化：白天只有 _3_ 格，夜晚与午夜为 _8_ 格。\n\n它自带_吸血攻击_：每次攻击都会回复造成伤害三分之一的自身生命，精神伤害不触发。它的攻击还有四分之一概率改为造成 _1_ 至 _5_ 点无视护盾的精神伤害；夜晚与午夜时普通攻击会额外附带相当于伤害四分之一的暗影伤害。出现在 _9_ 至 _14_ 层。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_失明攻击_（三分之一概率使目标盲目 _2_ 至 _5_ 回合）、_暴击攻击_（一成概率造成 _1.5_ 倍伤害）、_狂怒_（生命值低于五分之二后伤害变为 _1.25_ 至 _1.75_ 倍并判定为暴击）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）、_黏液攻击_（三分之一概率使目标沾染_腐蚀淤泥_）、_眩晕攻击_（三分之一概率使目标眩晕 _5_ 回合）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.bee.catalog_desc=金色蜜蜂：蜜罐被砸碎或扔到地上时才会出现，属性随所在层数成长，生命值为（层数加 _2_）的四倍，攻击伤害约为自身生命值的十分之一到四分之一。\n\n它飞行且视野达 _4_ 格。蜜罐被人捡起时它锁定持有者；罐子落地时它只攻击罐子周围 _3_ 格内的怪物，没有其它目标时才攻击同在 _3_ 格内的你。被它打中的怪物会转而攻击它。
actors.mobs.brute.catalog_desc=豺狼暴徒：重型单位，免疫恐惧，自带 _10_ 点护盾（护盾只抵挡物理伤害，魔法伤害直接扣减生命值）。它的固有技能是_狂怒_：生命值低于五分之二后伤害变为 _1.25_ 至 _1.75_ 倍并判定为暴击，首次触发时还会花掉一个回合来发作。\n\n出现在 _11_ 至 _14_ 层，约三十分之一的概率会被持盾豺狼替代。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_残废攻击_（三分之一概率使目标残废 _6_ 回合）、_额外护盾_（护盾增加最大生命值的一半）、_流血攻击_（一半概率造成等于该次伤害的流血）、_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）、_水中减伤_（站在水中时受到的伤害减半）、_草丛减伤_（站在高草中时受到的伤害减半）。
actors.mobs.crab.catalog_desc=下水道螃蟹：移动速度是普通怪物的两倍，攻击有约 _5%_ 概率造成暴击，掉落_神秘的肉_，本身没有固有技能。\n\n出现在 _3_ 至 _4_ 层。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_反震_（每次挨打把 _0_ 到本次伤害之间的随机伤害弹回给攻击者）、_击退_（目标相邻时约 _40%_、_2_ 至 _5_ 格时约 _25%_ 概率被击飞）、_死亡爆炸_（死亡时对周围 _8_ 格造成层数一半至层数的火焰伤害）、_眩晕攻击_（三分之一概率使目标眩晕 _5_ 回合）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.darkspirit.catalog_desc=无名红灵由其他冒险者的阵亡记录生成：在 _1_ 至 _10_ 层的非首领楼层阵亡、死亡时等级与楼层相差不超过 _5_、且身上带着初始天赋之外的正面天赋时，这条记录会写入幽灵池，并在之后的冒险里于阵亡层数往下 _5_ 层处现身；已经拿到过_Yendor护身符_、或死亡楼层比该存档到过的最深层浅 _5_ 层以上时不会留下记录。同一个存档每轮最多遭遇一次，挑战模式下不会出现。\n\n它继承那位英雄的职业与护甲；若他生前的武器缺失或过于低劣，会改为随机生成一把更强的武器（可能是带铭文或被诅咒的武器）。生命值为 _20_ 加上（记录等级加 _2_ 至 _3_）的四倍，攻击使用那把武器的伤害、射程、命中与速度，护甲照常提供伤害减免。它随身带着 _2_ 至 _3_ 瓶治疗药剂，生命值低于六成时会以越低的血量越高的概率喝下一瓶，回复最大生命的三分之一并持续回血，冷却 _5_ 回合；被冰冻时药水会当场摔碎。\n\n死亡时各有三成概率掉落生前的武器与护甲，并把它携带的一项正面天赋传给你；若该天赋无法获取，改为给予全额经验。它倒下时若还留着治疗药剂会掉落一瓶药水，否则掉落金币。
actors.mobs.devilghost.catalog_desc=恶魔幽魂：在_恶魔雕塑_前选择「亵渎」时被唤出的分身，一次唤出 _1_ 至 _2_ 名（约四分之一概率为两名）。它拥有飞行属性，属于恶魔。\n\n它的生命值为 _4_，但任何大于 _0_ 的伤害都会被压成 _1_ 点，因此需要命中 _4_ 次才能击杀；它完全无法被附加任何增益或减益，中毒、燃烧、麻痹、冻结、魅惑等手段对它统统无效。它的攻击技巧高达 _1000_，攻击几乎必定命中；防御技巧只有 _20_，普通物理攻击可以正常命中，而对非普通类型的伤害它的闪避会归零。\n\n它对英雄造成（层数一半再加 _2_，上限 _10_）点精神伤害，对其它目标则是（层数一半加 _0_ 至 _6_）点魔法伤害且必定命中。第一次击杀会掉落一次性的_恶魔头骨_。
actors.mobs.dm300.catalog_desc=DM-300：_15_ 层的关底首领，属于机械与重型单位。它每个回合都会在脚下喷出有毒气体，并会在你于 _2_ 至 _8_ 格内进入它的视野时标记你的位置，冷却 _5_ 回合后向那里冲锋：沿途的单位都要承受一次重击并被_破甲_ _5_ 回合，落点周围的其它单位则承受一半伤害与 _3_ 回合破甲。它的近战攻击有三成概率把目标击飞。\n\n被击中时若单次伤害不低于 _4_ 点，它的最大生命值会永久降低该伤害的一半（至少 _1_、最多 _5_ 点，最低降到 _10_）。生命值降到三成时会_过载_：伤害提高四分之一、攻击速度提高一半。护盾被打空且生命值低于一半（过载后为三成）时，它会逃向 _4_ 格内尚未触发的陷阱修理自己，抵达后回复随机生命并增加 _20_ 点护盾。它对毒气、恐惧、腐化、魅惑、魔法睡眠与残废免疫。\n\n死亡时掉落_骷髅钥匙_，并在未开启苦修之路挑战时额外掉落_重修之书_。
actors.mobs.elemental.catalog_desc=火元素：属于恶魔的元素生物，拥有飞行属性，在 _14_ 层与 _16_ 至 _19_ 层刷出。它的普通攻击带火焰属性，有五成概率点燃目标，并自带_附魔反击（烈焰）_：你近身攻击它时约有三分之一概率让_烈焰附魔_附到你的武器上（持续 _8_ 回合，攻击会点燃敌人）。\n\n每次被点燃时它会回复 _1_ 点生命，并且免疫燃烧状态、_烈焰附魔_与_焰浪法杖_。一旦被冻伤或冰冻，它会立刻受到 _1_ 点至最大生命值三分之二的冰霜伤害，若它正处于水中则提升到一半至全部。\n\n击杀后有一成概率掉落_液火药剂_或_火蝶_。
actors.mobs.eye.catalog_desc=邪恶之眼：拥有飞行属性，属于恶魔与重型单位，在 _22_ 至 _24_ 层刷出。它免疫恐惧，普通攻击带暗影属性，并会施展_死亡凝视_：先用两个回合蓄力瞄准一条直线，蓄力期间它受到的伤害只有四分之一；随后一道贯穿整条射线的目光会灼穿路径上的所有生物，造成 _30_ 至 _50_ 点魔法伤害并烧毁沿途的可燃地形，之后冷却 _3_ 至 _5_ 回合。蓄力一旦开始就不会被打断，即使失去你的视野，它也会朝你最后的位置发射。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_额外护盾_（护盾增加最大生命值的一半）、_白雾反击_（每次挨打都在原地释放致盲白雾）、_附魔反击（紊乱）_（近身攻击它时约三分之一概率让紊乱附魔附到你的武器上，持续 _8_ 回合）、_临终白雾_（死亡时在原地释放致盲白雾）、_精神爆炸_（死亡时若你在 _2_ 格内，造成 _1_ 至层数一半再加 _1_ 的精神伤害）。
actors.mobs.fetidrat.catalog_desc=腐臭老鼠：悲伤幽灵任务的目标小首领之一——幽灵在 _2_ 至 _4_ 层生成，在 _2_ 层生成时任务目标就是它，生成于 _3_ 层与 _4_ 层时则分别是_豺狼诡术师_与_巨大螃蟹_。它属于小首领与恶魔，出现时处于游荡状态，没有任何掉落。\n\n它自带_黏液攻击_（三分之一概率让你沾染持续掉血的_腐蚀淤泥_）与_臭气反击_（每次挨打都在原地释放臭气），而它自己对臭气免疫。击杀它会推进悲伤幽灵任务。
actors.mobs.frog.catalog_desc=「绵羊？」：把_妖术试剂_砸向怪物后的变形结果，被砸中的怪物会化身为一只绵羊，站在原地约 _5_ 至 _7_ 回合后恢复原形继续追击。变身期间它不会攻击，生命值在变身结束时由原怪物接管。\n\n首领、小首领以及拥有幻影属性的单位不会被变形，只会发出一声「？」。
actors.mobs.glowworm.catalog_desc=萤光虫：只在夜晚与深夜出现，在 _1_ 至 _20_ 层的常规刷怪中有十五分之一的概率替代正常怪物，生成时拥有飞行属性并自带永久照明。它的属性随层数成长：生命值为层数的 _5_ 倍，攻击附带 _1_ 至层数的毒素伤害，自身防御也能减免 _1_ 至层数的伤害。\n\n它自带_附魔反击（淬毒）_：你近身攻击它时约有四分之一概率让_淬毒附魔_附到你的武器上，持续 _8_ 回合。死亡时它会在原地炸出一团毒气，并为周围 _8_ 格的生物附加 _20_ 回合的_发光_状态；若你也在其中还会中毒，持续时间约 _1_ 至 _3_ 回合再加上层数三分之一（受抗性影响）。\n\n击杀后有两成概率掉落_萤光粉_。
actors.mobs.gnoll.catalog_desc=豺狼巡查：在 _2_ 至 _4_ 层刷出的普通怪物，本身没有固有技能。它的攻击有约 _9%_ 概率造成 _1.25_ 倍暴击，击杀后有三成概率掉落金币。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_残废攻击_（三分之一概率使目标残废 _6_ 回合）、_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_额外护盾_（护盾增加最大生命值的一半）、_反击_（约 _17.5%_ 概率完全挡下一次近战普通攻击并立刻还击）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）、_草丛减伤_（站在高草中时受到的伤害减半）、_水中减伤_（站在水中时受到的伤害减半）。
actors.mobs.gnolltrickster.catalog_desc=豺狼诡术师：悲伤幽灵任务（第 _3_ 层）的目标怪物，属于小首领。它用吹箭远程攻击，无法攻击与自己相邻的目标，已经发现你时它会主动后退拉开距离。每次命中会把连击数加一，判定值为连击数加上 _0_ 至 _3_ 的随机数，一旦它移动连击数立即清零：判定值超过 _2_ 时使目标中毒，中毒时长随判定值提高；判定值达到 _6_ 以上时点燃目标，若目标已在燃烧则仍按中毒处理。击杀它会推进幽灵任务，并必定掉落 _麻痹毒镖_。
actors.mobs.golem.catalog_desc=魔像：属于机械与重型单位，出现在 _18_ 至 _19_ 层，攻击间隔是普通怪物的一倍半，对狂乱、恐惧、睡眠与流血完全免疫。击杀它会推进小恶魔的任务，并有约 _10%_ 概率掉落 _幸运硬币_。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外护盾_（护盾增加最大生命值的一半）、_反震_（每次挨打把 _0_ 到本次伤害之间的随机伤害弹回给攻击者）、_残废攻击_（三分之一概率使目标残废 _6_ 回合）、_临终白雾_（死亡时在原地释放致盲白雾）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）。
actors.mobs.goo.catalog_desc=粘咕：第 _5_ 层的关底首领。它会主动_蓄力_：蓄力时在周围 _2_ 格内留下警告，蓄力完成后的下一次攻击可以打到 _2_ 格内的目标，伤害为平时的三倍并判定为暴击；生命值低于一半时，它选择蓄力的概率从六分之一提高到一半，命中与闪避也各提高五成。\n\n站在水中时它每回合回复 _1_ 点生命。被近身攻击时有四分之一概率让攻击者沾染_腐蚀淤泥_（持续掉血），远程攻击不触发；被它未判定为暴击的攻击打中时有三分之一概率叠加_易伤_，受到的物理伤害提高四分之一、持续 _3_ 回合。它移动时会封锁本层，击杀它之前无法下楼。它免疫恐惧、腐化、魅惑与魔法睡眠。
actors.mobs.greatcrab.catalog_desc=巨大螃蟹：悲伤幽灵任务（第 _4_ 层）的目标怪物，属于小首领。只要它已经发现你，且处于清醒、未被麻痹的状态，来自角色与法杖的直接伤害就会被它的壳完全挡下，只有毒气、火焰、流血这类持续效果与区域效果才能伤到它，陷阱的伤害同样不被阻挡。\n\n它额外携带 _10_ 点护盾；追击时每 _3_ 次行动会有 _1_ 次原地不动，移动速度约为普通怪物的三分之二，但发现你的速度不受影响。击杀它会推进幽灵任务，并掉落 _2_ 个_神秘的肉_。
actors.mobs.guard.catalog_desc=监狱守卫：属于重型与恶魔单位，出现在 _7_ 至 _9_ 层。它额外携带相当于最大生命值一半的护盾，物理伤害先削减护盾，魔法伤害则绕过护盾直接扣减生命值。它持有一根_锁链_，每只守卫只能使用一次：当你在 _2_ 至 _4_ 格内、与它不相邻、处于它的视野中且中间有落脚点时，它每次行动约有三分之一概率甩出钩链，把你拽到它身前并附加 _4_ 回合的_残废_（移动速度减半）。击杀它后有约 _25%_ 概率掉落战利品，可能是护甲、_治疗药剂_或_守卫头盔_。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）、_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_额外护盾_（护盾增加最大生命值的一半）、_击退_（目标相邻时约 _40%_、_2_ 至 _5_ 格时约 _25%_ 概率被击飞）、_狂怒_（生命值低于五分之二后伤害变为 _1.25_ 至 _1.75_ 倍并判定为暴击）、_反魔法_（受到的魔法伤害减半）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.king.catalog_desc=矮人国王：第 _20_ 层的关底首领，拥有_两条命_。他受到伤害时按当前生命比例积累怒气（生命越低积累越快），怒气上限 _120_，超过 _100_ 时消耗怒气发动一次特殊行动，并按顺序判定：唤醒场上所有矮人石像，把它们变成_矮人亡灵_（消耗 _100_ 点怒气）；若场上有不少于 _3_ 个亡灵头骨，让它们全部立即复活（每个消耗 _20_ 点怒气）；否则与一名_矮人亡灵_建立_系命_持续 _8_ 回合，期间你打国王的伤害会转嫁到被链接的亡灵身上（消耗 _40_ 点怒气），已经处于系命状态时改为把护盾补到最多 _60_ 点。生命值低于一半且场上_矮人亡灵_不少于 _3_ 名时，他会边打边退到远处。\n\n他免疫麻痹、眩晕、腐化、恐惧、魅惑、魔法睡眠与流血。第一次被击杀时他不会真正死去：场上所有亡灵头骨立刻复活，他的位置会留下一个 _5_ 回合后重生的亡灵头骨，重生的他伤害、命中与暴击都更高（生命值上限更低）；只有第二次击杀才算通关，届时他会掉落_骷髅钥匙_、_护甲配件包_、_矮人王冠_与_精进之书_（苦行挑战下没有精进之书），所有_矮人亡灵_与亡灵头骨一并消散。他的手下_矮人亡灵_免疫即死、麻痹与流血，攻击有 _20%_ 概率使你麻痹 _1_ 回合（已处于麻痹时降为 _10%_），死后在原地留下头骨，_10_ 至 _19_ 回合后复活。
actors.mobs.madman.catalog_desc=疯子：属性随所在层数成长，能隔着最多 _3_ 格对你「呐喊」，造成（_2_ 至 _5_ 加上层数五分之一再减距离，最少 _1_）点精神伤害，而且_必定命中_；贴身时沿用同一公式，距离按 _1_ 计。精神伤害不经过护甲与护盾，也不受大部分减伤影响。\n\n他会出现在 _4_、_7_ 至 _8_、_12_ 至 _13_、_17_ 至 _18_ 与 _22_ 至 _23_ 层。
actors.mobs.mimic.catalog_desc=宝箱怪：以宝箱的形态出现，被打开时立刻现形。若你开箱时与它相邻、且它所在的位置可见，它会先给你一记突袭，造成（层数一半，最少 _4_ 点）点精神伤害。\n\n它的生命值与命中随层数成长，攻击伤害约为自身生命值的十分之一到四分之一，属于恶魔单位，免疫_灵能震爆卷轴_与流血。它装着原本宝箱内的全部物品，还会额外掉落金币、护甲、武器或戒指中的一种，其中金币占五分之二。能变成宝箱怪的宝箱由_发问者_布置，每堆物品约有 _20%_ 至 _35%_ 概率是宝箱怪。
actors.mobs.monk.catalog_desc=矮人武僧：出现在 _16_ 至 _19_ 层，攻击间隔只有普通怪物的 _0.45_ 倍，单次伤害 _12_ 至 _24_ 点，超过 _20_ 点时判定为暴击。他免疫狂乱与恐惧。\n\n他的能力是_缴械_：命中你时计数减一，计数归零时会把你的武器打落到地上，之后计数重新从 _3_ 至 _7_ 开始；空手时不会触发，_指虎_、被诅咒的武器与_勃耶西亚之锋_不受影响。击杀他会推进小恶魔的任务。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外护盾_（护盾增加最大生命值的一半）、_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_吸血攻击_（回复造成伤害三分之一的自身生命（精神伤害不触发））、_反震_（每次挨打把 _0_ 到本次伤害之间的随机伤害弹回给攻击者）、_反魔法_（受到的魔法伤害减半）、_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.newbornelemental.catalog_desc=新生火元素：_恶魔_、小首领，在杖匠任务的_仪式标记_房间里把 _4_ 支_仪祭蜡烛_放到仪式位置时会召出一只，出场时生命值只有上限的一半。\n\n它具备火元素的特性：飞行、免疫燃烧，受到燃烧时改为回复 _1_ 点生命；攻击为火焰属性，有 _50%_ 概率点燃目标；被近身攻击时约三分之一概率让你的近战武器获得 _8_ 回合的_烈焰_附魔，武器已有附魔时不触发。被施加_冻伤_或_冰冻_时会当场死亡。死亡必然掉落委托物品_元素余烬_。
actors.mobs.piranha.catalog_desc=巨型食人鱼：只在水中生成与移动，一旦所处格不是水就立刻死亡；移动速度是普通怪物的两倍。生命值为 _10_ 加层数五倍，命中为 _20_ 加层数两倍，闪避为 _10_ 加层数两倍。\n\n伤害为层数到 _2_ 加层数两倍，命中时有 _50%_ 概率造成相当于伤害一半的_流血_，自身减免 _0_ 至层数的伤害；免疫燃烧、麻痹、毒气、缠绕与冰冻。带水池的普通房间每间生成 _1_ 只，水潭房间每间生成 _3_ 只；死亡必掉_神秘的肉_，并有 _35%_ 概率额外掉落鱼骨，累计击杀 _6_ 只会解锁一次性成就。
actors.mobs.quickfiringgun.catalog_desc=速射炮：_机械单位_，在 _13_、_14_ 与 _16_ 至 _19_ 层以约三十分之一的概率替代弩炮出现。弹仓容量为 _3_ 发（弩炮为 _1_ 发），攻击间隔约 _1/3_ 回合，单发伤害低于弩炮但暴击倍率更高；视野 _6_ 格，攻击需要视线，弹仓打空后会重新装填。\n\n攻击附带_击退_（目标相邻时约 _40%_、_2_ 至 _5_ 格时约 _25%_ 概率被击飞）。免疫狂乱、恐惧、睡眠与流血，击杀会计入稀有图鉴。
actors.mobs.rat.catalog_desc=啮齿小鼠：_1_ 至 _4_ 层最常见的杂兵，本身没有固有技能，有约 _5%_ 概率掉落_幸运硬币_；约三十分之一的概率被_白化老鼠_替代。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_流血攻击_（一半概率造成等于该次伤害的流血）、_毒素攻击_（一半概率使目标中毒，持续约层数一半至层数回合）、_吸血攻击_（回复造成伤害三分之一的自身生命（精神伤害不触发））、_草丛减伤_（站在高草中时受到的伤害减半）。
actors.mobs.rotheart.catalog_desc=腐烂之心：生成于有锁门的特殊房间中央，_不可移动_的小首领，处于被动状态、不会攻击你；免疫恐惧、流血与毒气，每次挨打都会在原地释放毒气。\n\n任何一次攻击只要附带 _1_ 点以上火焰伤害，就会把它立刻摧毁，即使它还剩下 _80_ 点生命；被摧毁时同一层所有_腐烂触手_一起枯萎，正常死亡时还会掉落一颗_腐败果之种_。
actors.mobs.rotlasher.catalog_desc=腐烂触手：_腐烂之心_所在特殊房间中的_不可移动_单位，无法被引开；生命值为层数五倍，没有敌人在身旁时每回合回复 _3_ 点生命。\n\n攻击伤害为（_1_ 加层数一半）到（_2_ 加层数），每次命中都附加 _2_ 回合的_残废_；自身减免 _0_ 至层数的伤害，免疫毒气，身上着火时每回合至少受到相当于最大生命值一半的伤害。_腐烂之心_被摧毁时它会随之枯萎，掉落植物种子。
actors.mobs.rotten.catalog_desc=腐败物：在 _9_ 层与 _11_ 至 _14_ 层出现的远程单位，能在 _4_ 格内用魔法弹攻击你，攻击需要视线，攻击间隔是普通怪物的 _1.5_ 倍。\n\n它的攻击对非英雄单位会转为魔法属性；命中英雄时有 _50%_ 概率让你沾染_腐蚀淤泥_持续掉血，被远程攻击命中时有三分之一概率把_腐蚀淤泥_反溅给攻击者。击杀有 _80%_ 概率掉落_腐败核心_。
actors.mobs.scorpio.catalog_desc=巨型蝎子：_恶魔_，在 _23_ 至 _24_ 层出现的远程单位，视野 _6_ 格；它不会攻击相邻目标，发现你后会主动后退拉开距离。\n\n每次攻击附加 _0_ 至 _12_ 点毒素伤害，并有三分之一概率让你_残废_ _6_ 回合（已经残废时不触发）。击杀有约 _20%_ 概率掉落_治疗药剂_（_70%_）或_神秘的肉_（_30%_）。
actors.mobs.senior.catalog_desc=武僧大师：_16_ 至 _19_ 层中武僧的稀有变种，约三十分之一的概率替代武僧出现；额外携带 _20_ 点护盾，伤害高于武僧，且同样会打落你的武器——每 _3_ 至 _7_ 次命中触发一次，拳套类武器与受诅咒的武器不受影响。\n\n它自带_麻痹攻击_：五分之一概率使目标麻痹约 _1.1_ 回合；免疫狂乱与恐惧，击杀会计入稀有图鉴。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外护盾_（护盾增加最大生命值的一半）、_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_吸血攻击_（回复造成伤害三分之一的自身生命（精神伤害不触发））、_反震_（每次挨打把 _0_ 到本次伤害之间的随机伤害弹回给攻击者）、_反魔法_（受到的魔法伤害减半）、_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）。
actors.mobs.shaman.catalog_desc=豺狼萨满：远程施法者，只要弹道可达就能隔空放出闪电攻击，射程不限；每次攻击都附加 _1_ 至 _5_ 点光属性伤害，远程命中时若你站在水中且不会飞，这次伤害再提高一半。\n\n它无法攻击目标或与目标贴身时，会为 _4_ 格视野内没有_狂暴_的友军（没有友军时为自己）附加 _10_ 回合_狂暴_，冷却 _8_ 回合；_狂暴_会大幅提高攻击速度。出现在 _6_ 至 _9_ 层，击杀有约 _25%_ 概率掉落卷轴。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_额外护盾_（护盾增加最大生命值的一半）、_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）、_水中减伤_（站在水中时受到的伤害减半）。
actors.mobs.shielded.catalog_desc=持盾豺狼：豺狼暴徒的稀有变种，有约三十分之一的概率替代暴徒生成；护盾为 _30_ 点（暴徒为 _10_ 点），防御也更高，物理伤害先扣护盾，魔法伤害直接扣减生命值。\n\n它自带_狂怒_：生命值低于五分之二后伤害变为 _1.25_ 至 _1.75_ 倍并判定为暴击；免疫恐惧，属于重型单位。出现在 _11_ 至 _14_ 层，击杀会被记入稀有图鉴。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_残废攻击_（三分之一概率使目标残废 _6_ 回合）、_额外护盾_（护盾增加最大生命值的一半）、_流血攻击_（一半概率造成等于该次伤害的流血）、_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）、_草丛减伤_（站在高草中时受到的伤害减半）、_水中减伤_（站在水中时受到的伤害减半）。
actors.mobs.skeleton.catalog_desc=骷髅：亡灵杂兵，免疫流血，自带_死亡爆炸_：死亡时对周围 _8_ 格的生物造成层数一半至层数的火焰伤害。出现在 _6_ 至 _9_ 层，击杀有约 _17.5%_ 概率掉落武器，掉落判定中约 _4%_ 的概率替换为_古老者之手_（全局仅一次）。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）、_反击_（约 _17.5%_ 概率完全挡下一次近战普通攻击并立刻还击）、_精神爆炸_（死亡时若你在 _2_ 格内，造成 _1_ 至层数一半再加 _1_ 的精神伤害）、_额外护盾_（护盾增加最大生命值的一半）、_反魔法_（受到的魔法伤害减半）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.skeletonknight.catalog_desc=骷髅骑士：亡灵，免疫流血，暴击率 _10%_、暴击倍率 _1.25_。每次攻击有 _17.5%_ 概率在同一回合内追加一次攻击（冷却 _2_ 回合），并自带_反击_：约 _17.5%_ 概率完全挡下一次近战普通攻击并立刻还击。出现在 _11_ 至 _14_ 层，击杀有约 _10%_ 概率掉落_棕色麦芽酒_、_红树根_或_幸运硬币_，掉落判定中约 _15%_ 的概率替换为_古老者之手_（全局仅一次）。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_死亡重生_（死后在原地留下头骨，_5_ 至 _9_ 回合后复活）、_额外护盾_（护盾增加最大生命值的一半）、_暴击攻击_（一成概率造成 _1.5_ 倍伤害）、_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_反震_（每次挨打把 _0_ 到本次伤害之间的随机伤害弹回给攻击者）、_反魔法_（受到的魔法伤害减半）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）。
actors.mobs.slug.catalog_desc=下水道蠕虫：攻击间隔是普通怪物的 _1.5_ 倍，攻击附加 _1_ 至 _3_ 点毒素伤害，自身的普通物理伤害减免 _40%_（受到的物理伤害乘以 _0.6_，不低于 _1_ 点），并免疫流血与恐惧。出现在 _1_ 至 _4_ 层。
actors.mobs.spinner.catalog_desc=矿洞蜘蛛：出现于 _13_ 至 _14_ 层，免疫定身；攻击命中有_毒素攻击_，一半概率使目标中毒（持续约层数一半至层数回合）。目标中毒期间它会立刻转入逃跑状态，逃跑中每移动一步沿路留下 _5_ 至 _6_ 团_蜘蛛网_，目标身上的毒消退后恢复追击；逃跑时若已无路可逃，只要不处于恐惧状态就会重新转入追击。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_毒气反击_（每次挨打都在原地释放毒气）、_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）、_眩晕攻击_（三分之一概率使目标眩晕 _5_ 回合）、_草丛减伤_（站在高草中时受到的伤害减半）。
actors.mobs.statue.catalog_desc=活化石像：初始处于静止状态而不会主动行动，受到伤害后立刻转为追击。每尊石像握着一把随机生成、已鉴定并带随机正面铭文的非诅咒近战武器，其伤害、射程、命中和攻击速度全部取决于该武器。\n\n它的生命值为 _15_ 加层数的 _5_ 倍，命中与防御随层数提高，受到_即死_类效果时伤害降低五分之一，并免疫_血饮_铭文与_摄魂_。击败它会掉落那把武器，属于重型单位。雕像陷阱的守卫与秘密房间的守卫在图鉴中并入此条目。
actors.mobs.succubus.catalog_desc=魅魔：_19_ 至 _24_ 层的恶魔，视野 _6_ 格，免疫睡眠。她会_瞬移_：只要你在她视野内且距离超过 _2_ 格，就会闪现到你身边攻击，冷却 _5_ 回合；攻击额外附带 _2_ 至 _10_ 点寒冰伤害，并自带_魅惑_：三分之一概率使你陷入 _3_ 至 _6_ 回合的魅惑，期间你无法攻击她。击杀有约 _5%_ 概率掉落_催眠卷轴_。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_麻痹攻击_（五分之一概率使目标麻痹约 _1.1_ 回合）、_吸血攻击_（回复造成伤害三分之一的自身生命（精神伤害不触发））、_失明攻击_（三分之一概率使目标盲目 _2_ 至 _5_ 回合）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）、_眩晕攻击_（三分之一概率使目标眩晕 _5_ 回合）、_攻击加速_（每次攻击后额外缩短 _0.2_ 回合的行动间隔）、_水中减伤_（站在水中时受到的伤害减半）。
actors.mobs.swarm.catalog_desc=蝇群出现在 _3_ 至 _4_ 层与 _6_ 层。每次受到伤害时，只要当前生命值不低于伤害加 _2_，它就会在相邻空格上分裂出一个新个体：新个体的生命值是扣除这次伤害后剩余生命值的一半，原个体相应扣掉这部分生命，分裂出的个体带有_幻影_属性。\n\n它的攻击有三分之一概率改为造成 _1_ 至 _2_ 点精神伤害（无视护甲与护盾）。它的生命值为 _50_，死亡时有约 _8%_ 概率掉落已鉴定的治疗药剂。
actors.mobs.tengu.catalog_desc=天狗是第 _10_ 层的关底首领，战斗分为两个阶段。第一阶段中，只要一次伤害不低于 _15_ 点且你与它相邻（或它已看不见你），或者这次伤害让它跨过一个生命值区段，它就会瞬移离开，普通落点距原处至少 _5_ 格；满足条件时约有五分之一概率改为跳向房间中央的水池（它身上着火时必定如此）。生命值降到一半时，它会锁血在一半、熄灭整层灯光并让你失明 _2_ 回合，随即进入第二阶段。\n\n第二阶段它会在你身旁召唤 _2_ 至 _3_ 个_幻影_并瞬移到其中一个位置；幻影复制它当时的生命值与生命上限，周围可站立的位置少于 _4_ 个时它改为直接瞬移。有幻影在场时，它挨打会先让所有幻影消散再瞬移；击碎幻影不会让它受到任何伤害。它的攻击沿直线弹道判定，对远程攻击的闪避翻倍。它免疫恐惧、腐化、魅惑、冻伤与魔法睡眠。击杀它会掉落骷髅钥匙、月亮石与天赋之书（_苦修之路_ 挑战下不掉落天赋之书），并有三分之一概率掉落等级 +_1_ 的_腾古之剑_。
actors.mobs.thief.catalog_desc=疯狂小偷的攻击间隔只有普通怪物的一半，一个回合能攻击两次。它未持有赃物时，每次打中你都会从你背包里随机挑一件未装备的物品下手，只有该物品非唯一且等级低于 _1_ 才会得手：得手后造成 _1_ 至 _5_ 点精神伤害并立刻逃跑，逃跑时移动速度为正常值的 _83%_；若挑中的是_勃耶西亚之锋_，它反而受到 _6_ 至 _12_ 点暗影伤害。偷窃没能得手或它已持有赃物时，攻击有四分之一概率使你_残废_ _1.5_ 回合。\n\n逃跑途中无处可逃时：如果它还看得见你，就回头继续战斗；否则它带着赃物瞬移离场、赃物就此丢失，并造成 _2_ 至 _6_ 点无视抗性的精神伤害。被你击杀时赃物会掉回地上。它免疫定身。它出现在 _6_ 至 _9_ 层，约三十分之一的概率会被_疯狂强盗_替代；死亡掉落约有一成概率触发，其中 _10%_ 概率掉落本局限定一次的_神偷袖章_，否则为红柄短刀、金币或幸运硬币之一。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_额外生命_（生命值提高随机 _20%_ 至 _50%_）、_暴击攻击_（一成概率造成 _1.5_ 倍伤害）、_临终咆哮_（死亡时惊动 _16_ 格内的其它怪物）、_反魔法_（受到的魔法伤害减半）、_黏液攻击_（三分之一概率使目标沾染_腐蚀淤泥_）、_眩晕攻击_（三分之一概率使目标眩晕 _5_ 回合）、_草丛减伤_（站在高草中时受到的伤害减半）。
actors.mobs.wandguard.catalog_desc=魔能之杖是法杖房间的守卫，不可移动，属于机械单位。它随机握着一根_法杖_（_魔弹法杖_、_雷霆法杖_、_解离法杖_、_焰浪法杖_、_冲击波法杖_、_冰霜法杖_、_棱光法杖_或_剧毒法杖_之一），法杖等级为层数五分之一到三分之一；每次射击沿直线弹道造成（_2_ 加两倍杖等级）到（_8_ 加三倍杖等级）点魔法伤害，视野 _6_。\n\n它免疫一切状态效果——任何增益或减益都无法附着。它的生命值为（层数五分之一加 _1_）的十倍。被击杀时掉落手中那根等级归零、重新随机且未诅咒的法杖。它只在特殊房间（法杖房间）中作为守卫生成，不参与普通刷怪，_1_ 层不会出现。
actors.mobs.warlock.catalog_desc=矮人术士是 _16_ 至 _19_ 层出现的远程施法者。只要一方在它的视野内，它就能隔空放出暗影弹，射程不限；与你相邻时改用近战。每次命中额外附带 _2_ 至 _10_ 点暗影伤害，命中你时有一半概率叠加_虚弱_。击杀它约有四成概率掉落药剂。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_毒气反击_（每次挨打都在原地释放毒气）、_额外护盾_（护盾增加最大生命值的一半）、_临终白雾_（死亡时在原地释放致盲白雾）、_临终毒气_（死亡时在原地释放毒气）。
actors.mobs.witchdoctor.catalog_desc=巫医出现在 _8_ 至 _9_ 层与 _11_ 至 _14_ 层，攻击距离为 _2_ 格。冷却就绪时它会先治疗视野内生命值低于 _75%_ 的同伴，治疗量为 _8_ 至（目标生命上限十分之一加 _5_），对同伴再加 _5_。它会优先对 _4_ 格内尚未_腐朽_的敌人施放腐朽（持续 _15_ 回合，冷却 _20_ 回合）；被腐朽的目标受到治疗时会转为等量受伤。敌人已被腐朽且它自身生命值不低于五分之一时，它会持续对那个敌人施展「治疗」，造成 _8_ 到（你生命上限十分之一加 _5_）点伤害；自身生命值不足一半时改为治疗自己（冷却 _3_ 回合）。死亡时有约一成概率掉落急救试剂、仪式匕首或药剂。\n\n精英词条（随机获得 _1_ 至 _3_ 条）：_魅惑攻击_（三分之一概率魅惑目标 _3_ 至 _6_ 回合）、_毒气反击_（每次挨打都在原地释放毒气）、_毒素攻击_（一半概率使目标中毒，持续约层数一半至层数回合）、_黏液攻击_（三分之一概率使目标沾染_腐蚀淤泥_）。
actors.mobs.wraith.catalog_desc=怨灵只有 _1_ 点生命值，防御技巧为（_10_ 加层数）的五倍，普通攻击很难打中它；它的闪避只对普通伤害生效，魔法、元素与精神类伤害必定命中。它飞行、属于亡灵，攻击技巧为 _10_ 加层数，攻击造成（_1_ 加层数一半）到（_2_ 加层数）点伤害，免疫即死、恐惧与腐化。\n\n它不参与普通刷怪：打开坟墓时有三分之二概率在你四周召出一批怨灵，并让你损失 _3_ 至 _6_ 点精神值；开启遗骸中已诅咒的物品会召出一只怨灵，无处可站时改为直接让你损失一半生命与 _4_ 至 _12_ 点精神值；拾起_尸尘_后会持续召出怨灵，丢下时所有怨灵立刻消散。
actors.mobs.yog.catalog_desc=Yog-Dzewa 是深坑第 _25_ 层的最终首领，不可移动，每回合回复 _1_ 点生命。它由双拳分担伤害：每有一只存活的拳头，它受到的伤害就减半一次（两只拳头都在时只有四分之一）；每次挨打都会惊醒场上的双拳与幼虫，并在身旁空格召出一只_古神幼虫_。\n\n它以暗影射线凝视你（冷却 _5_ 回合），造成 _5_ 到（_15_ 加上生命值损失比例乘 _10_）点精神伤害，命中无视闪避。它免疫狂乱、睡眠、恐惧、毒素、眩晕、腐化、魔法睡眠与麻痹；作为首领，受到即死类伤害时只承受四分之一。它的两只拳头各有能力：_腐烂之拳_造成 _20_ 至 _50_ 点伤害、每次命中三分之一概率附加_腐蚀淤泥_，站在水中时每回合回复 _4_ 点生命，免疫燃烧、毒素、狂乱、睡眠、恐惧、眩晕、腐化与魔法睡眠；_燃烧之拳_能在远处发射火焰弹、每回合把自身周围九格点燃，免疫燃烧、恐惧、狂乱、睡眠、眩晕、腐化与魔法睡眠。_古神幼虫_造成 _22_ 至 _30_ 点伤害。
actors.mobs.npcs.abysshero.catalog_desc=深渊战士：由_断剑剑柄_神器召唤出的战斗单位，不是地牢常规刷新的怪物，分盟友与敌人两种形态。\n\n盟友形态：须先在试炼中击败过它且神器未受诅咒，召唤出的才是盟友。生命值为 _20_ 加等级五倍，命中与闪避均为 _10_ 加两倍等级，存在时间为 _20×等级加 50_ 回合；攻击造成 _1_ 加等级至 _5_ 加六倍等级点伤害，额外附带 _1_ 至两倍等级的暗影伤害，并有 _15%_ 概率造成 _1.25_ 倍暴击。\n\n敌人形态：以你一半的最大生命值（不低于你当前生命值）和相近的等级模拟你本人，没有存在时限；神器受诅咒时，每回合约有 _1%_ 概率自发召唤出敌人形态。\n\n它无法被附加任何状态；盟友形态下与它互动可以交换站位。
actors.mobs.npcs.alchemist.catalog_desc=年迈的炼金术士：村庄 NPC，不可被攻击，无战斗能力。首次交谈会交给你一个_露珠瓶_，要你带到地牢里收集露水再回来交给他。\n\n交回非空的露珠瓶后按露水量结算报酬：金币为（_5_ 至 _14_ 的随机数乘以露水量）再加 _20_；露水量超过 _3_ 时额外给 _2_ 张药剂试纸（_70%_）或一份急救试剂；露水量达到 _10_ 以上时再追加一份急救试剂，并有 _20%_ 概率多给一张药剂试纸。露珠瓶是全局唯一的物品，该任务只能完成一次。
actors.mobs.npcs.archdemon.catalog_desc=红恶魔：只出现在特殊房间（恶魔房间）里的 NPC，不可移动、不可被攻击，专门进行_天赋交易_；每个存档只能交易一次，交易后不再回应。\n\n「削减天赋」：降级你已有的一个天赋，之后可选择是否再以最大生命值为代价换取一个新天赋——献出 _7%_ 有 _50%_ 概率获得一个随机正面天赋，献出 _14%_ 必定获得一个随机正面天赋，献出 _21%_ 则额外获得一个可留待日后使用的天赋位；也可以什么都不选。生命值上限的损失是永久性的。\n\n「强化天赋」：把一个可升级的天赋提升 _1_ 级，代价可以是血液——回复速度减半（最多 _0.5_）、从最高元素抗性里扣掉 _0.3_（若没有正抗性则全抗各降 _0.05_）、或直接损失 _12%_ 至 _25%_ 的最大生命值；也可以是献祭另一个天赋。\n\n身上没有可交易的天赋时会拒绝交易。
actors.mobs.npcs.barterman.catalog_desc=布袋商人：第 _3_ 至 _19_ 层普通房间里随机出现的商人，出现概率约一成，若该层已有商店则减半；不收金币，只做_以物易物_。\n\n货架为 _1_ 至 _3_ 瓶药水、_1_ 至 _3_ 张卷轴和 _2_ 至 _5_ 把近战武器，货架上的价格不显示。交换时你拿出的物品必须与货物同类：药水换药水、卷轴换卷轴、护甲换护甲，近战武器还须同阶数，并且必须是诅咒状态已知且未被诅咒的物品。\n\n除交易外他也能与你交换站位；攻击他或用减益效果影响他，他会立刻消失。
actors.mobs.npcs.blacksmith.catalog_desc=巨魔铁匠：洞穴层（第 _11_ 至 _14_ 层）随机生成的铁匠铺房间里的 NPC，不可被攻击，房间四周布满火焰陷阱。\n\n他先给一个任务，两种要求随机其一：用他给的镐子挖取 _12_ 块_暗金矿_，或用这把镐子击杀一只蝙蝠使镐头沾血；镐子为唯一物品。\n\n任务完成后他可以进行_重铸_：在你提供的两件同类装备中熔掉较差的一件，使较好的一件提升 _1_ 级。重铸要求两件同类、都已鉴定、均未被诅咒、等级不为负且可升级；每个存档只能重铸一次。
actors.mobs.npcs.categoal.catalog_desc=Egoal the Cat：村庄 NPC，不可被攻击，无交易、任务与战斗功能。\n\n交互时会出现两个回答选项，任选其一都会送你一个_猫的礼物_，选项只影响它之后的台词。打开礼物可以得到一枚幸运硬币、一件点金手和一把本层对应的骷髅钥匙。\n\n它的移动速度为 _5_，未回答前不移动，回答后也只在你视野之外移动。
actors.mobs.npcs.catrawberry.catalog_desc=暗黑罗贝里：村庄 NPC，不可被攻击，无交易与战斗功能。\n\n交互时它会按固定优先级收走你身上的一种食物：神秘的肉、烤肉、煮肉、冷冻生肉片，收到不同食物会给出不同台词。身上没有这四种食物时，它会立刻传送消失到你看不见的空位。
actors.mobs.npcs.disheartenedbuddy.catalog_desc=索丹：村庄 NPC，不可被攻击，无交易与任务功能，唯一交互是交谈。\n\n每次交谈随机显示四段台词之一：初次交谈时第一段概率约 _62.5%_，之后第一段约 _1/7_、其余三段各约 _2/7_。若你身上带着_Yendor护身符_，台词会换成另一段。
actors.mobs.npcs.ghost.catalog_desc=悲伤幽灵：在第 _2_ 至 _4_ 层随机生成，第 _2_ 层约三分之一、第 _3_ 层约二分之一、第 _4_ 层必定出现，每次游戏只会生成一个。\n\n接受任务时会立刻在当层生成任务目标：第 _2_ 层的_腐臭老鼠_、第 _3_ 层的_豺狼诡术师_或第 _4_ 层的_巨大螃蟹_；任务目标死亡前与他交谈，他会移动到本层另一处。\n\n击杀任务目标后，_干枯玫瑰_会进入神器掉落池；再与他交谈，他会在两件报酬中让你选一件：随机一把近战武器，或同阶级的护甲。奖励为 _1_ 至 _5_ 阶（概率约一成、三成五、三成、两成、半成），强化等级 _+0_ 至 _+3_（四成、四成、一成半、半成），另有约 _10%_ 概率附带附魔（_1_ 阶武器必定附带），两者均已鉴定。给出报酬后他随即消散。\n\n他无法被伤害或附加任何状态，并免疫麻痹与定身。
actors.mobs.npcs.ghosthero.catalog_desc=悲伤幽灵（玫瑰幽灵）：由_干枯玫瑰_召唤出的护卫，属于英雄阵营，会主动攻击视野内的敌人，同一时间只会存在一个。\n\n生命值为 _10_ 加上玫瑰花等级的五倍，存在 _30×玫瑰等级加 60_ 回合；回合数耗尽或你死亡时消散。\n\n每 _15_ 回合治疗你一次（需要你在它 _2_ 格以内且生命值未满），回复量为你最大生命值的 _5%_ 加上玫瑰花等级的 _1%_。\n\n攻击为魔法远程，射程 _4_ 格，伤害随玫瑰等级成长。它无法被附加任何状态，并免疫毒气、酸雾、燃烧、腐化与精神冲击。首次互动会显示介绍文本，之后互动改为与你交换位置。
actors.mobs.npcs.imp.catalog_desc=野心勃勃的小恶魔：不可移动，在第 _17_ 至 _19_ 层随机生成（第 _17_ 层约三分之一、第 _18_ 层约二分之一、第 _19_ 层必定），每次游戏只会生成一个；首次交谈即给出任务。\n\n任务要求猎杀城市区域的_魔像_与_矮人武僧_：接取任务后它们死亡时必定掉落一枚_矮人徽记_，未接取时死亡约有 _30%_ 概率掉落。\n\n凑齐 _8_ 枚_矮人徽记_交给他，他会给出一枚随机、等级 _+2_ 的_被诅咒的戒指_，随后离开。他无法被伤害或附加任何状态。
actors.mobs.npcs.jessica.catalog_desc=杰西卡：村庄关卡（深度 _0_）中的固定 NPC。\n\n与她交谈可以接下寻找_柯利的日记_的任务；接取后，日记会与一枚随机戒指一同以_遗骸_的形式出现在第 _6_ 至 _9_ 层，第 _6_ 层约四分之一、第 _7_ 层约三分之一、第 _8_ 层约二分之一、第 _9_ 层必定，每次游戏只会生成一次。\n\n日记在背包中时与她交谈，可以选择归还或谎称是自己找到的；背包中没有日记时可谎称没找到。这些结果都会结束任务，她不会给予物品报酬；_柯利的日记_本身是可阅读的书籍道具。英雄等级为 _1_ 时交谈只会显示提示，任务不推进。
actors.mobs.npcs.merchant.catalog_desc=商人：第 _6_、_11_ 与 _16_ 层商店层的店主；开启_铸金大师_挑战时，这些层不会生成商店。\n\n店铺最多陈列 _25_ 件商品，购买价格等于物品的售价，_折扣_天赋会按等级进一步降低价格；除购买外，也可以选择与他交换站位。\n\n攻击他、给他附加任何状态或偷窃失败，他都会立刻消失，之后无法再与他交易。装备_神偷袖章_时会多出「偷窃」选项，成功率直接显示在按钮上；成功即免费获得该物品，失败同样会让他消失。
actors.mobs.npcs.merchantimp.catalog_desc=野心勃勃的小恶魔（店主）：第 _21_ 层商店层的店主，只有在_野心勃勃的小恶魔_任务完成后、且未开启_铸金大师_挑战时才会出现。\n\n除普通商店的货架外，他固定贩售：_祛邪卷轴_、_探地卷轴_、_4_ 件随机药水或卷轴、一把已鉴定的五阶近战武器、_2_ 件投掷武器、一件已鉴定的_板甲_与 _3_ 支_火把_。\n\n购买、偷窃、交换站位与价格规则（含_折扣_天赋）与普通商人一致；被冒犯或偷窃失败时同样会立刻消失。
actors.mobs.npcs.minstrel.catalog_desc=吟游诗人泰勒：村庄关卡（深度 _0_）中的 NPC，无交易、任务与战斗功能，也无法被伤害或附加状态。\n\n唯一交互是交谈，可选择「唱一首歌」、「自我介绍」或「告辞」，各自只会显示对应的文本。\n\n累计游戏回合数超过 _8000_ 后他会自行消失。
actors.mobs.npcs.mirrorimage.catalog_desc=镜像：不是固定 NPC，而是由_镜像卷轴_（最多 _3_ 个，受可用空格限制）或_分身_护甲诅咒制造出的分身，属于英雄阵营，会主动攻击视野内的敌人。\n\n它的伤害完全复制制造它那一刻你的攻击力，并且必定命中；出手一次后就会立刻消散。你可以与它互动来交换位置。\n\n它不会掉落任何物品，并免疫毒气、酸雾与燃烧。
actors.mobs.npcs.monument.catalog_desc=村庄中的挑战模式开关，不可移动。英雄等级仍为 _1_ 时与它互动可打开挑战选择界面；选中至少一项挑战后石碑被激活并亮起，所选挑战随存档永久生效（如_铸金大师_使地牢不再出现商人、_全员恶人_使精英怪遍布地牢），未选任何挑战则不会激活，激活后不再响应互动。
actors.mobs.npcs.passerby.catalog_desc=村庄 NPC，不可移动，无交易、任务与战斗功能；唯一交互是交谈，会依次显示几段台词，首次交谈的台词按英雄职业分支（法师与其它职业不同），交谈过一次后再次交谈只剩一句台词。
actors.mobs.npcs.plaguedoctor.catalog_desc=炼金师的特殊形象：约三成的炼金师会以瘟疫医生的样子出现。\n\n货架在炼金师的基础上额外增加一瓶剧毒瓦斯药水、_1_ 至 _2_ 把礼仪匕首与一份试剂。\n\n属于 NPC，无法被攻击；交互与炼金师一致（可购买、可交换站位，持有_神偷袖章_时可偷窃）。偷窃失败时他会打碎瓶子，使你的位置充满剧毒瓦斯（约七成）或燃起火焰，随后消失。
actors.mobs.npcs.potionseller.catalog_desc=炼金师：生成于第 _3_ 至 _19_ 层的普通房间，出现概率约两成，该层已有商店时降为约一成；_铸金大师_挑战下不会生成。\n\n货架为两份试剂（第 _5_ 层以下固定为治疗试剂，之后随机）、_3_ 至 _8_ 件药水或种子（约六成为药水，其中可强化者约 _30%_ 已被强化）与 _1_ 至 _2_ 张药剂试纸，商品顺序会被打乱。\n\n约三成概率以_瘟疫医生_的形象出现，此时货架额外增加一瓶剧毒瓦斯药水、礼仪匕首与一份试剂。价格与其它商人相同，有_折扣_天赋时更低；属于 NPC，无法被攻击，可购买、可交换站位，持有_神偷袖章_时可偷窃；偷窃失败时他会打碎瓶子，使你的位置充满剧毒瓦斯（约七成）或燃起火焰，随后消失。
actors.mobs.npcs.questioner.catalog_desc=位于一间没有门的石室中，不可移动，只会提出一个从苦难、目标、荣誉、恐惧中随机选出的问题，并给出两个回答选项与「攻击他」。\n\n回答任一选项会对你造成 _2_ 至 _5_ 点精神伤害；选择「攻击他」则不损失精神值，改为在他周围落下落石（伤害随层数变化）。无论怎么选，石室都会打开并在室内随机留下三处宝藏：第一处固定为金币；第二处在回答第一项时为药水或卷轴、回答第二项时为武器或护甲；第三处为随机物品。回答选项时三处各有约两成概率是宝箱怪伪装的箱子；选择「攻击他」时前两处均为金币且宝箱怪概率升至约三成五，第三处必定为宝箱怪伪装的箱子，物品固定为头盔、法杖或神器。他会在石室打开后消散。
actors.mobs.npcs.ratking.catalog_desc=生成于下水道首领层（第 _5_ 层）的一间隐藏房间内，需打开密门才能进入。\n\n初始处于沉睡状态，与它互动会把它吵醒，之后它会在附近游荡，移动速度是普通怪物的两倍；它不会选定敌人，也永远不会攻击你。无交易与任务功能。
actors.mobs.npcs.robotren.catalog_desc=生成于洞穴首领层（第 _15_ 层），不可移动。\n\n交谈会显示两个选项，分别对应它的身份与来历，各显示一段台词；无交易与任务功能，也不参与战斗。
actors.mobs.npcs.scholar.catalog_desc=村庄 NPC，不可移动，无交易与任务功能。\n\n交谈会依次显示三段文本，最后一项会打开与_苦修之路_挑战相关的信息窗口，其中列有一份达成者名单。
actors.mobs.npcs.scrollseller.catalog_desc=奥术专家是随机生成于普通房间的商人，出现于第 _3_ 至 _19_ 层，概率约 _18%_，该层已有商店时降为约 _8%_；「铸金大师」挑战下不会生成。它不可移动，受到攻击或状态影响、以及偷窃失败时会立刻逃走，服务也随之消失。\n\n货架为_鉴定卷轴_、_祛邪卷轴_、_1_ 至 _3_ 张随机卷轴、一根未诅咒的法杖（另有 _25%_ 概率出现第二根未诅咒法杖）以及一支已鉴定的_奥术刻笔_，商品顺序会被打乱。\n\n可提供一次性服务「驱散」：支付（层数加 _4_）乘 _40_ 枚金币，选择一件未鉴定或被诅咒的物品，为它解除诅咒或完成鉴定；折扣天赋会降低这笔费用。
actors.mobs.npcs.seeker.catalog_desc=探求者科斯迪斯是固定在村庄里的 NPC，不可移动，无交易、任务与战斗功能，也无法被伤害或附加任何状态。\n\n唯一交互是交谈：交谈会给出三个选项，分别把本模组的百科页面、社区百科首页在浏览器中打开，或什么都不做。
actors.mobs.npcs.sheep.catalog_desc=绵羊是_被诅咒的法杖_的随机效果、_绵羊披风_神器与_羊圈陷阱_制造出来的临时生物。它带有幻影属性，属于中立单位，无法被伤害、无法被附加任何状态，也不会攻击或掉落任何物品。\n\n它只在原地停留一段固定时间后自行消失（_被诅咒的法杖_产生的约 _10_ 回合，_绵羊披风_与_羊圈陷阱_产生的为 _2_ 至层数加 _11_ 回合）；交互只会显示一句台词。
actors.mobs.npcs.spdbattlemage.catalog_desc=霜寒战斗法师是固定在村庄里的 NPC，不可移动，无交易、任务与战斗功能，也无法被伤害或附加任何状态。\n\n交谈时可以选择听他自我介绍，或向他询问建议：未持有_Yendor护身符_时会从 _4_ 条提示中随机抽出一条，已持有_Yendor护身符_时则给出另一句台词。
actors.mobs.npcs.thebouquet.catalog_desc=花束固定在村庄里，不可移动，也无法被伤害或附加任何状态。\n\n交互有两个选项：「触碰花束」与「聆听花语」；「聆听花语」没有任何效果。第一次「触碰花束」会让你陷入 _10_ 回合的_冻伤_，并在你所在的位置掉下一颗_冰冠花之种_，同时使村庄开始持续飘雪；飘雪在该存档中只触发一次，此后再次触碰不会产生任何效果。
actors.mobs.npcs.undeadshopkeeper.catalog_desc=不死商人生成于隐藏房间中的商店（秘密房间约有 _9%_ 概率是商店）。与普通商人不同，他要求_先付款后看货_：首次选择购买时会先索要（_100_ 加层数乘 _10_）枚金币的费用，付清后才会摆出商品；付款之前不会展示商品，也无法购买或偷窃。\n\n付款后货架为两件随机戒指或神器（每件四成概率是神器，并保证至少一件神器），另有 _20%_ 概率出售一本_天赋之书_；折扣天赋会降低查看商品的费用。他另有一个「好奇问他既然是要做生意，为什么还要躲在这种地方呢」的交谈选项。\n\n它不可移动，受到攻击或状态影响、以及偷窃失败时会立刻逃走。
actors.mobs.npcs.wandmaker.catalog_desc=老杖匠是任务型 NPC，在第 _7_ 至 _9_ 层的入口房间生成（越深越可能出现，若此前未出现过则第 _9_ 层必定出现），一局内只会生成一次。\n\n委托内容取决于该层生成的特殊房间，共三种：取回_尸尘_、点燃 _4_ 根_仪祭蜡烛_并击败被召唤出的新生火元素取得_元素余烬_，或摧毁_腐烂之心_后摘回_腐败果之种_。\n\n完成后他让你在两根法杖中挑选一根作为报酬，两根法杖都已鉴定、未诅咒、为 _+1_ 强化且互不相同；交付时委托物品会被收走，必须把它带在身上才能领奖，尚未找到时他会给出提示。
actors.mobs.npcs.yvette.catalog_desc=伊薇特是在洞穴层（第 _11_ 至 _14_ 层）封闭特殊房间里生成的任务 NPC：越深越可能出现，第 _14_ 层必定生成该房间，房间内约四分之三的概率是她，其余情况是一个装有钥匙与装备的骷髅堆；一局内她与巨魔铁匠任务二选一。她受到攻击不会受伤，也无法被附加状态。\n\n交谈后她请求一张_传送卷轴_，并顺便为你鉴定_传送卷轴_；她还会各接受一次食物与一瓶_治疗药剂_，其它食物、药剂或卷轴会被退回。若给出_治疗药剂_后再交出_传送卷轴_，她让你二选一：收下_伊薇特的魔法长弓_（已鉴定，强化等级 _+0_ 约两成、_+1_ 约五成、_+2_ 约两成半、_+3_ 约半成）并回复 _4_ 至 _10_ 点精神值；或婉拒长弓、收下钥匙，得到一把第 _20_ 层的_铁钥匙_并回复 _10_ 至 _25_ 点精神值，若此前给过食物还会习得_定点传送_天赋。无论选哪条她都会离开。若未给过_治疗药剂_就交出_传送卷轴_，她只会留下随机战利品后离开。\n\n首次交谈时也可以直接选择「背叛她」：她当场死亡，你受到 _4_ 至 _10_ 点精神伤害，她留下第 _20_ 层_铁钥匙_、_游侠系带_、随机武器、_魔法长弓（已损坏）_与她的日记。任务完成后她会出现在村庄，可以选择把_伊薇特的魔法长弓_还给她。
actors.mobs.npcs.kingstatuary.catalog_desc=位于 _20_ 层城市首领关卡的 NPC，不可移动，不会被攻击所伤，也不会被附加状态。\n\n交互选项为「为其戴上王冠」：没有_矮人王冠_（由 _20_ 层首领矮人国王掉落）时不产生任何效果；持有王冠时，王冠从背包中移除（已装备会先卸下），并在你脚下掉落一份_伟大图纸_（可用于强化某些专属装备的图纸）。交出王冠后雕像不再可以交互，每个存档只能完成一次。
actors.mobs.npcs.statuary.catalog_desc_angel=出现在普通关卡的雕像特殊房间中的三种塑像之一，不可移动，不会被攻击所伤，也不会被附加状态；三种形象在全部出现过一次之前不会重复，每关至多一座。与女神雕塑交互时，在「_祈祷_」与「_亵渎_」之间做出选择；互动一次后塑像失去活力，无法再次交互。\n\n「祈祷」掷一次十面骰：掷出 _0_（_10%_）遭遇不洁，受到 _5_ 至 _15_ 点精神伤害；掷出 _1_ 至 _9_ 都会回复当前精神值的 _30%_，若回复量不足 _15_ 点，还会额外获得 _25_ 至最大生命值点护盾。其中掷出 _8_ 或 _9_（合计 _20%_）会让装备的武器附上_圣洁铭文_（空手时不会发生）；掷出 _1_（_10%_）掉落一次性神器_圣者之辉_（全局仅此一次，已经掉落过则无额外效果）；掷出 _2_ 至 _7_ 只回复精神值。\n\n「亵渎」随机诅咒一件已装备且尚未被诅咒的物品：武器被刻上随机负面铭文，护甲被附加随机诅咒雕文；若身上没有可诅咒的装备，则改为受到 _3_ 至 _12_ 点精神伤害。无论结果如何，都会在你脚下留下一份_不洁之血_。
actors.mobs.npcs.statuary.catalog_desc_devil=出现在普通关卡的雕像特殊房间中的三种塑像之一，不可移动，不会被攻击所伤，也不会被附加状态；三种形象在全部出现过一次之前不会重复，每关至多一座。与恶魔雕塑交互时，在「_献祭_」与「_亵渎_」之间做出选择；生命值低于最大生命值一半时，献祭会被拒绝且塑像保持活性，其余情况下互动一次后塑像失去活力。\n\n「献祭」先使你受到相当于最大生命值五分之一的伤害。随后有 _5%_ 的概率什么也得不到，其余情况还要再付出一笔代价：_75%_ 的概率是失血，受到最大生命值 _25%_ 至 _50%_ 的纯粹伤害（至多把你打到只剩 _1_ 点生命）；_25%_ 的概率是失去理智，受到 _18_ 至 _30_ 点纯粹精神伤害。\n\n报酬按下列顺序发放：若持有等级不超过 _+8_ 的_影之灵龛_，直接将它强化 _2_ 级，不再发放别的；否则失血路线会永久增加 _8_ 至 _15_ 点最大生命值，并有 _20%_ 概率再为装备的武器刻上_血饮铭文_；失智路线则有 _25%_ 概率掉落一次性神器_血精之盅_（全局仅此一次），未能掉落时改为给予恰好升一级所需的经验。\n\n「亵渎」会在你周围可通行的空格唤出 _1_ 至 _2_ 名_恶魔幽魂_（_25%_ 概率为两名）。
actors.mobs.npcs.statuary.catalog_desc_monster=出现在普通关卡的雕像特殊房间中的三种塑像之一，不可移动，不会被攻击所伤，也不会被附加状态；三种形象在全部出现过一次之前不会重复，每关至多一座。与魔神雕塑交互时，在「_供奉_」与「_亵渎_」之间做出选择；累计供奉达到 _500_ 枚金币后石像失去活力，不再回应。\n\n「供奉」会献上最多 _100_ 枚金币（不足 _100_ 枚时献出全部），金额逐次累计且不会退回；只有一次能拿出 _100_ 枚时才会立刻结算，成功率随累计总额线性提高：累计 _100_ 枚时约 _30%_，_500_ 枚时约 _90%_。结算成功后按概率给出下列之一：_勃耶西亚之锋_（_10%_，全局仅此一次，且需背包有空位，无法发放时按武器处理）、武器（_20%_）、护甲（_25%_）或随机物品（_45%_）。\n\n「亵渎」会清空你的地图记忆（已探索与已绘制的地图全部消失），并在你脚下掉落一件带诅咒的物品：武器（_40%_）或护甲（_60%_）；护甲附带随机诅咒雕文，近战武器附带随机负面铭文，随后该物品被强化 _1_ 级（_20%_ 概率为 _2_ 级），诅咒保持不变。
actors.mobs.npcs.statuary.catalog_desc=塑像分_女神雕塑_、_恶魔雕塑_ 与 _魔神雕塑_ 三种形象，出现在普通关卡的雕像特殊房间中，三种形象在全部出现过一次之前不会重复，每关至多一座；不可移动，不会被攻击所伤，也不会被附加状态。互动一次后塑像失去活力，魔神雕塑在累计供奉 _500_ 枚金币之前可以反复供奉。\n\n女神雕塑在「_祈祷_」与「_亵渎_」之间选择：祈祷掷十面骰，掷出 _0_ 受到 _5_ 至 _15_ 点精神伤害，掷出 _1_ 至 _9_ 回复当前精神值的 _30%_ 并在回复不足 _15_ 点时获得 _25_ 至最大生命值点护盾，其中掷出 _8_ 或 _9_ 让装备的武器附上_圣洁铭文_、掷出 _1_ 掉落一次性神器_圣者之辉_；亵渎随机诅咒一件已装备物品（没有可诅咒的装备时受到 _3_ 至 _12_ 点精神伤害），并留下_不洁之血_。\n\n恶魔雕塑在「_献祭_」与「_亵渎_」之间选择：献祭要求生命值高于一半，先受到最大生命值五分之一的伤害，有 _5%_ 概率什么也得不到，否则再付出一笔（_75%_ 为最大生命值 _25%_ 至 _50%_ 的纯粹伤害，_25%_ 为 _18_ 至 _30_ 点纯粹精神伤害）；报酬为持有等级不超过 _+8_ 的_影之灵龛_时将其强化 _2_ 级，否则失血路线永久增加 _8_ 至 _15_ 点最大生命值（_20%_ 概率附上_血饮铭文_），失智路线 _25%_ 概率掉落一次性神器_血精之盅_、否则给予恰好升一级所需的经验；亵渎在周围唤出 _1_ 至 _2_ 名_恶魔幽魂_（_25%_ 概率两名）。\n\n魔神雕塑在「_供奉_」与「_亵渎_」之间选择：供奉交出最多 _100_ 枚金币并逐次累计，只有一次拿出 _100_ 枚时结算，成功率随累计总额提高（_100_ 枚约 _30%_、_500_ 枚约 _90%_），成功时给出_勃耶西亚之锋_（_10%_，全局一次且需背包有空位）、武器（_20%_）、护甲（_25%_）或随机物品（_45%_）；亵渎清空地图记忆（已探索与已绘制的地图全部消失），并在脚下掉落一件带诅咒的武器（_40%_）或护甲（_60%_）。
