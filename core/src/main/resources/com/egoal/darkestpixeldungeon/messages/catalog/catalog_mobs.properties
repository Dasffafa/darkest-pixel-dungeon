# 图鉴：怪物与 NPC 的详细条目（catalog_desc），由图鉴界面按类名查找
# 键名 = 类全名去掉 com.egoal.darkestpixeldungeon. 前缀后全部小写，再加 .catalog_desc
# 段落之间以 \n\n 分隔；数值与专有名词用下划线 _ 包裹以高亮。
# 通则：怪物有约 _10%~20%_ 的概率以精英形态出现（层数越深概率越高，_全员恶人_ 挑战再提高 _10%_），
# 精英会从该怪物自己的词条池里加权随机获得 1 条（_60%_）、2 条（_30%_）或 3 条（_10%_）额外能力，
# 经验与掉落率随之提高；条目里的「精英词条」段即该怪物的完整词条池，与固有技能分开列出。
# 没有列出精英词条的怪物没有词条池，永远不会成为精英。
actors.mobs.acidic.catalog_desc=出没于 _23~24_ 层（巨型蝎子稀有变种，替代率约 _3.3%_）。沿用巨型蝎子面板与行为。\n\n_特性_：视野 _6_ 格；仅相隔 >_1_ 格时远程射击；攻击附带 _0~12_ 毒素伤害，_33.3%_ 附加_残废_ _6_ 回合；自带_反震_：受创弹回 _0~受创值_ 随机伤害。
actors.mobs.albino.catalog_desc=出没于 _1~4_ 层（啮齿小鼠稀有变种，替代率约 _3.3%_）。伤害与攻速同啮齿小鼠，生命与攻防更高，不掉落_幸运硬币_。\n\n_特性_：自带_流血攻击_：_50%_ 造成等同该次伤害的流血（每回合伤害随剩余时间递减）。\n\n_精英词条_（随机获得 _1_ 条）：_吸血攻击_（回复造成伤害 _33.3%_ 自身生命，精神伤害不触发）。
actors.mobs.ashesskull.catalog_desc=出没于 _11~14_ 层。亡灵、飞行单位，免疫火焰与流血。每 _3_ 次行动有 _1_ 次原地不动（实际移速约 _66.7%_）。\n\n_特性_：相隔非相邻且在 _6_ 格内可见时，每隔 _4_ 回合扑击发动魔法伤害（自目标视野外起跳额外附带 _1~5_ 精神伤害）；死亡时若目标在 _2_ 格内，造成 _1 ~ floor(层数/2)+1_ 精神伤害。
actors.mobs.ballista.catalog_desc=出没于 _13~19_ 层（替代率约 _3.3%_ 替换为速射炮）。机械单位，视野 _6_ 格。免疫狂乱、恐惧、睡眠与流血。\n\n_特性_：装填耗时 _1_ 回合；仅装填且无障碍时开火；自带_击退_：目标相邻时约 _40%_、_2~5_ 格时约 _25%_ 击退。
actors.mobs.bandit.catalog_desc=出没于 _6~9_ 层（疯狂小偷稀有变种，替代率约 _3.3%_）。攻击间隔慢 _1_ 倍，暴击率更高。\n\n_特性_：未持赃物命中时窃取未装备、等级 < _1_ 且非唯一物品，造成 _1~5_ 精神伤害并逃跑（移速 _83%_），额外附加失明 _2~4_ 回合、中毒 _5~6_ 回合（受抗性影响）与残废 _3~7_ 回合；绝路瞬移脱离带走赃物，造成 _2~6_ 无视抗性精神伤害。
actors.mobs.bat.catalog_desc=出没于 _9~14_ 层。飞行单位，移速为普通怪物 _2_ 倍（每回合移动 _2_ 次）；视野白天 _3_ 格，夜晚与午夜 _8_ 格。\n\n_特性_：自带_吸血攻击_：每次攻击回复造成伤害 _33.3%_ 自身生命（精神伤害不触发）；攻击 _25%_ 转为造成 _1~5_ 穿盾精神伤害；夜晚与午夜普攻额外附带伤害 _25%_ 暗影伤害。\n\n_精英词条_（随机获得 _1~3_ 条）：_失明攻击_（_33.3%_ 盲目 _2~5_ 回合）、_暴击攻击_（_10%_ 造成 _1.5_ 倍伤害）、_狂怒_（生命 < _40%_ 伤害提升至 _1.25~1.75_ 倍并判定暴击）、_临终咆哮_（死亡惊动 _16_ 格内怪物）、_黏液攻击_（_33.3%_ 附带_腐蚀淤泥_）、_眩晕攻击_（_33.3%_ 眩晕 _5_ 回合）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）。
actors.mobs.bee.catalog_desc=蜜罐被砸碎或掷地生成。飞行单位，视野 _4_ 格。\n\n_特性_：属性随层数成长：生命为 _(层数+2)×4_，普攻伤害约为自身生命 _10%~25%_；蜜罐被捡起锁定持有者，落地仅攻击周围 _3_ 格内怪物（无目标才攻击 _3_ 格内角色）；被命中怪物转火攻击蜜蜂。
actors.mobs.brute.catalog_desc=出没于 _11~14_ 层（替代率约 _3.3%_ 替换为持盾豺狼）。重型单位，自带 _10_ 护盾（仅抵挡物理伤害，魔法伤害穿透），免疫恐惧。\n\n_特性_：自带_狂怒_：生命 < _40%_ 首次触发耗时 _1_ 回合发作，伤害提升至 _1.25~1.75_ 倍并判定暴击。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外生命_（生命 _+20%~50%_）、_残废攻击_（_33.3%_ 残废 _6_ 回合）、_额外护盾_（护盾 _+最大生命×50%_）、_流血攻击_（_50%_ 造成等量伤害流血）、_麻痹攻击_（_20%_ 麻痹 _1.1_ 回合）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）、_水中减伤_（水中受创 _-50%_）、_草丛减伤_（高草中受创 _-50%_）。
actors.mobs.crab.catalog_desc=出没于 _3~4_ 层。移速为普通怪物 _2_ 倍，无固有技能。\n\n_特性_：攻击约 _5%_ 概率造成暴击。\n\n_掉落_：击杀掉落_神秘的肉_。\n\n_精英词条_（随机获得 _1~3_ 条）：_反震_（受创弹回 _0~受创值_ 随机伤害）、_击退_（相邻约 _40%_、_2~5_ 格约 _25%_ 击退）、_死亡爆炸_（死亡对周围 _8_ 格造成 _floor(层数/2)~层数_ 火焰伤害）、_眩晕攻击_（_33.3%_ 眩晕 _5_ 回合）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）。
actors.mobs.darkspirit.catalog_desc=由其他冒险者阵亡记录生成（在 _1~10_ 层非首领层阵亡、等级与层数差 ≤ _5_ 且带额外正面天赋；现身于阵亡层往下 _5_ 层；每轮最多遭遇 _1_ 次，挑战模式不出现）。\n\n_特性_：继承该英雄职业与护甲（缺失武器则随机生成更强武器）；生命为 _20 + (记录等级+2~3)×4_，攻防参数取自其装备；随身带 _2~3_ 瓶治疗药剂，生命 < _60%_ 概率饮用（血量越低概率越高，回复最大生命 _33.3%_ 并持续回血，冷却 _5_ 回合；被冰冻药水摔碎）。\n\n_掉落_：死亡各有 _30%_ 掉落生前武器与护甲，并传授所带正面天赋（无法获取改给全额经验）；剩余药剂掉落 _1_ 瓶，否则掉落金币。
actors.mobs.devilghost.catalog_desc=恶魔雕塑选择「亵渎」唤出 _1~2_ 名（约 _25%_ 为两名）。恶魔、飞行单位。免疫增益/减益、中毒、燃烧、麻痹、冻结、魅惑。\n\n_特性_：生命 _4_，任何 >_0_ 的伤害均压为 _1_ 点（需命中 _4_ 次击杀）；攻击技巧 _1000_（近乎必中），防御技巧 _20_（非普通伤害对其闪避归零）；对角色造成 _floor(层数/2)+2_（上限 _10_）精神伤害，对其他目标造成 _floor(层数/2) + 0~6_ 必定命中的魔法伤害。\n\n_掉落_：首次击杀掉落一次性_恶魔头骨_。
actors.mobs.dm300.catalog_desc=第 _15_ 层关底首领。机械与重型单位。免疫毒气、恐惧、腐化、魅惑、魔法睡眠、残废。\n\n_特性_：每回合在脚下释放毒气；目标在 _2~8_ 格内进入视野时标记位置，蓄力 _1_ 回合后冲锋（冷却 _5_ 回合）：路径单位受重击并_破甲_ _5_ 回合，落点周围受 _50%_ 伤害与 _3_ 回合破甲；近战攻击 _30%_ 击退目标；单次受创 ≥ _4_ 时最大生命永久降低该伤害 _50%_（_1~5_ 点，最低降至 _10_）；生命降至 _30%_ 进入_过载_（伤害 _+25%_，攻速 _+50%_）；护盾归零且生命 < _50%_（过载后为 _30%_）时逃向 _4_ 格内未触发陷阱修理，随机回复生命（最高设至当前血上限，不恢复已损上限）并增加 _20_ 护盾。\n\n_掉落_：骷髅钥匙；未开启苦修之路掉落_重修之书_。
actors.mobs.elemental.catalog_desc=出没于 _14_、_16~19_ 层。恶魔、飞行单位。免疫燃烧状态、烈焰附魔与焰浪法杖；每次被引燃回复 _1_ 生命。\n\n_特性_：普攻带火焰属性，_50%_ 点燃目标；自带_附魔反击（烈焰）_：近战受击约 _33.3%_ 使攻击者武器获得_烈焰附魔_（持续 _8_ 回合）；受冻伤或冰冻立即承受 _1 ~ 最大生命×66.7%_ 冰霜伤害（水中提升至 _50%~100%_）。\n\n_掉落_：击杀 _10%_ 掉落_液火药剂_或_火蝶_。
actors.mobs.eye.catalog_desc=出没于 _22~24_ 层。恶魔、重型、飞行单位。免疫恐惧，普攻带暗影属性。\n\n_特性_：死亡凝视：蓄力 _2_ 回合（蓄力期间受创仅 _25%_，不可被打断），直线灼穿路径所有生物造成 _30~50_ 魔法伤害并烧毁沿途可燃地形（冷却 _3~5_ 回合，失去视野仍朝最后位置发射）。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外生命_（生命 _+20%~50%_）、_额外护盾_（护盾 _+最大生命×50%_）、_白雾反击_（挨打原地释放致盲白雾）、_附魔反击（紊乱）_（近战受击约 _33.3%_ 附上_紊乱附魔_ _8_ 回合）、_临终白雾_（死亡原地释放致盲白雾）、_精神爆炸_（死亡时若目标在 _2_ 格内，造成 _1 ~ floor(层数/2)+1_ 精神伤害）。
actors.mobs.fetidrat.catalog_desc=悲伤幽灵在 _2_ 层生成时的任务目标小首领。恶魔单位，无掉落，处于游荡状态。免疫臭气。\n\n_特性_：自带_黏液攻击_（_33.3%_ 附着持续掉血的_腐蚀淤泥_）与_臭气反击_（挨打原地释放臭气）。击杀推进悲伤幽灵任务。
actors.mobs.frog.catalog_desc=把_妖术试剂_砸向怪物后的变形结果。\n\n_特性_：被砸中怪物化身绵羊停留约 _5~7_ 回合后恢复原形并继续追击；变身期间不攻击，变身结束生命由原怪物接管；首领、小首领及幻影单位免疫变形（仅提示「？」）。
actors.mobs.glowworm.catalog_desc=出没于 _1~20_ 层（仅夜晚与深夜以约 _6.7%_ 概率替代正常怪物）。飞行单位，自带永久照明。\n\n_特性_：属性随层数成长：生命为 _层数×5_，攻击附带 _1~层数_ 毒素伤害，防御减免 _1~层数_ 伤害；自带_附魔反击（淬毒）_：近战受击约 _25%_ 为攻击者武器附上_淬毒附魔_ _8_ 回合；死亡原地爆出毒气，为周围 _8_ 格生物附加_发光_ _20_ 回合并在其中附加中毒 _1~3 + floor(层数/3)_ 回合（受抗性影响）。\n\n_掉落_：击杀 _20%_ 掉落_萤光粉_。
actors.mobs.gnoll.catalog_desc=出没于 _2~4_ 层，无固有技能。\n\n_特性_：攻击约 _9%_ 造成 _1.25_ 倍暴击。\n\n_掉落_：击杀 _30%_ 掉落金币。\n\n_精英词条_（随机获得 _1~3_ 条）：_残废攻击_（_33.3%_ 残废 _6_ 回合）、_额外生命_（生命 _+20%~50%_）、_额外护盾_（护盾 _+最大生命×50%_）、_反击_（约 _17.5%_ 格挡近战普攻并立即还击）、_临终咆哮_（死亡惊动 _16_ 格内怪物）、_草丛减伤_（高草中受创 _-50%_）、_水中减伤_（水中受创 _-50%_）。
actors.mobs.gnolltrickster.catalog_desc=悲伤幽灵在 _3_ 层生成时的任务目标小首领。\n\n_特性_：吹箭远程攻击（无法攻击相邻目标，发现目标主动后退）；命中连击数 _+1_（移动连击数清零），判定值 _= 连击数 + 0~3_：判定值 > _2_ 附加中毒（时长随判定值提高）；判定值 ≥ _6_ 点燃目标（已燃烧仍按中毒处理）。击杀推进幽灵任务。\n\n_掉落_：必定掉落_麻痹毒镖_。
actors.mobs.golem.catalog_desc=出没于 _18~19_ 层。机械与重型单位，攻击间隔为普通怪物 _1.5_ 倍。对狂乱、恐惧、睡眠与流血完全免疫。击杀推进小恶魔任务。\n\n_掉落_：击杀约 _10%_ 掉落_幸运硬币_。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外护盾_（护盾 _+最大生命×50%_）、_反震_（受创弹回 _0~受创值_ 随机伤害）、_残废攻击_（_33.3%_ 残废 _6_ 回合）、_临终白雾_（死亡原地释放致盲白雾）、_临终咆哮_（死亡惊动 _16_ 格内怪物）。
actors.mobs.goo.catalog_desc=第 _5_ 层关底首领。移动封锁本层。免疫恐惧、腐化、魅惑与魔法睡眠。\n\n_特性_：水中每回合回复 _1_ 生命；近身受创 _25%_ 让攻击者附着持续掉血的_腐蚀淤泥_（远程不触发）；未暴击普攻命中 _33.3%_ 叠加_易伤_（受物理伤害 _+25%_，持续 _3_ 回合）；主动_蓄力_警示周围 _2_ 格，满蓄力打击范围 _2_ 格、造成 _3_ 倍暴击伤害；生命 < _50%_ 蓄力几率由 _16.7%_ 提高至 _50%_，命中与闪避各 _+50%_。
actors.mobs.greatcrab.catalog_desc=悲伤幽灵在 _4_ 层生成时的任务目标小首领。额外携带 _10_ 护盾；追击时每 _3_ 次行动 _1_ 次原地不动（实际移速约 _66.7%_，发现速度不受影响）。\n\n_特性_：清醒且未麻痹时，壳完全挡下角色与法杖直接伤害（持续效果、区域效果与陷阱伤害正常生效）。击杀推进幽灵任务。\n\n_掉落_：必定掉落 _2_ 块_神秘的肉_。
actors.mobs.guard.catalog_desc=出没于 _7~9_ 层。重型与恶魔单位，额外携带相当于最大生命 _50%_ 护盾（物理先扣护盾，魔法绕过护盾扣血）。\n\n_特性_：锁链（每只限用 _1_ 次）：相隔 _2~4_ 格非相邻、视野内且有落脚点时，行动约 _33.3%_ 甩出钩链拽至身前并附加_残废_ _4_ 回合。\n\n_掉落_：击杀约 _25%_ 掉落护甲、_治疗药剂_或_守卫头盔_。\n\n_精英词条_（随机获得 _1~3_ 条）：_死亡重生_（死后留头骨 _5~9_ 回合复活）、_额外生命_（生命 _+20%~50%_）、_额外护盾_（护盾 _+最大生命×50%_）、_击退_（相邻约 _40%_、_2~5_ 格约 _25%_ 击退）、_狂怒_（生命 < _40%_ 伤害提升至 _1.25~1.75_ 倍并判定暴击）、_反魔法_（受魔法伤害 _-50%_）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）。
actors.mobs.king.catalog_desc=第 _20_ 层关底首领，拥有两命。免疫麻痹、眩晕、腐化、恐惧、魅惑、魔法睡眠与流血。\n\n_怒气机制_：受创按失血比例累积怒气（上限 _120_），>_100_ 消耗怒气按序判定特殊行动：唤醒场上石像为_矮人亡灵_（耗怒 _100_）；场上头骨 ≥ _3_ 立即全部复活（每具耗怒 _20_）；否则与 _1_ 名亡灵建立 _8_ 回合_系命_转移伤害（耗怒 _40_，已系命则补足护盾至多 _60_）。生命 < _50%_ 且亡灵 ≥ _3_ 名时后撤。\n\n_转阶段_：首杀场上头骨立刻复活，原地留头骨 _5_ 回合后重生（伤害、命中、暴击提升，生命上限降低）；二次击杀通关并消散所有亡灵与头骨。\n\n_随从_：矮人亡灵免疫即死、麻痹与流血；攻击 _20%_（已麻痹降为 _10%_）附加麻痹 _1_ 回合；死后留头骨 _10~19_ 回合复活。\n\n_掉落_：骷髅钥匙、护甲配件包、矮人王冠；非苦修挑战掉落_精进之书_。
actors.mobs.madman.catalog_desc=出没于 _4_、_7~8_、_12~13_、_17~18_ 与 _22~23_ 层。面板随层数成长。\n\n_特性_：呐喊：隔着最多 _3_ 格必中造成 _max(1, 2~5 + floor(层数/5) - 距离)_ 精神伤害（贴身距离按 _1_ 计，无视护甲与护盾，不受大部分减伤影响）。
actors.mobs.mimic.catalog_desc=以宝箱形态出现（每堆物品约 _20%~35%_ 为宝箱怪，由发问者布置）。恶魔单位，免疫流血与灵能震爆卷轴。\n\n_特性_：生命值与命中随层数成长，攻击伤害约为自身生命 _10%~25%_；相邻且位置可见开箱时突袭造成 _max(4, floor(层数/2))_ 精神伤害。\n\n_掉落_：装有原宝箱全部物品，额外掉落金币（_40%_）、护甲（_20%_）、武器（_20%_）或戒指（_20%_）之一。
actors.mobs.monk.catalog_desc=出没于 _16~19_ 层。攻击间隔为普通怪物 _45%_，单次伤害 _12~24_（> _20_ 判定暴击）。免疫狂乱与恐惧。击杀推进小恶魔任务。\n\n_特性_：缴械：命中使计数减 _1_，归零打落手持武器（计数重置为 _3~7_；空手、指虎、被诅咒武器与勃耶西亚之锋不触发）。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外护盾_（护盾 _+最大生命×50%_）、_额外生命_（生命 _+20%~50%_）、_吸血攻击_（吸血 _33.3%_，精神伤害不触发）、_反震_（受创弹回 _0~受创值_ 随机伤害）、_反魔法_（受魔法伤害 _-50%_）、_死亡重生_（死后留头骨 _5~9_ 回合复活）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）。
actors.mobs.newbornelemental.catalog_desc=杖匠任务仪式房间放置 _4_ 支仪祭蜡烛召出。恶魔、小首领，飞行单位，出场生命为上限 _50%_。\n\n_特性_：免疫燃烧，受火伤回复 _1_ 生命；普攻带火焰属性，_50%_ 点燃目标；近战受击约 _33.3%_ 为攻击者武器附上_烈焰附魔_ _8_ 回合（已有附魔不触发）；受冻伤或冰冻直接死亡。\n\n_掉落_：必定掉落任务物品_元素余烬_。
actors.mobs.npcs.abysshero.catalog_desc=由_断剑剑柄_神器召唤的战斗单位（非自然刷新），分盟友与敌人两种形态。\n\n_盟友形态_：神器觉醒且未受诅咒时召唤。生命 _20+5×等级_，命中与闪避 _10+2×等级_，存在 _20×等级+50_ 回合（死亡或超时消散）；攻击带暗影属性；满级自带_威压光环_：每回合让视野内所有生物（包括角色）获得 _3_ 回合_易伤_。\n\n_敌人形态_：神器未觉醒或受诅咒时召唤为敌对；击杀无掉落；在试炼中击败使其觉醒。
actors.mobs.npcs.alchemist.catalog_desc=村庄 NPC。不可被攻击，无战斗能力。\n\n_任务_：首次交谈交付唯一道具_露珠瓶_，收集地牢露水后带回交还（限完成 _1_ 次）。\n\n_报酬_：按露水量结算金币：_(5~14)×露水量 + 20_；露水量 > _3_ 额外给 _2_ 张药剂试纸（_70%_）或急救试剂；露水量 ≥ _10_ 追加一份急救试剂与 _20%_ 概率多给一张试纸。
actors.mobs.npcs.archdemon.catalog_desc=恶魔房间专属 NPC。不可移动，不可被攻击。每个存档限交易 _1_ 次（无可用天赋拒绝交易）。\n\n_削减天赋_：降级已有天赋，可选择献出永久最大生命换取新天赋：献出 _7%_ 有 _50%_ 获得随机正面天赋，献出 _14%_ 必定获得随机正面天赋，献出 _21%_ 额外获得备用天赋位。\n\n_强化天赋_：提升可升级天赋 _1_ 级。代价可选血液（回复速度减半最多 _0.5_、最高元素抗性 _-0.3_，若无正抗性则全抗各 _-0.05_，或损失最大生命 _12%~25%_）；或献祭另一天赋。
actors.mobs.npcs.barterman.catalog_desc=出没于 _3~19_ 层普通房间（出现率约 _10%_，已有商店降为 _5%_）。不收金币，仅提供_以物易物_。受攻击或减益影响立即消失。\n\n_货架_：陈列 _1~3_ 瓶药水、_1~3_ 张卷轴与 _2~5_ 把近战武器（价格不显示）。\n\n_规则_：必须同类交换（药换药、卷换卷、甲换甲），近战武器须同阶数，且已知未诅咒。除交易外可交换站位。
actors.mobs.npcs.blacksmith.catalog_desc=出没于洞穴层（_11~14_ 层）铁匠铺。不可被攻击，房间四周布满火焰陷阱。\n\n_任务_：发放唯一镐子（挖取 _12_ 块_暗金矿_，或用镐子击杀一只蝙蝠使镐头沾血）。\n\n_报酬_：重铸（每个存档限 _1_ 次）：熔掉两件同类装备中较差的一件，使较好的一件等级 _+1_。要求两件同类、已鉴定、未受诅咒、等级非负且可升级。
actors.mobs.npcs.categoal.catalog_desc=村庄 NPC。不可被攻击，无交易、任务与战斗功能。\n\n_交互_：任选回答选项均赠送_猫的礼物_（打开获得幸运硬币、点金手与本层骷髅钥匙）。移速 _5_，未回答不移动，回答后仅在视野外移动。
actors.mobs.npcs.catrawberry.catalog_desc=村庄 NPC。不可被攻击，无交易与战斗功能。\n\n_交互_：按优先级收走背包内一种肉类（神秘的肉、烤肉、煮肉、冷冻生肉片）；无上述肉类时立即传送至视野外空位。
actors.mobs.npcs.disheartenedbuddy.catalog_desc=村庄 NPC。不可被攻击，无交易与任务功能，唯一交互为交谈。\n\n_交互_：随机显示四段台词之一：初次交谈第一段概率约 _62.5%_，后续第一段约 _14.3%_、其余三段各约 _28.6%_；携带_Yendor护身符_时显示专属台词。
actors.mobs.npcs.ghost.catalog_desc=出没于 _2~4_ 层（各层出现率约 _33.3%_、_50%_、_100%_，每局限 _1_ 个）。无法被伤害或附加状态，免疫麻痹与定身。\n\n_任务_：接取在当层生成小首领（_2_ 层腐臭老鼠、_3_ 层豺狼诡术师、_4_ 层巨大螃蟹；目标死前交谈会移至本层他处）；击杀后使_干枯玫瑰_进入神器池。\n\n_报酬_：二选一已鉴定武器或同阶护甲：阶数 _1~5_ 阶概率依次为约 _10%_、_35%_、_30%_、_20%_、_5%_；强化等级 _+0~+3_ 依次为 _40%_、_40%_、_15%_、_5%_；约 _10%_ 概率附带附魔（_1_ 阶武器必带）。交付后消散。
actors.mobs.npcs.ghosthero.catalog_desc=由_干枯玫瑰_召唤的英雄阵营护卫（同时限 _1_ 个）。无法附加状态，免疫毒气、酸雾、燃烧、腐化与精神冲击。\n\n_特性_：生命为 _10+5×玫瑰等级_，存在 _30×玫瑰等级+60_ 回合（超时或英雄死亡消散）；魔法远程射程 _4_ 格，伤害随等级成长；角色在 _2_ 格内且未满血时，每 _15_ 回合治疗 _角色最大生命×(5% + 玫瑰等级×1%)_。首次互动显示介绍，后续互动交换站位。
actors.mobs.npcs.imp.catalog_desc=出没于 _17~19_ 层（各层出现率约 _33.3%_、_50%_、_100%_，每局限 _1_ 个）。不可移动，无法被伤害或附加状态。\n\n_任务_：猎杀城市区域魔像与矮人武僧收集 _8_ 枚_矮人徽记_（接任务后必掉，未接任务击杀约 _30%_ 掉落）。\n\n_报酬_：交付徽记奖励一枚随机强化 _+2_ 的_被诅咒的戒指_后离开。
actors.mobs.npcs.jessica.catalog_desc=村庄关卡（深度 _0_）固定 NPC。\n\n_任务_：接取寻找_柯利的日记_：日记与一枚随机戒指以_遗骸_形式生成于 _6~9_ 层（各层出现率约 _25%_、_33.3%_、_50%_、_100%_，每局限 _1_ 次）。英雄等级为 _1_ 时交谈不推进任务。\n\n_结算_：背包有日记可选归还或谎称自己找到，无日记可谎称未找到；均结束任务且无物品报酬（日记本身为可阅读书籍）。
actors.mobs.npcs.kingstatuary.catalog_desc=位于 _20_ 层首领关卡。不可移动，不受伤害与状态影响。\n\n_交互_：选项「为其戴上王冠」：持有_矮人王冠_时移出背包，使角色习得该职业传奇护甲技能（此后矮人国王的护甲配件包无法再对该角色生效）；无王冠不产生效果。
actors.mobs.npcs.merchant.catalog_desc=出没于 _6_、_11_、_16_ 层（开启铸金大师挑战不生成）。受攻击、负面状态或偷窃失败卷走全部商品逃跑并永久关闭本店（偷窃失败额外惊动全层怪物）。\n\n_货架_：最多陈列 _25_ 件商品，售价受_折扣_天赋等级优惠；可与其交换站位。
actors.mobs.npcs.merchantimp.catalog_desc=出没于 _21_ 层（需完成小恶魔任务且未开启铸金大师挑战）。受攻击或偷窃失败卷走全部商品永久逃跑。\n\n_货架_：除普通商品外，固定贩售祛邪卷轴、探地卷轴、_4_ 件随机药水或卷轴、已鉴定五阶武器与五阶护甲各 _1_ 件（强化等级 _+1~+3_，各有 _50%_ 附带正面附魔/铭文，不带诅咒；价格受折扣天赋优惠）。
actors.mobs.npcs.minstrel.catalog_desc=村庄关卡（深度 _0_）NPC。无交易、任务与战斗功能，无法被伤害或附加状态。\n\n_交互_：交谈可选「唱一首歌」、「自我介绍」或「告辞」；累计游戏回合 > _8000_ 后交谈会透露第 _5_ 层隐藏房间的入口提示。
actors.mobs.npcs.mirrorimage.catalog_desc=由_镜像卷轴_（最多 _3_ 个，受可用空格限制）或_分身_护甲诅咒制造的分身。属于英雄阵营，主动攻击视野内敌人。\n\n_特性_：伤害完全复制制造时角色的攻击力，且必定命中；出手 _1_ 次后立即消散；可与其交换站位。
actors.mobs.npcs.monument.catalog_desc=村庄挑战模式开关。不可移动。\n\n_交互_：英雄等级为 _1_ 时互动开启挑战选择界面；选中至少一项挑战后石碑激活亮起并随存档永久生效，进入地牢无法更改；英雄等级 > _1_ 互动仅显示警告文本。
actors.mobs.npcs.passerby.catalog_desc=村庄 NPC。不可移动，无交易、任务与战斗功能。\n\n_交互_：唯一交互为交谈；首次交谈台词按职业判定（法师与其他职业不同），交谈过一次后再次交谈仅剩一句台词。
actors.mobs.npcs.plaguedoctor.catalog_desc=炼金师特殊形象（约 _30%_ 的炼金师以瘟疫医生形象出现）。无法被攻击。\n\n_货架_：在炼金师货架基础上额外增加剧毒瓦斯药水 _1_ 瓶、礼仪匕首 _1~2_ 把与试剂 _1_ 份。\n\n_交互_：同炼金师（可购买、交换站位，持神偷袖章可偷窃；受攻击或偷窃失败卷货逃跑）。
actors.mobs.npcs.potionseller.catalog_desc=出没于 _3~19_ 层普通房间（出现率约 _20%_，已有商店降为约 _10%_；铸金大师挑战下不生成）。无法被攻击。\n\n_货架_：陈列试剂 _2_ 份（≤ _5_ 层固定为治疗试剂，之后随机）、药水或种子 _3~8_ 件（约 _60%_ 为药水、_40%_ 为种子）；售价为普通商店的 _1.25_ 倍。\n\n_交互_：可购买、交换站位，持神偷袖章可偷窃；受攻击或偷窃失败卷走全部货物逃跑。
actors.mobs.npcs.questioner.catalog_desc=位于无门石室中。不可移动。\n\n_交互_：从苦难、目标、荣誉、恐惧中随机提出一问，提供两个回答选项与「攻击他」：回答任一选项承受 _2~5_ 精神伤害；选择「攻击他」不损精神值，改为在其周围落下落石（造成 _层数+5 ~ 2×层数+10_ 伤害）并留下随机卷轴。做出选择后消散并开门。
actors.mobs.npcs.ratking.catalog_desc=出没于第 _5_ 层隐藏房间（需开密门）。初始沉睡，互动唤醒后游荡，移速为普通怪物 _2_ 倍；不选定敌人且永不攻击角色。无交易与任务功能。
actors.mobs.npcs.robotren.catalog_desc=出没于第 _15_ 层洞穴首领关卡。不可移动，无交易与任务功能，不参与战斗。\n\n_交互_：交谈提供两个选项，分别展示对应其身份与来历的两段专属台词。
actors.mobs.npcs.scholar.catalog_desc=村庄 NPC。不可移动，无交易与任务功能。\n\n_交互_：交谈依次显示三段文本，最后一项打开_苦修之路_挑战信息窗口（列有达成者名单）。
actors.mobs.npcs.scrollseller.catalog_desc=出没于 _3~19_ 层普通房间（出现率约 _18%_，已有商店降为约 _8%_；铸金大师挑战下不生成）。不可移动，受攻击、状态影响或偷窃失败逃走。\n\n_货架_：陈列鉴定卷轴、祛邪卷轴、随机卷轴 _1~3_ 张、未诅咒法杖 _1_ 根（_25%_ 出现第 _2_ 根）及已鉴定奥术刻笔 _1_ 支（商品顺序打乱）。\n\n_服务_：一次性「驱散」：支付 _(层数+4)×40_ 金币为一件未鉴定或被诅咒物品解除诅咒或完成鉴定（折扣天赋可降低费用）。
actors.mobs.npcs.seeker.catalog_desc=村庄 NPC。不可移动，无交易、任务与战斗功能，无法被伤害或附加任何状态。\n\n_交互_：交谈提供三个选项：在浏览器中打开本模组百科页面、社区百科首页，或关闭对话。
actors.mobs.npcs.sheep.catalog_desc=由被诅咒法杖、绵羊披风神器或羊圈陷阱制造的中立幻影生物。无法被伤害或附加状态，不攻击亦无掉落。\n\n_特性_：原地停留固定时间后自行消失（被诅咒法杖产生约 _10_ 回合，披风与陷阱为 _2 ~ 层数+11_ 回合）；交互仅显示一句台词。
actors.mobs.npcs.spdbattlemage.catalog_desc=村庄 NPC。不可移动，无交易、任务与战斗功能，无法被伤害或附加任何状态。\n\n_交互_：交谈可选听自我介绍或询问建议（未持_Yendor护身符_从 _4_ 条提示随机抽取一条，已持有护身符给出另一句台词）。
actors.mobs.npcs.statuary.catalog_desc=普通关卡雕像房三种塑像总览（全部出现过前不重复，每层至多一座）。不可移动，不受伤害与状态影响。互动一次失去活力（魔神雕塑累计满 _500_ 金币前可反复供奉）。\n\n_女神雕塑_：祈祷掷十面骰：_0_ 受 _5~15_ 精神伤害；_1~9_ 回复当前精神 _30%_（不足 _15_ 补 _25~最大生命_ 护盾），其中 _1_ 掉落_圣者之辉_，_8~9_ 附_圣洁铭文_。亵渎诅咒一件装备（无装备受 _3~12_ 精神伤害）并留_不洁之血_。\n\n_恶魔雕塑_：需生命 > _50%_。献祭先受最大生命 _20%_ 伤害，_5%_ 无获，其余付出代价（_75%_ 失血受最大生命 _25%~50%_ 纯伤，_25%_ 失智受 _18~30_ 精神伤害）：持有 ≤ _+8_ 的_影之灵龛_升 _2_ 级，否则失血永久增加 _8~15_ 最大生命（_20%_ 附_血饮铭文_），失智 _25%_ 掉落_血精之盅_或给予升 _1_ 级所需经验。亵渎唤出 _1~2_ 名恶魔幽魂（约 _25%_ 为两名）。\n\n_魔神雕塑_：单次投入上限 _100_ 金币累计，单次拿出 _100_ 结算（成功率 _30%~90%_ 随累计金额提升），奖励_勃耶西亚之锋_（_10%_，全局限 _1_ 次且需背包空位）、武器（_20%_）、护甲（_25%_）或随机物品（_45%_）。亵渎清空全本地图记忆，掉落带诅咒的武器（_40%_）或护甲（_60%_）。
actors.mobs.npcs.statuary.catalog_desc_angel=普通关卡雕像房三种塑像之一。不可移动，不受伤害与状态影响（全出现过前不重复，每层至多一座）。互动一次失去活力。\n\n_祈祷_：掷十面骰判定：\n· 掷出 _0_（_10%_）：遭遇不洁，受 _5~15_ 精神伤害。\n· 掷出 _1~9_：回复当前精神 _30%_（若回复不足 _15_ 点，额外获得 _25~最大生命_ 护盾）；其中掷出 _1_（_10%_）掉落一次性神器_圣者之辉_（全局限 _1_ 次）；掷出 _8~9_（_20%_）使手持武器附上_圣洁铭文_（空手不发生）；掷出 _2~7_ 仅回复精神。\n\n_亵渎_：随机诅咒一件已装备未诅咒物品（武器刻负面铭文，护甲附诅咒雕文；无可用装备改受 _3~12_ 精神伤害），并在脚下留下_不洁之血_。
actors.mobs.npcs.statuary.catalog_desc_devil=普通关卡雕像房三种塑像之一。不可移动，不受伤害与状态影响。生命 < _50%_ 拒绝献祭；互动一次失去活力。\n\n_献祭_：先受最大生命 _20%_ 伤害；后续 _5%_ 无获，其余按概率二选一：\n· 失血（_75%_）：受最大生命 _25%~50%_ 纯伤（至多残留 _1_ 点生命）；持有 ≤ _+8_ 的_影之灵龛_直接升 _2_ 级，否则永久增加 _8~15_ 最大生命（_20%_ 附_血饮铭文_）。\n· 失智（_25%_）：受 _18~30_ 纯粹精神伤害；_25%_ 掉落一次性神器_血精之盅_（全局限 _1_ 次），未掉落改给升 _1_ 级所需经验。\n\n_亵渎_：在周围空格唤出 _1~2_ 名_恶魔幽魂_（约 _25%_ 为两名）。
actors.mobs.npcs.statuary.catalog_desc_monster=普通关卡雕像房三种塑像之一。不可移动，不受伤害与状态影响。累计供奉达 _500_ 金币后失去活力。\n\n_供奉_：单次投入最多 _100_ 金币逐次累计，单次满 _100_ 结算（成功率 _30%~90%_ 随累计金额线性提升）；成功奖励：_勃耶西亚之锋_（_10%_，全局限 _1_ 次且需背包空位）、武器（_20%_）、护甲（_25%_）或随机物品（_45%_）。\n\n_亵渎_：清空本关已探索与已绘制地图记忆；在脚下掉落一件带诅咒的武器（_40%_）或护甲（_60%_），强化等级 _+1_（_20%_ 概率为 _+2_）。
actors.mobs.npcs.thebouquet.catalog_desc=村庄固定道具。不可移动，无法被伤害或附加状态。\n\n_交互_：选项「触碰花束」与「聆听花语」（聆听无效果）。首次触碰陷入 _10_ 回合_冻伤_，掉落一颗_冰冠花之种_，并使村庄持续飘雪（每档限 _1_ 次，后续触碰无效果）。
actors.mobs.npcs.undeadshopkeeper.catalog_desc=出没于隐藏房间商店（秘密房间约 _9%_ 概率为商店）。不可移动，受击、状态影响或偷窃失败立即逃走。\n\n_机制_：先付款后看货：首次需支付 _100+10×层数_ 金币（折扣天赋可优惠）货架方才出现；此前无法查看、购买或偷窃。可与其闲聊。\n\n_货架_：固定陈列 _2_ 件戒指或神器（每件 _40%_ 为神器，至少保底 _1_ 件神器）；另有约 _20%_ 额外贩售一本_天赋之书_。
actors.mobs.npcs.wandmaker.catalog_desc=出没于 _7~9_ 层入口房间（各层出现率随深度递增，此前未出则 _9_ 层必出，每局限 _1_ 个）。不可移动。\n\n_任务_：当层随机生成三类委托之一：取回_尸尘_、点燃 _4_ 支蜡烛击败新生火元素取得_元素余烬_，或摧毁腐烂之心摘回_腐败果之种_。\n\n_报酬_：在两根互不相同、已鉴定、未诅咒且强化 _+1_ 的法杖中自选一根，随后消散。
actors.mobs.npcs.yvette.catalog_desc=出没于洞穴层（_11~14_ 层）封闭房间（越深概率越高，_14_ 层必出特殊房且 _75%_ 为伊薇特；与巨魔铁匠互斥，同局二选一）。不会被攻击所伤，无法附加状态。\n\n_任务_：讨要一张_传送卷轴_（背包有未鉴定传送卷轴为其免费鉴定），另可接受 _1_ 次食物与 _1_ 瓶_治疗药剂_。\n\n_报酬_：\n· 给药后交卷轴：二选一：收下已鉴定强化 _+0~+3_（依次为 _20%_、_50%_、_25%_、_5%_）的_伊薇特的魔法长弓_并回复 _4~10_ 精神值；或收下 _20_ 层铁钥匙并回复 _10~25_ 精神值（曾给食物额外传授专属天赋_定点传送_，日后村庄可见且可还弓）。\n· 未给药交卷轴：原地留下随机战利品后离开。\n· 首次交谈选「攻击她」：当场击杀，对角色造成 _4~10_ 精神伤害，掉落 _20_ 层铁钥匙、_游侠系带_、随机武器、损坏的魔法长弓与日记。
actors.mobs.piranha.catalog_desc=仅在水中生成与移动（所处格非水立即死亡）。移速为普通怪物 _2_ 倍。水池普通房每间 _1_ 只，水潭房每间 _3_ 只。\n\n_特性_：生命 _10+5×层数_，命中 _20+2×层数_，闪避 _10+2×层数_，伤害 _层数 ~ 2+2×层数_，自身减免 _0~层数_ 伤害；命中 _50%_ 造成伤害 _50%_ 的_流血_；免疫燃烧、麻痹、毒气、缠绕、冰冻。\n\n_掉落_：必定掉落_神秘的肉_，约 _35%_ 额外掉落鱼骨（累计击杀 _6_ 只解锁成就）。
actors.mobs.quickfiringgun.catalog_desc=出没于 _13~14_、_16~19_ 层（弩炮稀有变种，替代率约 _3.3%_）。机械单位，视野 _6_ 格。免疫狂乱、恐惧、睡眠与流血。\n\n_特性_：弹仓容量 _3_ 发，打空后重新装填；攻击间隔约 _33.3%_ 回合，单发伤害低于弩炮但暴击倍率更高；攻击需视线，附带_击退_（相邻约 _40%_、_2~5_ 格约 _25%_ 击退）。
actors.mobs.rat.catalog_desc=出没于 _1~4_ 层（替代率约 _3.3%_ 替换为白化老鼠）。无固有技能。\n\n_掉落_：击杀约 _5%_ 掉落_幸运硬币_。\n\n_精英词条_（随机获得 _1~3_ 条）：_流血攻击_（_50%_ 造成等量伤害流血）、_毒素攻击_（_50%_ 造成中毒 _floor(层数/2)~层数_ 回合）、_吸血攻击_（回复造成伤害 _33.3%_ 自身生命，精神伤害不触发）、_草丛减伤_（高草中受创 _-50%_）。
actors.mobs.rotheart.catalog_desc=杖匠任务特殊房间中央守卫。不可移动小首领，被动不攻击。免疫恐惧、流血与毒气。\n\n_特性_：挨打原地释放毒气；任何单次攻击附带 ≥ _1_ 火焰伤害直接将其秒杀（无论剩余生命）；死亡房间内腐烂触手全部一同死亡。\n\n_掉落_：必定掉落_腐败果之种_。
actors.mobs.rotlasher.catalog_desc=腐烂之心特殊房间守卫。不可移动单位，无法引开。免疫毒气、恐惧与流血。\n\n_特性_：生命为 _层数×5_，身旁无敌人每回合回复 _3_ 生命；自身减免 _0 ~ floor(层数/2)_ 伤害；攻击伤害 _1+floor(层数/2) ~ 2+层数_，命中附加 _2_ 回合_残废_。
actors.mobs.rotten.catalog_desc=出没于 _9_、_11~14_ 层。恶魔远程单位，攻击间隔为普通怪物 _1.5_ 倍。免疫恐惧与流血。\n\n_特性_：需视线在 _4_ 格内发射魔法弹攻击；对非英雄单位转为魔法属性；命中英雄 _50%_ 附着_腐蚀淤泥_，并使英雄自身生命值减免 _1_ 点（最低 _1_ 点）。
actors.mobs.scorpio.catalog_desc=出没于 _23~24_ 层。恶魔远程单位，视野 _6_ 格。\n\n_特性_：不攻击相邻目标，发现目标主动后退；普攻附加 _0~12_ 毒素伤害，_33.3%_ 附加_残废_ _6_ 回合（已残废不触发）。\n\n_掉落_：击杀约 _20%_ 掉落_治疗药剂_（_70%_）或_神秘的肉_（_30%_）。
actors.mobs.senior.catalog_desc=出没于 _16~19_ 层（武僧稀有变种，替代率约 _3.3%_）。额外携带 _20_ 护盾，伤害高于武僧。免疫狂乱与恐惧。\n\n_特性_：缴械：每 _3~7_ 次命中打落武器（拳套类与受诅咒武器不受影响）；自带_麻痹攻击_：_20%_ 使目标麻痹约 _1.1_ 回合。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外护盾_（护盾 _+最大生命×50%_）、_额外生命_（生命 _+20%~50%_）、_吸血攻击_（吸血 _33.3%_，精神伤害不触发）、_反震_（受创弹回 _0~受创值_ 随机伤害）、_反魔法_（受魔法伤害 _-50%_）、_死亡重生_（死后留头骨 _5~9_ 回合复活）。
actors.mobs.shaman.catalog_desc=出没于 _6~9_ 层。远程施法者。\n\n_特性_：弹道可达全图远程闪电攻击，每次附加 _1~5_ 光属性伤害（目标水中且不飞行伤害 _+50%_）；无法攻击或被贴身时，为 _4_ 格视野内未狂暴同伴施加_狂暴_（持续 _10_ 回合，伤害 _+50%_），无可用同伴才近战（近战无光伤害附加）。\n\n_掉落_：击杀约 _15%_ 掉落药剂或卷轴。\n\n_精英词条_（随机获得 _1~3_ 条）：_毒气反击_（挨打原地释放毒气）、_额外生命_（生命 _+20%~50%_）、_临终火球_（死亡向周围发射火球）、_反魔法_（受魔法伤害 _-50%_）。
actors.mobs.shielded.catalog_desc=出没于 _11~14_ 层（豺狼暴徒稀有变种，替代率约 _3.3%_）。重型单位，自带 _30_ 护盾（防御更高，物理先扣护盾，魔法穿透），免疫恐惧。\n\n_特性_：自带_狂怒_：生命 < _40%_ 伤害提升至 _1.25~1.75_ 倍并判定暴击。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外生命_（生命 _+20%~50%_）、_残废攻击_（_33.3%_ 残废 _6_ 回合）、_额外护盾_（护盾 _+最大生命×50%_）、_流血攻击_（_50%_ 造成等量伤害流血）、_麻痹攻击_（_20%_ 麻痹 _1.1_ 回合）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）、_草丛减伤_（高草中受创 _-50%_）、_水中减伤_（水中受创 _-50%_）。
actors.mobs.skeleton.catalog_desc=出没于 _6~9_ 层。亡灵单位，免疫流血。\n\n_特性_：自带_死亡爆炸_：死亡对周围 _8_ 格生物造成 _floor(层数/2)~层数_ 火焰伤害。\n\n_掉落_：击杀约 _17.5%_ 掉落武器（掉落判定中约 _4%_ 替换为_古老者之手_，全局限 _1_ 次）。\n\n_精英词条_（随机获得 _1~3_ 条）：_死亡重生_（死后留头骨 _5~9_ 回合复活）、_额外护盾_（护盾 _+最大生命×50%_）、_击退_（相邻约 _40%_、_2~5_ 格约 _25%_ 击退）、_暴击攻击_（_10%_ 造成 _1.5_ 倍伤害）。
actors.mobs.skeletonknight.catalog_desc=出没于 _11~14_ 层。亡灵单位，免疫流血。\n\n_特性_：暴击率 _10%_（倍率 _1.25_）；攻击 _17.5%_ 在同一回合追加一次攻击（冷却 _2_ 回合）；自带_反击_：约 _17.5%_ 格挡近战普攻并立即还击。\n\n_掉落_：击杀约 _10%_ 掉落_棕色麦芽酒_、_红树根_或_幸运硬币_（掉落判定中约 _15%_ 替换为_古老者之手_，全局限 _1_ 次）。\n\n_精英词条_（随机获得 _1~3_ 条）：_死亡重生_（死后留头骨 _5~9_ 回合复活）、_额外护盾_（护盾 _+最大生命×50%_）、_暴击攻击_（_10%_ 造成 _1.5_ 倍伤害）、_麻痹攻击_（_20%_ 麻痹约 _1.1_ 回合）、_反震_（受创弹回 _0~受创值_ 随机伤害）、_反魔法_（受魔法伤害 _-50%_）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）。
actors.mobs.slug.catalog_desc=出没于 _1~4_ 层。攻击间隔为普通怪物 _1.5_ 倍，免疫流血与恐惧。\n\n_特性_：普攻附加 _1~3_ 毒素伤害；物理免伤 _40%_（受物理伤害 _×0.6_，最低 _1_ 点）。
actors.mobs.spinner.catalog_desc=出没于 _13~14_ 层。免疫定身。\n\n_特性_：自带_毒素攻击_：命中 _50%_ 附加中毒 _floor(层数/2)~层数_ 回合；目标中毒期间立刻逃跑，逃跑每步沿路留下 _5~6_ 团_蜘蛛网_，目标毒退后重新追击。\n\n_掉落_：击杀约 _10%_ 掉落_神秘的肉_。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外生命_（生命 _+20%~50%_）、_麻痹攻击_（_20%_ 麻痹约 _1.1_ 回合）、_毒气反击_（挨打原地释放毒气）、_黏液攻击_（_33.3%_ 附带_腐蚀淤泥_）。
actors.mobs.statue.catalog_desc=雕像陷阱与藏宝房间守卫。初始静止不行动，受创后追击。生命 _15+5×层数_，命中与防御随层数递增。\n\n_特性_：握随机生成已鉴定带正面铭文非诅咒近战武器（伤害、射程、命中与攻速取自该武器）；受即死效果伤害 _-20%_，免疫_血饮_铭文与_摄魂_。\n\n_掉落_：必定掉落手持武器。
actors.mobs.succubus.catalog_desc=出没于 _19~24_ 层。恶魔单位，视野 _6_ 格，免疫睡眠。\n\n_特性_：瞬移：可见目标距离 > _2_ 格闪现至身边攻击（冷却 _5_ 回合）；攻击额外附带 _2~10_ 寒冰伤害，自带_魅惑_：_33.3%_ 施加_魅惑_ _3~6_ 回合（期间无法攻击魅魔，攻击其他敌人不解除）。\n\n_掉落_：击杀约 _5%_ 掉落_催眠卷轴_。\n\n_精英词条_（随机获得 _1~3_ 条）：_麻痹攻击_（_20%_ 麻痹约 _1.1_ 回合）、_吸血攻击_（吸血 _33.3%_，精神伤害不触发）、_失明攻击_（_33.3%_ 盲目 _2~5_ 回合）、_临终咆哮_（死亡惊动 _16_ 格内怪物）、_眩晕攻击_（_33.3%_ 眩晕 _5_ 回合）、_攻击加速_（攻后行动间隔 _-0.2_ 回合）、_水中减伤_（水中受创 _-50%_）。
actors.mobs.swarm.catalog_desc=出没于 _3~4_、_6_ 层。生命 _50_。\n\n_特性_：受创时当前生命 ≥ _伤害+2_，在相邻格分裂幻影新个体（生命为扣除伤害后剩余生命 _50%_，原个体扣除等量生命）；攻击 _33.3%_ 转为造成 _1~2_ 精神伤害（无视护甲与护盾）。\n\n_掉落_：击杀约 _8%_ 掉落已鉴定治疗药剂。
actors.mobs.tengu.catalog_desc=第 _10_ 层关底首领。直线弹道，远程闪避翻倍。免疫恐惧、腐化、魅惑、冻伤与魔法睡眠。\n\n_一阶段_：受创 ≥ _15_ 点且相邻（或失去视野）、或跨越生命区段时瞬移（落点距原处 ≥ _5_ 格，约 _20%_ 跳向中央水池，着火必定跳水池）；生命降至 _50%_ 锁血、熄灯并致盲目标 _2_ 回合进入二阶段。\n\n_二阶段_：在目标身旁召唤 _2~3_ 个幻影（复制当前生命与上限）并瞬移至其一（周围空位 < _4_ 直接瞬移）；有幻影在场天狗挨打消散所有幻影并瞬移，击碎幻影本体不伤。\n\n_掉落_：骷髅钥匙、月亮石；非苦修挑战掉落天赋之书；约 _33.3%_ 掉落强化 _+1_ 的_腾古之剑_。
actors.mobs.thief.catalog_desc=出没于 _6~9_ 层（替代率约 _3.3%_ 替换为疯狂强盗）。攻击间隔为普通怪物 _50%_（每回合攻击 _2_ 次）。免疫定身。\n\n_特性_：未持赃物命中时窃取未装备、非唯一且等级 < _1_ 物品，得手造成 _1~5_ 精神伤害并逃跑（移速 _83%_；挑中勃耶西亚之锋反受 _6~12_ 暗影伤害）；未得手或持赃攻击 _25%_ 致残 _1.5_ 回合；绝路无视线瞬移离场永久丢失赃物，造成 _2~6_ 无视抗性精神伤害。\n\n_掉落_：击杀必掉回赃物；掉落判定约 _10%_ 触发（其中 _10%_ 概率为全局限 _1_ 次的_神偷袖章_，否则为红柄短刀、金币或幸运硬币之一）。\n\n_精英词条_（随机获得 _1~3_ 条）：_额外生命_（生命 _+20%~50%_）、_暴击攻击_（_10%_ 造成 _1.5_ 倍伤害）、_临终咆哮_（死亡惊动 _16_ 格内怪物）、_反魔法_（受魔法伤害 _-50%_）、_黏液攻击_（_33.3%_ 附带_腐蚀淤泥_）、_眩晕攻击_（_33.3%_ 眩晕 _5_ 回合）、_草丛减伤_（高草中受创 _-50%_）。
actors.mobs.wandguard.catalog_desc=法杖房间守卫（不参与普通刷怪，_1_ 层不出）。不可移动机械单位，视野 _6_ 格。生命为 _(floor(层数/5)+1)×10_。免疫一切增益与减益状态。\n\n_特性_：随机手持法杖（等级 _floor(层数/5)~floor(层数/3)_），直线弹道造成 _2+2×杖等级 ~ 8+3×杖等级_ 魔法伤害。\n\n_掉落_：必定掉落手中等级归零、重新随机且未受诅咒的法杖。
actors.mobs.warlock.catalog_desc=出没于 _16~19_ 层。远程施法者。\n\n_特性_：视野内可见即可全图隔空释放暗影弹，相邻改用近战；命中额外附带 _2~10_ 暗影伤害，命中角色 _50%_ 叠加_虚弱_。\n\n_掉落_：击杀约 _40%_ 掉落药剂。\n\n_精英词条_（随机获得 _1~3_ 条）：_毒气反击_（挨打原地释放毒气）、_额外护盾_（护盾 _+最大生命×50%_）、_临终白雾_（死亡原地释放致盲白雾）、_临终毒气_（死亡原地释放毒气）。
actors.mobs.witchdoctor.catalog_desc=出没于 _8~9_、_11~14_ 层。攻击射程 _2_ 格。\n\n_特性_：优先治疗视野内生命 < _75%_ 同伴（回复 _8 ~ 目标生命上限×10%+5_，对同伴再 _+5_）；自身生命 < _50%_ 治疗自己（冷却 _3_ 回合）；腐朽：优先对 _4_ 格内未腐朽目标施放_腐朽_（持续 _15_ 回合，冷却 _20_ 回合，受治疗转为等量伤害）；目标已腐朽且自身生命 ≥ _20%_ 时，对其施展治疗造成 _8 ~ 角色生命上限×10%+5_ 伤害。\n\n_掉落_：击杀约 _10%_ 掉落急救试剂、仪式匕首或药剂。\n\n_精英词条_（随机获得 _1~3_ 条）：_魅惑攻击_（_33.3%_ 魅惑 _3~6_ 回合）、_毒气反击_（挨打原地释放毒气）、_毒素攻击_（_50%_ 造成中毒 _floor(层数/2)~层数_ 回合）、_黏液攻击_（_33.3%_ 附带_腐蚀淤泥_）。
actors.mobs.wraith.catalog_desc=亡灵、飞行单位，生命仅 _1_。免疫即死、恐惧与腐化。不参与普通刷怪。\n\n_特性_：攻击技巧 _10+层数_，伤害 _1+floor(层数/2) ~ 2+层数_；防御技巧 _(10+层数)×5_（闪避仅对普通伤害生效，法术/元素/精神必中）。\n\n_生成机制_：开墓约 _66.7%_ 在四周召出一批怨灵并损失 _3~6_ 精神值；开遗骸中诅咒物品召出 _1_ 只（无处可站改直接损失 _50%_ 生命与 _4~12_ 精神值）；拾起_尸尘_持续产生怨灵，丢下时消散。
actors.mobs.yog.catalog_desc=第 _25_ 层最终首领。不可移动，每回合回复 _1_ 生命。受即死伤害仅承受 _25%_。免疫狂乱、睡眠、恐惧、毒素、眩晕、腐化、魔法睡眠与麻痹。\n\n_特性_：暗影射线凝视（冷却 _5_ 回合，无视闪避）：造成 _5 ~ 15+失血比例×10_ 精神伤害；每次挨打惊醒双拳与幼虫，并在身旁空格召唤一只_古神幼虫_（伤害 _22~30_）；双拳存活每只使其受创减半（两拳并存时受创仅 _25%_）。\n\n_随从_：腐烂之拳：伤害 _20~50_，命中 _33.3%_ 附加_腐蚀淤泥_，身处水中每回合回复 _4_ 生命，全控与毒火免疫；燃烧之拳：远程发射火焰弹，每回合点燃自身周围 _9_ 格，全控与燃烧免疫。
