items.potions.potionofhealing.catalog_desc=饮用耗时 _1_ 回合。\n\n立即回复生命上限总量的 _1/4_，其余转为_愈合_，每回合回复 _ceil(剩余/4)_ 点直至耗尽。总量默认为 _max(生命上限, 生命上限/3+50)_，_急救_天赋 _1/2/3_ 级时改为 _生命上限×5/4_、_×2_、_×3_。饮用同时解除_流血_。_腐朽_状态下一切治疗转为等量伤害。涂抹武器可获得 _20_ 点_疗伤_附魔。\n\n投掷或碎裂使落点 _3×3_ 内所有单位各自获得 _生命上限×2/3_ 的_愈合_。

items.potions.potionofexperience.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _当前升级所需经验的 2/3_。满级（_30_ 级）时改为获得 _30_ 回合_祝福_。涂抹武器可获得 _20_ 点_老练_附魔。

items.potions.potionofstrength.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n永久 _+1_ 力量。涂抹武器可获得 _20_ 点_猛击_附魔。

items.potions.potionofmight.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n永久 _+1_ 力量与 _+6_ 生命上限，并回复 _6_ 点生命。涂抹武器可获得 _20_ 点_猛击_附魔。

items.potions.potionofphysique.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n永久提升 _5~10_ 点生命上限并回复等量生命，取值靠近中间值的概率更高。。涂抹武器可获得 _20_ 点_紊乱_附魔。

items.potions.potionoffrost.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n对落点 _2_ 格内（受视线阻挡）的每个单位施加_冰霜_：陆地持续 _5~7.5_ 回合，水中 _25~37.5_ 回合，受目标抗性影响。_冰霜_使目标无法行动，其承受的伤害提高 _50%_，受到任意伤害即解除。碎裂同时扑灭范围内火焰、冻结地面物品，并有几率冻碎持有者背包中的一瓶药剂。涂抹武器可获得 _20_ 点_寒霜_附魔。

items.potions.potionofliquidflame.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点 _3×3_ 范围内引燃：可燃地形、范围内的单位与物品堆均会起火。火焰逐回合衰减并向相邻可燃格蔓延，火中单位被_点燃_，每回合受到 _8_ 点火焰伤害（受抗性影响）。涂抹武器可获得 _20_ 点_烈焰_附魔。

items.potions.potionoftoxicgas.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点生成毒气云，只经非实心格扩散并逐回合衰减。云中每个单位每回合受到毒属性伤害，基准为 _(生命上限+5+层数×4)/30_（向下取整，至少 _1_），并有几率额外附加 _0~层数-1_ 点。涂抹武器可获得 _20_ 点_淬毒_附魔。

items.potions.potionofparalyticgas.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点生成麻痹气云，只经非实心格扩散并逐回合衰减。云中每个单位持续获得 _10_ 回合_麻痹_（受抗性影响，取较大值刷新，不叠加），期间无法行动；受到伤害时有概率挣脱，几率随该次伤害相对生命上限的比例提高。涂抹武器可获得 _20_ 点_重击_附魔。

items.potions.potionofmagicalfog.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点生成魔雾，只经非实心格扩散并逐回合衰减。雾中每个单位每回合受到魔法伤害，首次为 _1_ 点，此后伤害上限每回合增加 _1+层数/5_；受魔法抗性影响，_气体免疫_可完全免疫。涂抹武器可获得 _20_ 点_魔力_附魔。

items.potions.potionofpurity.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _15_ 回合_气体免疫_，完全免疫毒气、麻痹气、困惑气、恶臭气与毒液，并解除中毒、残废、虚弱、流血、沉睡、迟缓、眩晕、易伤、酒醉与腐朽。投掷碎裂清除落点 _5_ 格内（受视线阻挡）的毒气、麻痹气、困惑气、恶臭气与毒液，不影响魔雾与火焰。涂抹武器可获得 _20_ 点_紊乱_附魔。

items.potions.potionofinvisibility.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _20_ 回合_隐形_，期间敌人无法看见你；进行近战、射击、施放法杖或阅读卷轴会立即解除。涂抹武器可获得 _20_ 点_致盲_附魔。

items.potions.potionoflevitation.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _20_ 回合_浮空_并解除_定身_：期间可越过陷阱与裂隙，落地时触发落点的压力板与陷阱。投掷碎裂仅产生一团困惑气云，不提供_浮空_。涂抹武器可获得 _20_ 点_电击_附魔。

items.potions.potionofmindvision.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _20_ 回合_灵视_：以自身为中心 _2_ 格（可穿墙）纳入视野，同时感知全层所有非机械单位的位置。涂抹武器可获得 _20_ 点_追踪_附魔。

items.potions.reagentofcatwalk.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _30_ 回合_猫步_：闪避 _+3_、潜行值 _+1_，敌人不会主动发现你。

items.potions.reagentofhallucinogenic.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n使落点单位获得 _6_ 回合_致幻_：期间该单位优先攻击视野内的其他敌人，其次攻击友方单位，最后才攻击你。效果结束时附加 _4_ 回合_残废_。

items.potions.reagentofhealing.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n回复 _round((1-2×当前生命比例)×生命上限)_ 点生命，回复量介于 _1_ 与 _50_ 之间；当前生命比例达到 _1/2_ 时需确认。饮用同时解除_流血_。若饮用后生命比例低于 _0.15_，额外回复 _2~6_ 点压力，比例越高回复越少。

items.potions.reagentofpetrifaction.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n自身进入_石化_：跳过约 _10_ 回合、满足 _11_ 点饱食度，期间隐形。

items.potions.reagentofprecipitate.catalog_desc=不可饮用。涂抹于已附魔且能量未耗尽的武器，使附魔能量增加 _max(当前能量, 10)_：不足 _10_ 时补至 _+10_，达到 _10_ 及以上时翻倍。该动作不消耗回合。

items.potions.reagentofsnakebite.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n使落点单位的毒属性抗性降低 _100%_ 持续 _10_ 回合，并附加 _3_ 回合_中毒_，其每回合伤害另计 _层数/3+1~3_ 的额外值。

items.potions.reagentofsorcery.catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n将落点的普通怪物变成_青蛙_，_5~7_ 回合后于原处变回，期间保留其生命值变化。Boss、迷你 Boss 与 NPC 免疫；英雄不受影响；其余单位被直接消灭。

items.potions.reagentofsweet.catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n立即回复 _5~9_ 点压力，并获得 _20_ 回合_抚慰_，其间每回合回复 _0.3_ 点压力，合计约 _11~15_ 点。

items.potions.potionofhealing.reinforced_catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n立即将生命设置为 _min(2×生命上限, 当前生命+生命上限)_，同时解除_流血_、_中毒_、_残废_、_虚弱_与_燃烧_。投掷碎裂使落点 _3×3_ 内所有单位获得 _生命上限×2/3_ 的_愈合_，不分敌我。涂抹武器可获得 _30_ 点_疗伤_附魔。

items.potions.potionofexperience.reinforced_catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _4+等级×6_ 点经验，即提升 _1_ 级所需的全部经验；满级（_30_ 级）时改为获得 _30_ 回合_祝福_。涂抹武器可获得 _30_ 点_老练_附魔。

items.potions.potionoffrost.reinforced_catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n对落点 _2_ 格内（受视线阻挡）的单位施加_冰霜_：陆地 _5~7.5_ 回合、水中 _25~37.5_ 回合，受目标抗性影响；落点 _3×3_ 内的怪物与落点 _1_ 格内的使用者则直接陷入 _5_ 回合_冰霜_，此部分不受抗性影响。_冰霜_使目标无法行动、承受的伤害提高 _50%_，受到任意伤害即解除。碎裂同时扑灭范围内火焰、冻结地面物品，并有几率冻碎持有者背包中的一瓶药剂。涂抹武器可获得 _30_ 点_寒霜_附魔。

items.potions.potionofliquidflame.reinforced_catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点引发爆炸：对 _3×3_ 内所有单位造成火焰伤害，落点中心为 _层数+5~10+层数×2_，其余格为 _1~10+层数×2_；爆炸烧毁可燃地形并引爆范围内的物品堆，不生成火焰。饮用等同于在自己脚下引发爆炸。涂抹武器可获得 _30_ 点_烈焰_附魔。

items.potions.potionoftoxicgas.reinforced_catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n使落点 _3×3_ 内的怪物与落点 _1_ 格内的使用者_中毒_，不生成毒云；中毒固定持续 _6~9_ 回合（时长不受抗性影响），每回合造成 _(剩余回合/3+额外值)+1_ 点毒属性伤害（受毒属性抗性减免），额外值为 _1+层数/2+(1~3)_。涂抹武器可获得 _30_ 点_淬毒_附魔。

items.potions.potionofmagicalfog.reinforced_catalog_desc=投掷碎裂，饮用等于在自己脚下碎裂。\n\n在落点生成魔雾：只经非实心格扩散并逐回合衰减，雾中每个单位每回合受到魔法伤害，首次 _1_ 点，此后伤害上限每回合增加 _1+层数/5_，受魔法抗性影响，_气体免疫_可完全免疫；同时落点 _3×3_ 内的所有角色获得 _10~15_ 回合的_易伤_，其间承受的魔法伤害 ×_1.35_。涂抹武器可获得 _30_ 点_魔力_附魔。

items.potions.potionofpurity.reinforced_catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _30_ 回合_气体免疫_，完全免疫毒气、麻痹气、困惑气、恶臭气与毒液，并解除中毒、残废、虚弱、流血、沉睡、迟缓、眩晕、易伤、酒醉与腐朽。投掷碎裂清除落点 _5_ 格内（受视线阻挡）的毒气、麻痹气、困惑气、恶臭气与毒液，不影响魔雾与火焰。涂抹武器可获得 _30_ 点_紊乱_附魔。

items.potions.potionofmindvision.reinforced_catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n获得 _20_ 回合_灵视_（以自身为中心 _2_ 格可穿墙纳入视野，并感知全层所有非机械单位的位置）与 _50_ 回合_明目_（视野固定为 _8_ 格，不受昼夜与酒醉影响）。涂抹武器可获得 _30_ 点_追踪_附魔。

items.potions.potionofphysique.reinforced_catalog_desc=饮用耗时 _1_ 回合，投掷不产生效果。\n\n永久提升 _5~10_ 点生命上限并回复等量生命（取值靠近中间值的概率更高），另永久提升 _0.10~0.19_ 点/回合的生命回复速度。涂抹武器可获得 _30_ 点_紊乱_附魔。
