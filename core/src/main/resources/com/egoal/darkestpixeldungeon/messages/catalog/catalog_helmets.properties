# HelmetBarbarian 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/helmets/HelmetBarbarian.kt:25-28（procGivenDamage：出手方 HP < HT/2 时 dmg.value = dmg.value * 5 / 4）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:473-523（giveDamage 在暴击判定前于 :513 调用头盔 procGivenDamage，:518 之后才结算暴击）; core/src/main/java/com/egoal/darkestpixeldungeon/items/helmets/Helmet.kt:48-50（procGivenDamage 为开放钩子）
items.helmets.helmetbarbarian.catalog_desc=装备者以自身攻击造成伤害时，若其_当前生命低于生命上限的一半_，该次伤害变为 _×5/4_（_+25%_），并在_暴击判定之前_结算。加成不受诅咒影响，卸下头盔失效。
