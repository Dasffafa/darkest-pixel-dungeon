items.helmets.helmetcrusader.catalog_desc=受到_远程_伤害时，有 _10%_ 几率完全免疫该次伤害，否则伤害减为 _×4/5_（_−20%_）。近战与其它伤害不受影响。佩戴时_视野距离_ _−1_ 格（_视野_与_视物距离_各减 _1_，限制在 _1~9_ 之间）。加成不受诅咒影响。
