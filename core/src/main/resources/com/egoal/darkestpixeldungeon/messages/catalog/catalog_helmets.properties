# MaskOfMadness 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/helmets/MaskOfMadness.kt:12-66（无法卸下; 26-30 造成伤害系数 2.1-1.5/(e^(等级/3)+0.5); 32-37 受到伤害系数 MENTAL 固定 1.5、否则 1.8-1.5/(e^(等级/3)+1)+0.05×等级; 39-49 击杀得经验、2×等级升级、上限 10）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:1509（击杀回调）、Hero.kt:766-797（佩戴者无视暴击/伏击精神压力的生命比例缩放; 778-783 单次伤害超生命上限 40% 时获得 10 回合血怒，数值为伤害/5）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/BloodRage.kt:9-26（血怒使每次攻击附加等值暗属性伤害）; core/src/main/java/com/egoal/darkestpixeldungeon/items/unclassified/DemonicSkull.kt:45-53（恶魔头骨涂抹不洁之血合成）; core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:430（权重 0，不随机掉落）
items.helmets.maskofmadness.catalog_desc=佩戴后_无法卸下_，等级初始为 _0_。造成伤害乘以 _(2.1-1.5/(e^(等级/3)+0.5))_（0 级 ×_1.1_，10 级约 ×_2.05_）；受到的_非精神_伤害乘以 _(1.8-1.5/(e^(等级/3)+1)+0.05×等级)_（0 级 ×_1.05_，10 级约 ×_2.25_），_精神_伤害固定 ×_1.5_。\n每击杀普通敌人获得 _1_ 点、首领获得 _3_ 点经验，达到 _2×当前等级_ 升 _1_ 级，上限 _10_ 级。\n单次受到超过生命上限 _40%_ 的伤害时，获得 _10_ 回合_血怒_（每次攻击附加相当于该次伤害 _1/5_ 的_暗属性_伤害）；暴击与伏击精神压力不再随伤害占生命比例放大。\n不参与随机掉落，需在_恶魔头骨_上使用_不洁之血_合成。
