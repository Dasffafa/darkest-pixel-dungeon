actors.hero.perks.brewenhancedpotion.catalog_desc=_效果_：炼金或萃取药剂有几率生成强化药剂（名称附带 _+_，售价 _×1.5_）。\n\n_机制_：\n· 基础概率步长：_0.333×(1+0.2×财富加成)_（范围 _33.3%~99.9%_，最低 _0.01_）。\n· 保底累计：每炼制一瓶累加一个步长，第 _k_ 瓶成功率为 _min(1.0, k×步长)_；成功后重置为初始步长（跨存档保留）。\n· 萃取合成分支产物连续判定 _2_ 次。\n\n_限制_：力量/隐形/浮空/根骨/麻痹药剂无法强化（但仍计入累加）；同种三种子或随机分支不判定。

