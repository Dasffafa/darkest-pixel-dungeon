actors.hero.perks.optimistic.catalog_desc=_效果_：单次精神压力增长 ≥ _1_ 时，有 _5%+10%×等级_ 几率完全抵消该次增长（_1/2_ 级为 _15% / 25%_）。\n\n_机制_：与圣者之辉、金丝头纱、苦修之路等来源按 _1-(1-a)×(1-b)..._ 乘算叠加。\n\n_限制_：单次增长 < _1_ 或压力已达上限 _100_ 时不判定；女巫无法获得。

