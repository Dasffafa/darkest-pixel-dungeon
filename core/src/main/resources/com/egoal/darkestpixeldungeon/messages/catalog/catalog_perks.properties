actors.hero.perks.efficientpotionofhealing.catalog_desc=_效果_：普通治疗药剂总回复量提升（_1/4_ 即时回复，余量以每回合当前剩余 _1/4_ 速率缓回，治疗量溢出可突破生命上限）：\n· _1_ 级：_生命上限×1.25_\n· _2_ 级：_生命上限×2_\n· _3_ 级：_生命上限×3_\n（无天赋时为 _max(生命上限, 生命上限/3+50)_）\n\n_升级_：累计饮用第 _4 / 9 / 15_ 瓶治疗药剂时自动升至 _1 / 2 / 3_ 级。\n\n_限制_：强化治疗药剂使用专属效果，不享受此公式（但计入饮用计数）。

