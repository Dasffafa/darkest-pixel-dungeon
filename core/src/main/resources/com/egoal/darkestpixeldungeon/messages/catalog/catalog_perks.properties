actors.hero.perks.evasiontenacity.catalog_desc=_效果_：持有期间护盾上限 _+3_。成功闪避攻击时，若当前护盾 < 生命上限，获得 _2×等级+1_ 护盾（_1/2/3_ 级为 _3 / 5 / 7_ 点）。\n\n_机制_：护盾自然回复基准为每 _3_ 回合 _0.1_；护盾超出上限时每 _3_ 回合衰减 _1_ 点（闪避所获护盾可暂时溢出上限）。

