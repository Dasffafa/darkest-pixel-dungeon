actors.hero.perks.preheatedzap.catalog_desc=_效果_：法杖攻击落空时，获得 _10_ 回合_预热_。预热期间下次造成伤害的法杖攻击附加_必中_与_暴击_且伤害 _×1.25_，命中后清除预热。\n\n_限制_：伤害为 _0_ 的法杖不消耗预热。

