actors.hero.perks.blur.catalog_desc=_效果_：拥有 _3_ 个各维持 _5_ 回合的闪避计数位。闪避攻击点亮剩余时间最短的位；_5_ 回合内点亮全部 _3_ 位时清空计数，获得 _20_ 回合_坚韧_（致死伤害保留 _1_ 生命并消耗该状态）。\n\n_机制_：坚韧持续期间闪避不累计计数位。\n\n_限制_：魔杖攻击落空不计入闪避。

