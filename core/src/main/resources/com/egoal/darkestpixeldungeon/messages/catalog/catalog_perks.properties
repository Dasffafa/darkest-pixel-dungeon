actors.hero.perks.greedymidas.catalog_desc=_效果_：使用点金手兑换物品或点金手·邪击杀怪物时，金币倍率按财富加成 _w_（上限 _10_）判定：\n· _0.1%+0.33%×w_ 几率变为 _10_ 倍\n· _33%+3.33%×w_ 几率变为 _4.33_ 倍（四舍五入取整）\n\n_机制_：财富加成由财富之戒决定（幸运 _+1_、枪兵 _-1_）。\n\n_限制_：地面拾取金币不生效。

