# 图鉴文本：英雄天赋的机制 / 数值
# 等级上限与图标由图鉴界面按代码实时生成，这里不重复；每条的值都注明了源码依据。
# 键名 = actors.hero.perks.<类名全小写>.catalog_desc
# 顺序与图鉴界面一致：按天赋的 Tag 归组（徒手→暴击→近战→远程→法杖→闪避→生存），无 Tag 的排在最后。
# 段落之间以 \n 分隔；数值与专有名词用下划线 _ 包裹以高亮。

# BaredAngry 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:24-38（护甲栏为空时 _+伤害值/4_、speedFactor _0.7_）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:515（giveDamage 中调用，早于第 518 行的暴击判定）:635-652（attackDelay 乘 _0.7_，下限 _0.25_）
actors.hero.perks.baredangry.catalog_desc=护甲栏为空（完全没有装备护甲）时，你造成的原始伤害提高 _25%_（向下取整），攻击间隔乘以 _0.7_；结算后的攻击间隔不会低于 _0.25_。

# BaredSwiftness 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:40-52（护甲栏为空时 speedFactor _1.2_、evasionProb _0.12_）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:593-595（移动速度乘 _1.2_）:405-425（闪避概率乘 _0.88_）
actors.hero.perks.baredswiftness.catalog_desc=护甲栏为空（完全没有装备护甲）时，移动速度乘以 _1.2_。，且在原有一次闪避判定之外再叠加一次 _12%_ 的独立闪避机会。

# BaredStealth 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:54-60（类体只有图标）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:1254-1270（护甲栏为空时潜行值 _+3_）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:732-735（沉睡怪物惊醒判定）:745,860（游荡怪物察觉判定）
actors.hero.perks.baredstealth.catalog_desc=护甲栏为空（完全没有装备护甲）时，你的潜行值增加 _3_。潜行值只参与怪物的察觉判定，不改变你的其它属性。\n游荡状态的怪物每回合发现你的概率为 _1/(距离/2+潜行值)_；\n沉睡状态的怪物被你惊动的概率为 _1/(距离/2+1+潜行值)_。

# BaredRelieve 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:248-261（护甲为空、非 CRITICAL、伤害>1、Random.Int(4)==0，回复 Random.Float(1, 1+(1-HP/HT)×4)）; actors/hero/Hero.kt:748,854-858（受伤结算后调用，recoverSanity 即降低压力）; actors/hero/Hero.kt:550-579（护甲等减伤在该判定之前结算）
actors.hero.perks.baredrelieve.catalog_desc=未装备护甲时受到_物理_或_魔法_伤害，若该伤害不是_暴击_、且经过减伤后数值仍大于 _1_，则有 _25%_ 的几率降低精神压力，降低量为 _1_ 到 _1+4×(1-剩余生命/生命上限)_ 之间的随机值。

# VampiricCrit 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:215-231（回复量 = min(HT-HP, (0.1+0.15×等级)×dmg.value)，向下取整，eff>0 才回复）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:674-682（在 attackProc 的暴击分支中调用，此时已结算防御减伤）; actors/Char.kt:583-609（attackProc 在 defendDamage 之后执行）
actors.hero.perks.vampiriccrit.catalog_desc=攻击判定为_暴击_时，按照伤害（10%+15%×等级）的比例回复生命，向下取整；不能超过生命上限；法杖暴击无效。

# PureCrit 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:188-198（暴击时加 Damage.Feature.PURE）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:517-528（暴击成立后调用）; actors/Char.kt:595（PURE 伤害跳过 defendDamage，即护甲与武器减伤）; actors/Char.kt:220-221（PURE 跳过 resistDamage）; actors/Char.kt:338-355（resistDamage 含免疫判定、魔法抗性、元素抗性）; actors/Char.kt:233-248（护盾仍先于生命承受伤害）; actors/Char.kt:254-262（坚韧仍把致命伤害压到 1 点）
actors.hero.perks.purecrit.catalog_desc=攻击判定为_暴击_时，该次伤害变为_纯粹_伤害；法杖暴击无效。

# ExtraCritProbability 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:70-86（_1%+5%×等级_，onGain 加、onLose 减）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:89,285-296（暴击率汇总）:518-522（暴击判定与倍率）
actors.hero.perks.extracritprobability.catalog_desc=暴击率增加_1%+5%×等级_。

# HardCrit 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:113-125（maxLevel 5；额外倍率 = 0.05+0.25×等级，取值后四舍五入加回 dmg.value）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:517-528（暴击成立后依次调用 PureCrit、HardCrit；常规暴击倍率 1.5，流放者为 1.75）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:111-131（法杖伤害直接进 takeDamage，不走 Hero.giveDamage）
actors.hero.perks.hardcrit.catalog_desc=攻击判定为_暴击_时，本次伤害在常规暴击倍率之外再额外乘一次 _5%+25%×等级_（四舍五入）。因此流放者从此天赋中收益略高。法杖暴击无效。

# CounterStrike 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:65-76（要求 NORMAL 类型且不含 RANGED 特性，给英雄施加 1.1 回合 SeeThrough 并记录攻击者 id）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:1479-1482（闪避回调）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:533（英雄造成伤害时结算）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/SeeThrough.kt:31-34（目标 id 相符时附加 PURE 与 ACCURATE，随后无论是否命中都 detach）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:556（ACCURATE 直接命中）、actors/Char.kt:221,595（PURE 跳过抗性减免与护甲减伤）
actors.hero.perks.counterstrike.catalog_desc=成功闪避敌人的近战物理攻击时，获得 _1.1_ 回合的_看破_。\n英雄下一次对被看破的敌人攻击时，伤害同时获得_必中_与_纯粹_特性；结算之后_看破_消失。对非攻击者的敌人无效。

# ExtraStrengthPower 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:88-99（循环 _1..等级_ 次 _Random.Int(1, exStr)_）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:147-158（近战武器触发，基础随机加伤也在同一处）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/Boomerang.kt:74-84（装备中的回力镖同样触发）; SPD-classes/src/main/java/com/watabou/utils/Random.java:45-47（Int(min,max) 上界不含）
actors.hero.perks.extrastrengthpower.catalog_desc=近战攻击时，该次伤害的额外力量增伤额外计算_天赋等级_次。

# PressureIsPower 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:172-186（p = 压力/MAX_PRESSURE，p<0.2 直接返回；乘数 = p/2+p²/2+0.8，四舍五入）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Pressure.kt:216（MAX_PRESSURE = 100）; Pressure.kt:159-175（在压力自身的伤害修正之后调用）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:530-531（只有 Hero.giveDamage 会调用它）
actors.hero.perks.pressureispower.catalog_desc=压力低于 _20_（即压力比例小于 _0.2_）时完全不生效；压力达到 _20_ 之后，武器伤害乘上 _0.8+压力/2+压力²/2_。\n对应数值约为压力 _20_ 时 _0.92_、压力约 _31_ 时 _1.0_、压力 _70_ 时 _1.395_、压力 _100_ 时 _1.8_，即压力低于约 _31_ 时反而略降低伤害。

# Maniac 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:127-138（speedFactor = 0.5+0.5×0.8^n，n=min(可见敌人数,8)，n≤1 时为 1）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:635-653（attackDelay 乘上该系数，最终下限 0.25）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:935-971（可见敌人 = 视野内、存活、敌对阵营的怪物数量）
actors.hero.perks.maniac.catalog_desc=视野内可见的存活敌对单位数量决定攻击间隔：数量不超过 _1_ 时不生效；_2_ 及以上时把攻击间隔乘上 _0.5+0.5×0.8^n_，其中 _n_ 为该数量、上限按 _8_ 计入。\n对应倍率约为 _2_ 名 _0.82_、_3_ 名 _0.76_、_4_ 名 _0.70_、_5_ 名 _0.66_、_8_ 名及以上 _0.58_，数量继续增多时倍率不再变化。\n该天赋与等级无关，近战与投掷武器的攻击间隔都受其影响。

# EnchantmentExtraDamage 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:234-244（add_value>0 时乘 1.25+0.25×等级，否则 value 乘 1.05+0.15×等级，均取整）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/Weapon.kt:75-94（仅在武器带附魔、且攻击者为英雄时调用）; actors/Damage.kt:50（add_value 为元素附加伤害）; actors/Char.kt:583-609（在防御减伤之后调用）
actors.hero.perks.enchantmentextradamage.catalog_desc=武器带有_附魔_、且攻击者为英雄时，每次附魔触发后追加一次计算：若本次命中带有元素附加伤害，把这份元素伤害乘上 _1.25+25%×等级_；若本次命中没有元素附加伤害，改为把物理伤害乘上 _1.05+15%×等级_。等级 _1_ 时两者分别为 _1.5_ 倍与 _1.2_ 倍，之后每级分别再加 _0.25_ 与 _0.15_。\n该乘数在防御减伤结算之后应用，结果向下取整；一次命中只会走其中一个分支，不会同时放大物理与元素两部分。\n只有_铭文_而没有_附魔_的武器不触发，法杖的伤害也不经过这条路径。

# ExplodeBrokenShot 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:62-68（类体只有图标）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:76-93（损坏时对命中格 + NEIGHBOURS9 造成伤害）:39（DLY 与阶数）:45-47（min/max）:106-117（损坏概率、_回力镖_ 不损坏）:176-183（溢出力量修正、狙击手 ×_1.5_）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:220-250,590-600（魔法伤害不吃护甲与护盾）
actors.hero.perks.explodebrokenshot.catalog_desc=掷出的投掷武器命中敌人后，若该武器恰好损坏，就会以命中格为中心爆炸：命中格及其周围 _8_ 格内每一个存活单位各受到一次伤害，数值为 _伤害骰最小值~最大值_ 加上溢出力量修正，再加上当前层数。\n伤害骰由阶数决定：最小值为 _1+阶数/2_（向下取整），最大值为 _4+阶数×2_；溢出力量修正为 _四舍五入((力量-10)×√(2×阶数-1))_，力量不超过 _10_ 时为 _0_，_狙击手_分支下再乘 _1.5_。\n爆炸属于魔法伤害：该段伤害本身不经过命中判定，也不吃护甲与护盾，直接扣减生命值，但仍照常结算抗性与免疫。这 _9_ 格内的任何存活单位都会受伤，包括你自己在内。\n投掷落空（命中格上没有敌人）、武器没有损坏、投掷的是_回力镖_（它不会损坏）这三种情况下不会爆炸。损坏的发生概率即该武器面板上的投掷损坏率。

# RangedShot 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:200-213（距离>1 时 value = value×(3-1.8×0.9^(距离-2))，四舍五入）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:141-159（在力量附加与神射之戒加成之后、返回伤害之前调用）; levels/Level.kt:1143-1149（distance 取横纵格差的较大者）
actors.hero.perks.rangedshot.catalog_desc=投掷武器造成伤害时，若与目标的距离大于 _1_，伤害乘上 _3-1.8×0.9^（距离-2）_：距离 _2_ 时 _1.2_、距离 _3_ 时 _1.38_、距离 _4_ 时 _1.54_、距离 _5_ 时 _1.69_，随后继续提高并趋近 _3_。\n与目标相邻（距离 _1_）时不触发。该系数在力量附加与_神射之戒_加成之后、目标防御结算之前应用，结果四舍五入取整。\n距离按横纵格差中较大者计算；法杖的伤害不走投掷武器这条路径，不受影响。

# FinishingShot 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:101-111（_0.5+武器DLY/2_ 回合的 TimeDilation）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:1516-1519（rangedWeapon 非空时触发）:864-869（时间膨胀期间 spend(time/3)）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/missiles/MissileWeapon.kt:39（DLY _0.4+0.3×阶数_）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/TimeDilation.kt:8（FlavourBuff，效果在 Hero.spend）
actors.hero.perks.finishingshot.catalog_desc=用远程武器击杀敌人时，你获得_时间膨胀_，持续 _0.5+武器攻击间隔/2_ 回合；投掷武器的攻击间隔为 _0.4+0.3×阶数_，对应时长约为 _0.85_ 至 _1.45_ 回合。该状态期间你所有行动的耗时降为原来的三分之一，相当于同样时间内可以行动 _3_ 倍次数。\n触发条件是击杀发生时你的远程武器槽非空，也就是这次击杀确实来自远程武器；近战击杀不触发。重复触发只会延长剩余时长，不会叠加层数。

# WandPerception 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:102-114（等级 1 置 levelKnown=true，等级≥2 调 identify()）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:236-246（仅在使用未耗尽鉴定次数时调用）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:150-155,377（USAGES_TO_KNOW=20，identify 同时揭示充能）
actors.hero.perks.wandperception.catalog_desc=使用法杖时获得鉴定效果：等级 _1_ 仅揭示该法杖的强化等级；等级 _2_ 直接完成全部鉴定，包含强化等级、诅咒与充能状态。只在该次使用没有让法杖自行鉴定完成时生效。未鉴定的法杖每使用一次都会消耗鉴定所需的累计次数（普通法杖为 _20_ 次，每次施放消耗 _1_ 次；每次消耗充能更多的法杖消耗更快），累计次数归零时法杖会先自行鉴定，此时不再触发本天赋。

# WandCharger 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:93-100（factor=2-0.8^等级）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:259-271（乘入 wandChargeFactor()）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:342-355（每次 recharging 累积 1/turnsToCharge×wandChargeFactor）
actors.hero.perks.wandcharger.catalog_desc=法杖每次充能累积的充能进度额外乘 _2-0.8^等级_：等级 _1_ 为 _1.2_、_2_ 为 _1.36_、_3_ 为 _1.488_。该系数作用于所有法杖的每次充能，因此提高全部法杖的充能速度。

# WandArcane 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:84-91（factor=1+0.2×等级）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:252-257（乘入 arcaneFactor()，用于法杖伤害）
actors.hero.perks.wandarcane.catalog_desc=英雄施放法杖时使用的秘法系数额外乘 _1+0.2×等级_：等级 _1_ 为 _1.2_、_2_ 为 _1.4_、_3_ 为 _1.6_。该系数参与法杖伤害的计算，用于放大法杖造成的伤害。

# QuickZap 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:70-75（空实现）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:257-258,381（zapTime=0.45 而非 TIME_TO_ZAP=1f）
actors.hero.perks.quickzap.catalog_desc=施放法杖后推进的时间由 _1_ 回合缩短为 _0.45_ 回合。只改变施法占用的时间，不改变充能消耗与伤害。

# StealthCaster 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:77-82（空实现）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:438-439（无此天赋时 Invisibility.dispel()）
actors.hero.perks.stealthcaster.catalog_desc=使用法杖不再解除_隐身_状态。没有此天赋时，每次施放法杖都会解除_隐身_；拥有后跳过该解除。

# ArcaneCrit 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:15-33（prob=英雄暴击率属性+0.09×(等级-1)，触发时 scale(1.75) 并加 CRITICAL）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:150-173（procGivenDamage 对伤害骰非 0 的法杖调用；此前可能已由奥术之戒标记暴击）
actors.hero.perks.arcanecrit.catalog_desc=法杖造成的伤害会像物理攻击一样判定暴击。伤害尚未判定为暴击时，以 _英雄自身的暴击率属性加上 0.09×(等级-1)_ 为概率判定为暴击：判定成功则该次伤害整体乘 _1.75_ 并标记为暴击。等级 _1_ 时额外概率为 _0_，只用英雄自身的暴击率属性；等级 _2_ 起每级再提高 _9%_。该概率只取英雄的基础暴击率属性，不包含_暴击符文_、压力状态、骑士核心与_暴击之戒_提供的加成。已经判定为暴击的伤害不会再次判定；伤害为 _0_ 的法杖不参与此判定。

# WandPiercing 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:116-128（ratio=0.05+0.04×等级，char.magicalResistance 直接减少）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:176-183（仅 isMissile 法杖的 onHit 调用）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:87,133,345-346（magicalResistance 按比例削减 MAGICAL 类型伤害）
actors.hero.perks.wandpiercing.catalog_desc=命中敌人时使其_魔法抗性_减少 _0.05+0.04×等级_：等级 _1_ 为 _0.09_、_2_ 为 _0.13_、_3_ 为 _0.17_。_魔法抗性_按该比例削减目标受到的_魔法_类型伤害，因此每次命中都会让之后对该目标的魔法伤害更高。该效果可无限叠加、没有持续时间，也不会自行恢复；数值降到 _0_ 以下后，超出部分会反向放大魔法伤害。\n只对以飞弹命中目标的法杖生效：_冰霜法杖_、_剧毒法杖_、_魔弹法杖_、_昏睡权杖_、_腐化法杖_、_冲击波法杖_、_阿贝尔神杖_；_解离法杖_、_焰浪法杖_、_雷霆法杖_、_棱光法杖_、_再生法杖_不生效。

# CloseZap 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:35-51（距离≤4 用 1.3-0.075×距离，否则 max(1.4-0.1×距离, 0.1)；相邻时另有 10% 概率 ×1.1 并加 CRITICAL）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:173（procGivenDamage 调用）
actors.hero.perks.closezap.catalog_desc=法杖伤害按施法者与目标之间的距离缩放，距离以两者所在格的格数计。距离不超过 _4_ 时，伤害乘 _1.3-0.075×距离_：距离 _1_ 为 _1.225_、_2_ 为 _1.15_、_3_ 为 _1.075_、_4_ 为 _1.0_。距离不少于 _5_ 时，伤害乘 _max(1.4-0.1×距离, 0.1)_：距离 _5_ 为 _0.9_、_6_ 为 _0.8_，之后每远一格再降 _0.1_，距离 _13_ 及以上固定为 _0.1_。与目标相邻时，另有 _10%_ 概率让该次伤害再乘 _1.1_ 并判定为暴击。伤害为 _0_ 的法杖不参与此判定。

# PreheatedZap 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:63-68（空实现，由 DamageWand 调用）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:186-191（onMissed 时 Buff.prolong 10f）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Preheated.kt:19-24（加 CRITICAL|ACCURATE、scale(1.25) 后 detach）
actors.hero.perks.preheatedzap.catalog_desc=法杖攻击未命中时，获得 _10_ 回合的_预热_状态。处于_预热_时，下一次造成伤害的法杖伤害判定会附加必中与暴击，并整体乘 _1.25_，随后_预热_立即结束。由于附加了必中，该次攻击不会再落空。伤害为 _0_ 的法杖不会消耗_预热_。

# ManaDrine 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/magic.kt:53-61（Buff.affect(hero, Recharging, 1f)）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/DamageWand.kt:193-196（仅在 onKilled 时调用）; core/src/main/java/com/egoal/darkestpixeldungeon/items/wands/Wand.kt:342-355,374（每根法杖的 Charger 每次充能按 CHARGE_BUFF_BONUS=0.25×remainder 加充能）
actors.hero.perks.manadrine.catalog_desc=用法杖击杀敌人时，获得 _1_ 回合的_回充_状态。_回充_期间每根法杖每次充能都额外获得 _0.25_ 点充能，因此同时作用于身上所有法杖。只有击杀由该法杖的伤害造成时触发；伤害为 _0_ 的法杖（如_腐化法杖_、_昏睡权杖_、_再生法杖_）不造成击杀伤害，不会触发。

# LowHealthDexterous 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:175-186（HP > HT×0.3 时返回 0，否则 0.2×1.5^等级）; actors/hero/Hero.kt:402-421（该值以 e 乘入『未被闪避』概率）
actors.hero.perks.lowhealthdexterous.catalog_desc=生命值不高于生命上限的 _30%_ 时，闪避判定中『未能闪避』的那部分概率乘上 _1-0.2×1.5^等级_，等级 _1_、_2_、_3_ 依次为 _0.7_、_0.55_、_0.325_。\n生命值高于 _30%_ 上限时不生效。该系数与_闪避之戒_、其它闪避天赋的同类系数相乘。

# LowWeightDexterous 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:450-457（estr 为需求减力量，estr>0 时闪避骰乘 1/1.5^estr，否则 dex 加上 Random.Float(-estr)）; actors/hero/perks/defend.kt:212-217（类体只有标签）; items/armor/Armor.kt:300-311（STRReq 随强化等级降低）
actors.hero.perks.lowweightdexterous.catalog_desc=闪避骰基准为 _0_ 到防御技巧之间的随机值，该天赋在此基础上追加一部分。\n装备护甲且力量超过护甲力量需求时，闪避骰额外加上 _0_ 到 _超出量_ 之间的随机值，超出量为 _力量-护甲力量需求_；未装备护甲时以需求 _10_ 计算。\n护甲的力量需求会随自身强化等级下降。\n力量不高于需求时得不到该加成，此时闪避骰反而要乘上 _1/1.5^力量缺口_，该惩罚与是否拥有此天赋无关。

# ExtraEvasion 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:128-137（prob=0.075*level）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:402-425（evasionProbability 中按 1-prob 乘算）、actors/hero/Hero.kt:427-431（dexRoll 先掷该概率，成立则返回 1000）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:556（ACCURATE 直接命中，不进行该判定）
actors.hero.perks.extraevasion.catalog_desc=提供 _7.5%×等级_ 的闪避概率。\n每次受到攻击时先按该概率掷一次判定：判定成立则本次攻击直接落空，不再进行攻击技巧与防御技巧的比较。\n该概率与其它闪避来源按 _1-(1-a)×(1-b)_ 的乘法方式叠加，而不是直接相加；带有_精准_特性的攻击直接命中，不经过该判定。

# ExtraDexterousGrowth 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:115-126（extraDex=level*0.5；无 onLose 回退）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroClass.kt:333-348（升级时 defSkill += 0.75 后调用 upgradeHero）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:366-372（dexRoll 取 0~defSkill 随机数）、actors/Char.kt:545-567（命中判定为 accRoll 与 dexRoll 比较，魔法与精神类型进攻方数值乘以 2）
actors.hero.perks.extradexterousgrowth.catalog_desc=英雄每次升级时，防御技巧额外增加 _0.5×等级_（通常升级固定增加 _0.75_）。\n只对持有该天赋之后发生的升级结算：取得它的那一次升级先结算属性、之后才获得天赋，因此该次也不补算；该天赋没有失去时的回退处理，已经获得的成长会保留。\n防御技巧参与受击判定：防守方掷出 _0_ 到防御技巧之间的随机数，与进攻方的攻击技巧随机数比较，进攻方的随机值不小于防守方时命中，所以该成长提高防守方的数值区间。

# EvasionTenacity 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:78-96（procEvasionDamage 在 SHLD<HT 时 +level*2+1；onGain/onLose 调整 MSHLD ±3）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Protected.kt:13-40（上限为 MSHLD+护甲 SHLD+职业加成，低于上限缓慢回复，超出上限每 3 回合减 1）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:94（MSHLD）、actors/hero/Hero.kt:361-364（进入楼层时获得 Protected）
actors.hero.perks.evasiontenacity.catalog_desc=每次成功闪避攻击（不限伤害类型）时，只要当前护盾低于生命上限，护盾就增加 _2×等级+1_ 点：等级 _1_ 为 _3_ 点、等级 _2_ 为 _5_ 点、等级 _3_ 为 _7_ 点；护盾已经不低于生命上限时，该次闪避不增加护盾。\n持有该天赋期间护盾上限 _+3_ 点，失去时 _-3_ 点；护盾上限由该固定值、护甲与职业加成共同组成。护盾低于上限时按固定速率缓慢自然回复（基础为每 _3_ 回合 _0.1_ 点，其它来源可加快），超过上限时每 _3_ 回合被削减 _1_ 点，所以闪避得来的护盾可以暂时超出上限，之后逐步回落。

# Blur 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:15-63（onGain/onLose 挂载与移除内部 Counter；Counter.onEvade 于 34-43 行，3 个计数位各记录 5 回合、全部点亮后清空并 prolong Tenacity 20 回合）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Actor.kt:90（TICK 为 1 回合）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:254-262（坚韧期间生命降到 0 以下时改为 1 并立即消失）
actors.hero.perks.blur.catalog_desc=拥有该天赋期间，英雄身上常驻一个不显示的闪避计数（失去天赋时一并移除）。\n每次成功闪避攻击都会点亮一个计数位：计数位共 _3_ 个，点亮后计时 _5_ 回合，已点亮的位每回合减少 _1_ 回合，新的一次闪避总是点亮当前剩余时间最短的那一位（空位优先）。\n当 _3_ 个位同时处于点亮状态（即 _5_ 回合内连续闪避 _3_ 次）时，计数位全部清空，并获得 _20_ 回合的_坚韧_：_坚韧_期间若某次_物理_或_魔法_伤害使生命降到 _0_ 或更低，生命改为保留在 _1_ 点，随后_坚韧_立即消失；_坚韧_存在期间再次闪避不会点亮计数位。\n触发不区分攻击类型，近战、远程与魔法攻击的落空都会计数；魔杖使用独立的命中判定，其落空不经过这一闪避回调。

# StrongConstitution 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:263-275（extraHT 为 2×等级，仅由 upgradeHero 调用，无 onGain）; actors/hero/HeroClass.kt:326-359（升级本身生命上限与当前生命各 _+5_，随后结算该天赋；信念护体与不朽血族挑战会把生命成长整体撤销）; actors/hero/Hero.kt:1171-1177（升级时调用，随后才发放新天赋）
actors.hero.perks.strongconstitution.catalog_desc=英雄每次升级时，生命上限与当前生命各额外增加 _2×等级_，叠加在升级本身的生命成长（上限与当前生命各 _+5_）之上。\n获得该天赋的当次不会立刻增加生命上限，只有此后发生的升级才会结算这笔加成。\n在_信念护体_或_不朽血族_挑战下，升级带来的生命成长会被整体撤销，该天赋的加成也随之不生效。

# Optimistic 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:219-228（resistChance 为 0.05+0.1×等级，女巫职业不可获得）; actors/buffs/Pressure.kt:76-99（r≥1 时按合并几率完全抵消，GameMath.ProbabilityPlus 为 1-各项未触发几率之积）; actors/buffs/Pressure.kt:214-216（可达上限 100）; actors/hero/Hero.kt:838（精神伤害转换为压力增长）
actors.hero.perks.optimistic.catalog_desc=单次精神压力增长不小于 _1_ 点时，按 _0.05+0.1×等级_ 的几率完全抵消这次增长，等级 _1_、_2_ 分别为 _15%_、_25%_，触发时只显示『精神抵抗』提示且压力不变。\n该几率与_圣者之辉_充能、未诅咒的_金丝头纱_、_苦修之路_的同类几率按 _1-各项未触发几率之积_ 合并，不是直接相加。\n单次增长不足 _1_ 点，或压力已经达到 _100_ 点上限（可增长量为 _0_）时都不作判定。\n_女巫_职业无法获得该天赋。

# GreedyMidas 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:186-207（bestProb=_0.001+0.0033×wealth_，highProb=_0.33+0.0333×wealth_，倍率 _10_/_4.33_/_1_，round 取整）; items/unclassified/GoldenClaw.kt:69-79,105-119,175-190（点金手兑换物品与点金手·邪击杀怪物入账时调用）; actors/hero/Hero.kt:301-308（wealthBonus 的构成与上限 _10_）
actors.hero.perks.greedymidas.catalog_desc=只在使用_点金手_把物品兑换成金币、或用_点金手·邪_击杀怪物所得的赏金上结算；从地面拾取的金币不经过该天赋。\n\n每次入账按财富加成 w 掷一次随机数：小于 _0.1%+0.33%×w_ 时金币变为 _10_ 倍；否则小于 _0.1%+0.33%×w_ 与 _33%+3.33%×w_ 之和时变为 _4.33_ 倍；其余情况为 _1_ 倍。倍率乘算后四舍五入取整，两个概率都按不低于 _0_ 取值。\n\n财富加成由_财富之戒_的加成决定：处于_幸运_状态时 _+1_，_枪兵_副职业 _-1_，上限 _10_。

# LowHealthRegeneration 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:188-210（触发线 0.2+0.05×等级，speed 为等级，limit 为 0.4+0.1×等级）; actors/buffs/FastRecovery.kt:13-24（每回合加 speed 点生命，生命达到 round(HT×limit) 时结束）; actors/hero/Hero.kt:730,747（受伤结算后调用，精神伤害走另一分支提前返回）; actors/hero/perks/Perk.kt:16（等级从 _1_ 起）
actors.hero.perks.lowhealthregeneration.catalog_desc=受到_物理_或_魔法_伤害后，若剩余生命不高于生命上限的 _0.2+0.05×等级_，获得_快速恢复_状态：每回合回复 _等级_ 点生命，直到生命达到生命上限的 _0.4+0.1×等级_（四舍五入）时结束。\n等级 _1~5_ 对应触发线 _25%~45%_、结束线 _50%~90%_、每回合回血 _1~5_ 点。\n该状态没有回合数限制，只有生命回到结束线才消失；_精神_伤害不经过这段结算，不会触发。

# BrewEnhancedPotion 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:38-60（基准值 0.333×(1+0.2×财富加成) 且不低于 0.01；失败即累加一个基准值，成功重置回一个基准值）; actors/hero/Hero.kt:301-308（财富加成来自财富之戒，上限 10）; levels/features/AlchemyPot.kt:101-111（只有从不同种子中随机取一的分支会调用判定）; items/unclassified/ExtractionFlask.kt:169-178（精炼产物再判定一次）; items/potions/Potion.kt:71-76,252-256,287-289（canBeReinforced 默认 false，强化后名称带 +、售价 ×1.5）
actors.hero.perks.brewenhancedpotion.catalog_desc=在炼金釜投入三颗种子、或用萃取瓶精炼药剂时，产物有机会变成_强化_药剂。\n每次判定的基准值为 _0.333×(1+0.2×财富加成)_，最低 _0.01_；财富加成由_财富之戒_等来源提供，范围 _0_~_10_，因此基准值落在 _33.3%_ 与 _99.9%_ 之间。\n概率按炼制的瓶数累加：每炼制一瓶药剂，累积值就增加一个基准值；一瓶可强化的药剂被炼制时按当时的累积值判定，也就是自上次成功以来第 _k_ 瓶的几率为 _k×基准值_；成功即强化并把累积值重置回一个基准值，累积值达到 _1_ 时必定成功，累积值随存档保存。\n_力量药剂_、_隐形药剂_、_浮空药剂_、_根骨药剂_、_麻痹药剂_无法被强化，它们不参与判定，但仍会让累积值增加。\n炼金釜只在_从不同种子的组合中随机取一_这条分支上判定，三颗同种种子、或结果被换成随机药剂时都不判定；萃取瓶精炼对每瓶产物判定，其中来自合成分支的产物会连续判定两次。\n强化后的药剂名称带 _+_，按其强化形态生效，售价为基准价的 _1.5_ 倍。

# FastRegeneration 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:150-165（Additional，extraReg=0.33*level，onGain/onLose 增减 hero.regeneration）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:90（基础 regeneration 为 0.1）、actors/hero/Hero.kt:197-210（极度饥饿或狂暴时速率 0，饥饿时减半）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Regeneration.kt:29-51（每回合累计，整数部分转化为 HP，生命满时清零）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/buffs/Hunger.kt:74-77,220-224（饥饿伤害按 fedRegeneration 换算，每 10 回合为 0.25×10×速率）
actors.hero.perks.fastregeneration.catalog_desc=生命回复速率增加 _0.33×等级_；英雄的基础回复速率为 _0.1_。\n回复速率每回合累计一次，累计满 _1_ 的整数部分转化为生命回复，仅在生命未满时累计，生命已满时累计量清零。\n处于_饥饿_状态时该速率减半，处于_极度饥饿_状态时该速率变为 _0_，此时不再回血。\n饥饿掉血同样按该速率换算：每回合失去 _0.25×回复速率_ 点生命，因此该天赋每级额外带来 _0.0825_ 点/回合的饥饿伤害。

# EfficientPotionOfHealing 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:101-107（构造参数 3）; items/potions/PotionOfHealing.kt:99-109（总量 生命上限×5/4、×2、×3，无天赋时为 max(上限, 上限/3+50)）; items/potions/PotionOfHealing.kt:80-97（总量的 1/4 立刻回复，其余进入回复状态）; actors/buffs/Mending.kt:42-54（每回合放出剩余量的 1/4）; items/potions/PotionOfHealing.kt:46-68,119-130（强化形态另走一套效果；第 4、9、15 瓶提升）; actors/Char.kt:385-395（生命回满后继续累加）
actors.hero.perks.efficientpotionofhealing.catalog_desc=每饮用一瓶_治疗药剂_计数一次，第 _4_、_9_、_15_ 瓶分别把该天赋提升到 _1_、_2_、_3_ 级，饮用瓶数随存档保存。\n天赋提高的是每瓶药剂的总回复量：_1_ 级为 _生命上限×5/4_，_2_ 级为 _生命上限×2_，_3_ 级为 _生命上限×3_；没有该天赋时为 _生命上限_ 与 _生命上限/3+50_ 中较大的那个。\n总量中 _1/4_ 立刻回复，其余进入_回复_状态，此后每回合放出剩余量的 _1/4_。\n已强化的_治疗药剂_走另一套效果，不使用该回复量公式，但同样计入饮用瓶数。\n生命回满后剩余的治疗量仍会继续累加，可以超过生命上限。

# PressureRelieve 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:230-246（仅 NORMAL 类型，p<0.2 返回，r 为 1-(p-0.15+0.1×等级)^2×0.8 后四舍五入）; actors/hero/Hero.kt:698-707（resistDamage 中调用，先于通用抗性）; actors/buffs/Pressure.kt:216（MAX_PRESSURE 为 100）; actors/hero/perks/Perk.kt:16（等级从 _1_ 起）
actors.hero.perks.pressurerelieve.catalog_desc=只对_物理_伤害生效。受击时取压力比例 _p_，即当前压力除以上限 _100_：_p_ 低于 _0.2_ 时完全不生效；否则该次伤害乘上 _1-(p-0.15+0.1×等级)^2×0.8_ 后四舍五入。\n等级 _1_ 的减伤从 _p_ 为 _0.2_ 时的约 _2%_ 升到 _p_ 为 _1_ 时的约 _72%_；等级 _2_ 在这两点约为 _5%_ 与 _88%_。\n_魔法_与_精神_伤害不享受该减免。

# ExtraRuneRegularly 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:117-141（TimingPerk(GainRune)，计时长度为 Statistics.ClockTime.TimePerDay()/2）; actors/hero/perks/base.kt:6-31（onGain 挂上计时 Buff，act 先 trigger() 再 spend(time)，upgrade 为空实现）; Statistics.kt:143-146,183-187（一回合推进 _0.85_ 分钟，TimePerDay 为 _24×60÷0.85_）; actors/Resident.kt:12-23（计时按回合推进）; items/Generator.kt:53-57,445-453（RUNE 权重：恢复/治愈/明亮/极速/财富 _1_，暴击 _0.5_，鲜血 _0_；生成后该神符权重减半）; items/unclassified/DewVial.kt:32,159-161
actors.hero.perks.extraruneregularly.catalog_desc=获得后立即挂上一个计时状态，并在下一次行动时立刻生成第一枚神符；此后每经过约 _847_ 个回合（游戏内半天，_24×60÷0.85÷2_）再生成一枚。\n\n神符按权重抽取：恢复、治愈、明亮、极速、财富各 _1_，暴击 _0.5_，鲜血 _0_（不会出现）；同一种神符被生成一次后权重减半。\n\n背包里有_露珠瓶_且瓶中还没有神符时，新神符直接收入瓶中；没有露珠瓶或瓶中已存有一枚神符时，神符掉落在你当前所在的格子上，不会消失。\n\n它没有随等级变化的数值：升级既不缩短触发间隔，也不会一次给出多枚。

# ExtraMagicalResistance 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:139-148（ratio=0.05+level*0.15）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:145-158（以 ProbabilityPlus 与护甲 MRES、敌法符文等叠加）；SPD-classes/src/main/java/com/watabou/utils/GameMath.kt:56（ProbabilityPlus 即 1-(1-a)×(1-b)）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/Char.kt:338-355（仅 MAGICAL 类型按该比例四舍五入扣减）
actors.hero.perks.extramagicalresistance.catalog_desc=提供 _5%+15%×等级_ 的魔法抗性：等级 _1_ 为 _20%_、等级 _2_ 为 _35%_、等级 _3_ 为 _50%_。\n该数值与其它魔法抗性来源（护甲的抗性词条等）按 _1-(1-a)×(1-b)_ 的乘法方式叠加。\n结算时只作用于_魔法_类型的伤害：伤害值按该比例四舍五入后扣减；_物理_与_精神_类型的伤害不受影响。

# LuckFromAuthor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/Perk.kt:89-99（Perk(1000)；onGain 给予 Relieve 与 Lucky 各 100）; Perk.kt:150-151（正面池权重 0.01）; Perk.kt:118-124（可选天赋不足时用它补满名额）; windows/WndGainNewPerk.kt:28-34（重掷时排除）; actors/buffs/Relieve.kt:14-34（prolong 取较大值，每回合回复 0.3 理智）; actors/buffs/Lucky.kt:6-16（FlavourBuff）; actors/hero/Hero.kt:301-308（_财富加成_ +1，上限 10）:313-318（_幸运一击_ 按财富加成掷次数）
actors.hero.perks.perk$companion$luckfromauthor.catalog_desc=获得此天赋时立刻获得 _100_ 回合的_缓解_与 _100_ 回合的_幸运_。\n_缓解_每回合恢复 _0.3_ 点理智，整段持续期间共 _30_ 点；重复获得时取剩余时间与 _100_ 回合中的较大值，不会叠加。\n_幸运_使英雄的_财富加成_ _+1_（_财富加成_上限 _10_）；_财富加成_决定_幸运一击_的判定次数，也参与多类财富系天赋的计算。\n升级不会再次触发获得效果，效果与等级无关，持续时间固定。\n它是随机正面天赋池中的兜底项：权重为 _0.01_；可选天赋不足时，剩余名额由它补齐；天赋重掷时它会被排除，不会出现在重掷结果中。

# Drunkard 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:91-95（流放者无法获得）; items/food/Wine.kt:63-79（回复值再加其 1/4，且跳过 Drunk.Affect）; actors/buffs/Drunk.kt:62-76（酒醉与眩晕均持续 30 回合，随抗性系数缩短）; actors/buffs/Drunk.kt:27-31,53-60（酒醉时造成伤害 ×1.2、受到物理伤害减 1/5+0~4、精神伤害减半）; actors/hero/Hero.kt:389 与 actors/Char.kt:144（酒醉时命中 ×0.75、视野距离 -1）; actors/Char.kt:476-484（眩晕时移动方向随机）; items/unclassified/Gourd.kt:97,106-112（葫芦饮用不检查该天赋）; actors/hero/HeroClass.kt:42（战士初始携带）
actors.hero.perks.drunkard.catalog_desc=饮用_红树根_、_棕色麦芽酒_、_粗制的米酒_等酒水时，回复的压力在原数值上再加该数值的 _1/4_（即乘以 _1.25_），并且不获得_酒醉_与_眩晕_。\n无此天赋时，饮用这些酒水在回复压力之外还会获得 _30_ 回合（随抗性系数缩短）的_酒醉_与_眩晕_：_酒醉_使造成伤害乘以 _1.2_、受到的物理伤害减少 _1/5+0~4_、精神伤害减半，同时命中乘以 _0.75_、视野距离减 _1_；_眩晕_使移动方向随机。\n_蜜酒_本身不造成_酒醉_，该天赋对它的作用只有回复加成。\n_葫芦_的饮用不走酒水的这条分支，其中的_酒醉_照常施加。\n_流放者_无法获得该天赋，_战士_开局携带。

# GoodAppetite 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:160-184（按职业分支，canBeGain 限定战士/法师/女巫）; items/food/Food.kt:23-24,70-75（进食后调用 onFoodEaten，默认能量取 Hunger.HUNGRY）; actors/buffs/Hunger.kt:167-192,226-227（satisfy 按能量降低饱食度，佩戴被诅咒的丰饶之角时按 _0.67_ 折算）; items/artifacts/HornOfPlenty.kt:83-88（一次消耗 _3_ 点以上充能时以默认 Food() 触发）; items/wands/Wand.kt:342-355,374（充能状态每回合为每根法杖加 _0.25_ 点）; actors/buffs/Recharging.kt:43-45; items/scrolls/ScrollOfRecharging.kt:58-60（charge 仅播放粒子）; actors/hero/HeroClass.kt:42,88,197（三者初始天赋）
actors.hero.perks.goodappetite.catalog_desc=只有_战士_、_法师_、_女巫_能够获得该天赋，它是这三者的初始天赋之一；其它职业即使随机获得也不会触发任何效果。\n\n每次进食都会按职业额外结算一次：\n战士在生命未满时回复 _5_ 点生命，回复量不超过生命上限，满血时不回复。\n法师获得 _4_ 回合的_充能_状态，每回合为背包里的每根法杖积攒 _0.25_ 点充能，合计约 _1_ 点，并播放一次纯视觉的充能粒子。\n女巫额外恢复相当于该食物能量 _25%_ 的饱食度，默认能量 _350_ 的食物对应 _87.5_ 点；佩戴被诅咒的_丰饶之角_时这部分同样按 _67%_ 折算。\n\n_丰饶之角_一次消耗 _3_ 点以上充能进食也算一次进食，该次传入的食物按默认能量 _350_ 计算。

# Keen 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:213-217（baseAwareness 为 _0.1+0.1×等级_）; actors/hero/Hero.kt:1221-1229（无该天赋时感知值为 _0.1_，先见加成上限 _1_）,1382-1451（被动察觉的判定与对暗门的额外重掷）; levels/Terrain.java:53-54,87（_秘密_标记即暗门与隐藏陷阱）; actors/hero/HeroClass.kt:135（盗贼初始天赋）
actors.hero.perks.keen.catalog_desc=持有它时英雄的_感知值_从 _0.1_ 提升为 _0.1+0.1×等级_：等级 _1_ 为 _0.2_，等级 _2_ 为 _0.3_，等级 _3_ 为 _0.4_。\n\n感知值用于_被动察觉_：每走完一步，都会以你为中心、在 _1_ 格范围内（持有_高效搜索_时扩大到 _2_ 格）对所有可见的暗门与隐藏陷阱各掷一次随机数，小于感知值就立刻探明该格。\n\n若该格是暗门，还会按_财富加成÷2_的次数（向下取整）再掷一轮，每次仍以感知值为概率。\n\n该数值与_先见护符_的加成相加：护符未满级时 _+0.1_，完全升级后 _+0.25_，总和上限 _1_。\n\n点击搜索按钮的主动搜索会直接探明范围内所有暗门与隐藏陷阱，不经过感知值判定。

# NightVision 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:245-251（Perk(2)；canBeGain 为 _星月骑士_ 或尚未持有）; actors/hero/Hero.kt:160-170（时钟非白天时视距加等级，最终限制 1~9）; actors/Char.kt:135-141（基础视距：白天 6、夜晚 3、午夜 2）; actors/hero/HeroClass.kt:169（_女猎手_ 初始天赋）; actors/hero/HeroSubClass.kt:126-129（_星月骑士_ 分支再获得一次）
actors.hero.perks.nightvision.catalog_desc=英雄的视距随昼夜变化：白天 _6_ 格、夜晚 _3_ 格、午夜 _2_ 格。\n在_夜晚_与_午夜_，此天赋使视距提高 _等级_ 点：等级 _1_ 时 _+1_ 格，等级 _2_ 时 _+2_ 格。该加成与头盔等其它视距修正相加后，最终限制在 _1_ 至 _9_ 格之间。\n时钟处于_白天_时完全不生效。\n_女猎手_开局即拥有此天赋；只有_星月骑士_能把它继续提升，其它职业持有后无法再升级。

# Telepath 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:281-289（range 为 2×等级；canBeGain 为 _女猎手_ 或尚未持有）; levels/Level.kt:979-1002（无_灵视_时按 range 感知，感知目标所在 9 格写入可见数组）; levels/Level.kt:1143-1149（距离取横纵坐标差的较大值）; Dungeon.kt:751（感知目标周围半径 2 的迷雾刷新）; actors/hero/Hero.kt:934-964（计入视野的敌人打断休息）
actors.hero.perks.telepath.catalog_desc=感知范围随等级提高：与英雄相距不超过 _2×等级_ 格（等级 _1_ 为 _2_ 格，等级 _2_ 为 _4_ 格；按横纵坐标差的较大值计算，可以穿墙）的怪物会被感知。\n被感知的怪物所在格及其周围 _8_ 格会被记为视野内，因此它隔着障碍物也会像在视野中一样显现、计入视野中的敌人并打断休息；它所在位置周围半径 _2_ 格的迷雾也会被刷新。\n每次重新计算视野时判定一次，走出范围或死亡后立即不再被感知。\n英雄带有_灵视_（_灵视药剂_等来源）时由该状态接管感知，此天赋不生效。\n_女猎手_能把它继续提升，其它职业持有后无法再升级。

# Fearless 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/defend.kt:167-173（canBeGain 排除 WARRIOR）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:803-807（HP<HT/4、来源为 Mob、伤害大于 0 时额外 value+=Random.Float(1,5) 并触发低血量台词，持有该天赋则跳过）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:768-776,784-798（超过生命上限 40% 的重伤、暴击与偷袭的精神伤害不受该天赋影响）；core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroSubClass.kt:94-100（狂战士转职直接 add_perk Fearless）
actors.hero.perks.fearless.catalog_desc=受到伤害时，若这次伤害结算后仍大于 _0_、当前生命低于生命上限的 _1/4_、且伤害来源是怪物，则除伤害本身外还会附加 _1~5_ 点精神伤害（转化为压力上升）与相应的低血量台词；持有该天赋时这一项额外精神伤害不再产生。\n它只移除这一项：一次造成超过生命上限 _40%_ 的重伤、暴击与偷袭所换算的额外精神伤害都照常结算。\n_战士_的随机天赋候选中不会出现它，_狂战士_副职业转职时则会被直接授予。

# Assassin 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:20-22（类体只有图标，效果写在调用处）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/mobs/Mob.kt:527-536（偷袭判定、_+伤害值/4_、以 Wound 取代 Surprise 特效）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:463-471（canSurpriseAttack）; core/src/main/java/com/egoal/darkestpixeldungeon/items/weapon/melee/DriedLeg.kt:20、Lance.kt:22、Flail.kt:34、Scythe.kt:69（禁止偷袭的武器）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/HeroSubClass.kt:125（刺客分支固定给予）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/Perk.kt:160（随机池权重 _0_）
actors.hero.perks.assassin.catalog_desc=你偷袭一个尚未察觉你的怪物时，该次伤害提高 _25%_（加上 _伤害值/4_，整数除法向下取整）。\n偷袭的成立需要四个条件：目标没有察觉到你、攻击者是你本人、你的装备武器满足力量需求、该武器允许偷袭。_骑士枪_、_干枯羊腿_、_链枷_，以及处于_上段_架势的_薙刀镰_会禁止偷袭；改用远程武器攻击时不再检查近战武器的这一项。目标已经察觉你、或武器的力量不足时不生效。\n该加伤在目标的护甲减免之后结算，因此计算的基数是被护甲削过之后的伤害值。触发时目标身上的「惊讶」标记会换成「伤口」标记，两者都只是画面表现。\n它由_刺客_分支在分支选择时固定给予，不会作为随机天赋出现。

# IntendedTransportation 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:209-211（只有图标，无数值实现）; items/scrolls/ScrollOfTeleportation.kt:48-62,94-125（改为点选目标格；取消点选退回随机传送；实心或有单位的格无效）; items/scrolls/Scroll.kt:80-98（阅读即消耗卷轴）; actors/mobs/npcs/Yvette.kt:145-207,223-232（给过食物并交出传送卷轴后由伊薇特授予）; actors/hero/perks/Perk.kt:150-213（该天赋在随机池中权重 _0_）
actors.hero.perks.intendedtransportation.catalog_desc=持有它时阅读_传送卷轴_不再直接随机落点，而是先进入点选目标格的状态：只有你已经走过或已经探明的格子可以被选中，且该格不能是实心地形、也不能有其它单位站在上面；点到无效格不会发生传送，也不会消耗回合。\n\n取消点选时不传送，仍按普通传送卷轴随机落点。首领存活时传送卷轴整体失效，该天赋不改变这一点。\n\n无论最终是否传出，卷轴在开始阅读时就已被消耗。\n\n它不会作为随机天赋出现，只能由 NPC_伊薇特_授予：先给过她一件食物，再把_传送卷轴_交给她，之后选择婉言拒绝她的长弓、或直接关闭她后续的赠礼窗口即可获得；选择向她告别则得到_魔法长弓_。\n\n它没有随等级变化的数值。

# Discount 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:81-89（系数 1-0.25×等级，等级为负时算作负面天赋）; actors/mobs/npcs/Merchant.kt:126-127,202-207,250（购买价以物品卖出价为基数乘以系数）; items/Item.kt:383（卖出价 基础价×(深度/3×3+4)）; actors/mobs/npcs/ScrollSeller.kt:78-82（驱散费用 40×(深度+4)）; actors/mobs/npcs/UndeadShopkeeper.kt:53-54（情报费用 100+10×深度）; actors/hero/HeroClass.kt:197,236（女巫初始 1 级、流放者初始 -1 级）; items/artifacts/MasterThievesArmband.kt:98-102（偷窃成功率按该价格计算）
actors.hero.perks.discount.catalog_desc=价格系数为 _1-0.25×等级_：_1_ 级把价格压到 _75%_，_2_ 级压到 _50%_。\n受影响的只有需要你付出金币的价格：_商人_处的购买价（以物品卖出价为基数）、_奥术专家_处的驱散费用（_40×(层数+4)_）与_不死商人_处的情报费用（_100+10×层数_），三处都乘以该系数。\n把物品卖给商人的价格、以及其它不使用该系数的花费不变。\n等级为 _-1_ 时系数是 _1.25_，价格提高 _25%_；_流放者_以 _-1_ 级开局，_女巫_开局为 _1_ 级。\n_神偷袖章_的偷窃成功率也以折后价格计算。

# ExtraPerkChoice 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:113-115; windows/WndGainNewPerk.kt:47-56（候选数 5 与 3）; windows/WndGainNewPerk.kt:12-39（重掷数量为按钮数的一半，重掷后的窗口不再附带重掷按钮）; windows/WndSelectPerk.kt:30（重掷按钮也计入按钮数）
actors.hero.perks.extraperkchoice.catalog_desc=出现天赋选择时，候选天赋的数量由 _3_ 个增加到 _5_ 个。\n界面附带一个_重掷_按钮，按下后重新抽取的天赋数量为按钮总数的一半（_重掷_按钮本身也计入），即 _5_ 个候选时为 _3_ 个、_3_ 个候选时为 _2_ 个；重掷会排除当前列表上已有的天赋，且重掷后的新窗口不再带有_重掷_按钮。

# Knowledgeable 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:219-239（chance=(0.05+0.2×level)×(1+0.2×wealth)，上限 _1_，失败后再单独判定诅咒）; items/Item.kt:80-81,85-108,339-344（首次成功拾取时调用，已鉴定物品直接返回，identify 同时揭示等级与诅咒）; actors/hero/Hero.kt:301-308（财富加成）
actors.hero.perks.knowledgeable.catalog_desc=首次拾起一件物品且背包放得下时判定一次，每个物品实例只判定这一次；已经鉴定的物品不判定。\n\n判定概率为 _（5%+20%×等级）×（1+0.2×财富加成）_，上限 _100%_：财富加成为 _0_ 时，等级 _1_ 为 _25%_、等级 _2_ 为 _45%_、等级 _3_ 为 _65%_，之后每点财富加成再把它放大两成。\n\n判定成功会直接完全鉴定该物品，等级与诅咒一并揭示。\n\n若第一次判定失败，且该物品的诅咒尚未知晓，会再以同一概率单独揭示它的诅咒；两次都失败则没有任何效果。

# EfficientSearch 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:109-111; actors/hero/Hero.kt:1387-1400（扫描距离由 1 改为 2）; actors/hero/Hero.kt:1012-1015（移动时的自动搜索）; ui/Toolbar.kt:255,264（主动搜索）; actors/hero/Hero.kt:1221-1229,1440-1451（判定几率不变）
actors.hero.perks.efficientsearch.catalog_desc=搜索的扫描半径由 _1_ 格扩大到 _2_ 格，覆盖范围从以英雄为中心的 _3×3_ 格变为 _5×5_ 格，层边界处会被截断。\n主动搜索与移动时的自动搜索都使用这一范围；发现隐藏门、陷阱的几率与一次搜索的耗时都不受该天赋影响。

# ExtraStrength 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:143-158（str() 返回 level，onGain 加、onLose 减）; actors/hero/perks/Perk.kt:75-87（Additional 的 upgrade/downgrade 先调用 onLose 再调用 onGain）; items/weapon/Weapon.kt:118,151（力量参与超重判定与溢出力量伤害）
actors.hero.perks.extrastrength.catalog_desc=获得时英雄的力量立即增加与天赋等级相同的点数：等级 _1_ 为 _+1_，等级 _2_ 为 _+2_，等级 _3_ 为 _+3_。\n\n升级或降级时先扣回旧等级的加成、再加回新等级的加成，力量始终等于原值加上当前等级。\n\n失去该天赋时，已增加的力量被完整扣回。\n\n这份力量照常进入武器伤害中溢出力量的计算与力量需求的超重判定。

# QuickLearner 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:253-278（ratio 为 0.05+0.1×等级，零头用 dexp 累计）; actors/hero/Hero.kt:1159-1161（earnExp 时按所得经验结算）
actors.hero.perks.quicklearner.catalog_desc=每次获得经验时，额外获得 _所得经验×(0.05+0.1×等级)_ 点经验：等级 _1_ 为 _15%_、等级 _2_ 为 _25%_、等级 _3_ 为 _35%_。\n加成按每次经验获取分别结算，不足 _1_ 点的零头会保留下来累计到下一次，不会丢失。\n它只提高经验获取量，不影响金币、掉落与其它奖励。

# PolearmMaster 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/attack.kt:140-170（比例 = 0.1+武器阶数×0.05×等级；相邻判定成功时 Cripple 时长 1+阶数+DLY 并击退，失败后还有一次独立判定；不相邻只有一次判定；accFactor = 1+0.1×等级；canBeGain 排除流放者）; core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/Hero.kt:194-195（长杆 = 近战、RCH>1 且不是长鞭）; Hero.kt:385-400（命中率乘 accFactor）; Hero.kt:655-672（只在近战命中后调用 proc）; actors/Char.kt:376-378（残废时速度×0.5）; actors/buffs/Cripple.kt:26-51（纯状态，无其它效果）; items/wands/WandOfBlastWave.kt:183-222（throwChar 距离 = min(轨迹长度,1)，首领减半、目标或前方格被占据时为 0）
actors.hero.perks.polearmmaster.catalog_desc=装备长杆武器（近战、攻击距离大于 _1_ 且不是_长鞭_）时，命中率乘上 _1+10%×等级_。\n每次近战命中后另有一次判定，成功时使目标_残废_ _1+武器阶数+武器自身攻击间隔_ 回合，触发比例为 _10%+武器阶数×5%×等级_：武器阶数 _1_ 到 _5_ 时，等级 _1_ 为 _15%~35%_，等级 _2_ 为 _20%~60%_。_残废_期间目标移动速度减半，不改变其攻击与闪避。\n目标与自己相邻（含斜向）时，这次判定成功后还会把目标向远离自己的方向击飞 _1_ 格；若这次判定失败，会再进行一次独立判定，成功则只附加_残废_、不击飞。目标不相邻（靠长杆够到）时只有一次判定，成功同样只附加_残废_。\n目标为_首领_或_不可移动_单位、或它身后那一格已被占据时不会被击飞，_残废_仍然生效。手持投掷武器或普通近战武器时不触发。

# Ease 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:97-99; levels/Level.kt:870-880（英雄踩到尚未显形的陷阱且 Random.Int(2) 为 0 时，改为显形并记录）
actors.hero.perks.ease.catalog_desc=英雄踩到尚未显形的陷阱格时，有 _50%_ 的几率只是让该陷阱显形并记录到地图上，不触发它；余下 _50%_ 按通常方式触发。\n只有英雄自己踏入时判定，怪物踩踏与其它触发方式不受影响，已经显形的陷阱也不经过这段判定。\n先于陷阱结算的深坑坠落同样不受影响。

# FastMoveOnKilling 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:292-294; actors/hero/Hero.kt:1521-1523（击杀后 prolong Haste 3 回合）; actors/hero/Hero.kt:1488-1489（_幻影_属性直接返回）; actors/hero/Hero.kt:580-597（极速令速度×3）; actors/hero/Hero.kt:1097-1098（每格耗时 1/速度）; actors/Char.kt:657-668（仅英雄击杀进入结算）; items/wands/DamageWand.kt:140-143（法杖击杀同样调用）; items/unclassified/Rune.kt:123-139（Haste 为 FlavourBuff，prolong 只刷新）
actors.hero.perks.fastmoveonkilling.catalog_desc=英雄亲手击杀目标后获得 _3_ 回合的_极速_：期间移动速度乘 _3_，即每移动一格的行动耗时变为 _1/3_。\n重复击杀只会把剩余时间刷新为 _3_ 回合，不会叠加。\n只有由英雄造成的击杀会触发，随从、陷阱与其它来源的击杀不会；带有_幻影_属性的目标被击杀时不触发。法杖击杀同样触发。\n持续时间固定，不随等级变化。

# Dieting 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/function.kt:74-78（构造参数 2）; actors/buffs/Hunger.kt:100-117（挨饿伤害累计到 100 获得 1 级、到 180 升为 2 级，累计值封顶于 180）; actors/buffs/Hunger.kt:120-127（2 级时非挨饿状态下 20% 几率不上升）; actors/buffs/Hunger.kt:150-156（结算间隔乘 1.2，酒醉时改乘 0.8）; actors/buffs/Hunger.kt:220-227（间隔 10、每步上升 11 点、饥饿阈值 350、挨饿阈值 500）; actors/hero/HeroClass.kt:135（盗贼初始天赋）
actors.hero.perks.dieting.catalog_desc=不进入随机抽取池：_盗贼_开局携带，其他职业只能在_挨饿_期间积累获得。挨饿时每次结算造成的伤害（整数部分）计入累计值，达到 _100_ 时获得 _1_ 级，达到 _180_ 时升为 _2_ 级，累计值到 _180_ 后不再增加，并且随存档保存。\n_1_ 级起，饥饿结算的间隔由 _10_ 回合延长为 _12_ 回合（每次仍上升 _11_ 点），按回合计的饥饿累积速度降为 _1/1.2_；_挨饿_期间的结算间隔同样被延长，因此挨饿伤害的频率也降为 _1/1.2_。\n_2_ 级起额外获得：非挨饿状态下，每次结算有 _20%_ 几率使饥饿值原地不动。\n处于_酒醉_状态时结算间隔改按 _0.8_ 倍计算，与该天赋的延长不叠加。

# RavenousAppetite 依据: core/src/main/java/com/egoal/darkestpixeldungeon/actors/hero/perks/negative.kt:3-7（isNegative）; actors/buffs/Hunger.kt:73-92（饥饿伤害乘 1.5，不足 1 点清零并固定造成 1 点）; actors/buffs/Hunger.kt:219-231（STEP 10、HUNGER_DAMAGE_PER_TURN 0.25、STARVING 500）; actors/hero/Hero.kt:90（regeneration 默认 0.1）:214-217（fedRegeneration 取基础回复与 0 的较大值）; actors/hero/HeroClass.kt:42（_战士_ 初始天赋）
actors.hero.perks.ravenousappetite.catalog_desc=此天赋是_战士_的初始负面天赋。\n它在英雄处于_饥饿_状态（饥饿值达到 _500_）时，把每个饥饿结算周期（默认 _10_ 回合）的伤害再乘 _1.5_；基础伤害为 _0.25×10×回复速率_。\n伤害按累计值结算：累计不足 _1_ 点时清零并固定造成 _1_ 点，超出时只结算整数部分并把小数留到下次。英雄默认回复速率为 _0.1_，周期结算值为 _0.25_，乘 _1.5_ 后为 _0.375_，仍在 _1_ 点以下，因此回复速率较低时该乘数不会带来额外伤害，只有回复速率把结算值推过整数阈值时才会体现。\n它不改变饥饿值的上涨速度与饥饿阈值；饥饿值不足 _500_ 时没有任何效果。
