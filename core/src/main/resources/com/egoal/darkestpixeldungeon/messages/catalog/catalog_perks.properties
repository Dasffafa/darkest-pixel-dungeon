actors.hero.perks.fastregeneration.catalog_desc=_效果_：生命自然回复速率 _+0.33×等级_（基础为 _0.1_）。\n\n_机制_：未满血时每回合累计速率，整数部分转化为治疗量；饥饿时速率减半，极度饥饿时降为 _0_。挨饿扣血按每回合 _0.25×饱食回复速率_ 结算（每级使挨饿扣血 _+0.0825_ / 回合）。

