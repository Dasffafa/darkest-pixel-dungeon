items.artifacts.timekeepershourglass.catalog_desc=等级上限 _5_，充能上限 _2+floor((√(16×等级+1)-1)/2)_（初始满）。\n\n_充能_：每回合充能 _+1/(40-(上限-当前)×2)_。\n\n_主动_：时间冻结（需未冷却）：每消耗 _1_ 行动时间扣 _1_ 充能，期间敌人定身、陷阱推迟、伤害延迟至结束结算。耗尽自动解除，手动解除冷却 _5_ 回合。\n\n_升级_：在地下 _6/11/16/21_ 层拾取沙袋升级。\n\n_满级_：时间冻结期间移动速度 _×2_。\n\n_诅咒_：技能禁用且停止充能，拾取沙袋无法升级；每回合有 _10%_ 几率强行消耗英雄 _1_ 回合时间。

# UnstableSpellbook 依据: items/artifacts/UnstableSpellbook.kt:79-101（levelCap=10、初始 charge/chargeCap=等级/2+2）; 170-177（upgrade 后 chargeCap=(level+1)/2+2，满级清空 scrolls）; 51-77（喂入索引前 3 项之一的已鉴定卷轴，每张升 1 级）; 112-166（READ：136 行 Random.Int(80+10×soudorps)<=满级?2:1；137/141 charge--；151-158 已鉴定卷轴缓存）; 217-239（bookRecharge，221 行 1/(150-(cap-charge)×15)）; actors/hero/Hero.kt:179-191（canRead）; items/scrolls/Scroll.kt:86-88（诅咒书封禁除祛邪外所有卷轴）; items/Generator.kt:242-257（SCROLL 池）
items.artifacts.unstablespellbook.catalog_desc=等级上限 _10_，充能上限 _floor((等级+1)/2)+2_。\n\n_充能_：每回合充能 _+1/(150-(上限-当前)×15)_。\n\n_主动_：阅读（需 _1_ 充能）：_1/80_ 概率施放升级卷轴，否则随机施放卷轴（鉴定/祛邪/地图重掷率 _50%_）；抽到已鉴定卷轴则免费缓存供下次无消耗使用。目盲、酒醉、崩溃时不可读。\n\n_升级_：喂入书页前 _3_ 项同名的已鉴定卷轴升级。\n\n_满级_：施放升级卷轴的概率提升至 _2/80_，书页目录清空。\n\n_诅咒_：停止充能，且除祛邪卷轴外无法阅读任何卷轴。

# DriedRose 依据: items/artifacts/DriedRose.kt:28-41（levelCap=10、chargeCap=100、初始满充能）; 53-94（SUMMON：满充能召唤 GhostHero(level)、charge 归零）; 69（召唤时 hero.recoverSanity(Random.Float(level))）; 140-152（Recharge：仅未召唤时 partialCharge+=100/300）; 111-118（upgrade）; 183-210（Petal 拾取升级，需玫瑰在背包且未满级）; levels/Level.kt:1124-1137（花瓣生成 ceil((depth/2-droppedPetals)/3)，最多 11 片）; actors/mobs/npcs/GhostHero.kt:52（HT=10+roseLevel×5）; 54（timeLeft=30×roseLevel+60）; 95-100（每 15 回合治疗 ceil(HT×(0.05+0.01×roseLevel))）; 163-168（伤害 NormalIntRange(((HT-10)/3)/2, 5+(HT-10)/3)）; 168（免伤 NormalIntRange(0,(HT-10)/3)）; 120-121（攻击距离≤4）; 248（治疗冷却 15f）; actors/hero/Hero.kt:1317-1334（满级玫瑰死亡时以满血复活、解除诅咒并卸下、幽灵牺牲）
items.artifacts.driedrose.catalog_desc=等级上限 _10_，充能上限 _100_（初始满）。\n\n_充能_：未召唤时每 _3_ 回合充能 _+1_；召唤期间停止充能。\n\n_主动_：召唤（满充能）：消耗全部充能，召唤同级幽灵英雄存在 _30×等级+60_ 回合，并回复 _0~等级_ 理智。幽灵生命 _10+5×等级_、远程伤害 _(5×等级/6) ~ 5+(5×等级/3)_、免伤 _0 ~ 5×等级/3_，每 _15_ 回合为 _2_ 格内英雄治疗 _ceil(生命上限×(0.05+0.01×等级))_。\n\n_升级_：拾取花瓣升级（每层生成 _ceil((层数/2-已掉落)/3)_ 片，至多 _11_ 片）。\n\n_满级_：致命伤害时消耗幽灵以满血复活，玫瑰自动脱下并解除诅咒。\n\n_诅咒_：技能禁用且停止充能，拾取花瓣无法升级；每回合有 _2%_ 几率在周围生成一只怨灵。

# LloydsBeacon 依据: items/artifacts/LloydsBeacon.kt:131-141（levelCap=3、chargeCap=3+level）; 143（random 返回自身）; 169-241（SET 记录层数/坐标；RETURN 跨层或同层传送；191 行 ZAP 消耗 depth>20?2:1）; 56-129（zapper：58-62 先扣充能；65-71 目标为英雄自身时传送英雄；85-119 怪物传送到 randomRespawnCell，最多 10 次）；245-250（upgrade chargeCap++）; 265-285（beaconRecharge：1/(100-(cap-charge)×10)）; 288（TIME_TO_USE=1f）; actors/mobs/Tengu.kt:171、King.kt:159、DM300.kt:269（击败对应 boss 自动 upgrade）; items/scrolls/ScrollOfTeleportation.kt:97-114（满级 IntendTeleportHero 指定目标格）; levels/traps/DistortionTrap.kt:44-47（本层被扭曲陷阱重置则清除该记录点）
items.artifacts.lloydsbeacon.catalog_desc=等级上限 _3_，充能上限 _3+等级_。\n\n_充能_：每回合充能 _+1/(100-(上限-当前)×10)_。\n\n_主动_：\n· 设置/返回（耗时 _1_ 回合，不耗充能）：记录或传送回记录点（存在 Boss 或周围 _8_ 格内有生物时不可用）。\n· 传送：消耗 _1_ 充能（地下 _20_ 层以下消耗 _2_），将目标怪物随机传送，或随机传送自身。\n\n_升级_：击败第 _10/15/20_ 层 Boss 各自动升 _1_ 级。\n\n_满级_：对自身施放传送时可指定已探索的落点位置。\n\n_诅咒_：不能充能，不影响自然释放。

