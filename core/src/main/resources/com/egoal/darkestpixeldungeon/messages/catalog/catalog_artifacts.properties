items.artifacts.dragonssquama.catalog_desc=等级上限 _10_，充能上限 _100_（初始满）。装备火焰抗性 _+60%_。\n\n_充能_：每 _2_ 回合充能 _+1_；受非精神伤害充能 _+4-floor(等级/5)_（暴击再 _+1_）。\n\n_被动_：被暴击伤害减免 _12%+1%×等级_。\n\n_主动_：轻叩（满充能）：消耗全部充能，对周围 _3+floor(等级/3)_ 格内所有单位造成 _2+2×等级 ~ 6+5×等级_ 火焰伤害并点燃地面，未死亡敌人震慑 _1.5_ 回合。\n\n_升级_：每次轻叩经验 _+1_，升级阈值 _等级+2_。\n\n_满级_：受到攻击时有 _25%_ 几率点燃 _2_ 格内攻击者约 _8_ 回合。\n\n_诅咒_：无法使用轻叩；受到暴击时不仅不减免，反而额外增加 _12%+1%×等级_ 伤害。

