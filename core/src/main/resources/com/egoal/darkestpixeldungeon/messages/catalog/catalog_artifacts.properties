items.artifacts.cloakofsheep.catalog_desc=等级上限 _10_。\n\n_主动_：闪烁（耗时 _0.5_ 回合，冷却 _20_ 回合）：传送至已探索的位置，并在原地生成一只绵羊（存在 _等级~等级+深度+9_ 回合）。闪烁范围为 _5+等级÷2_，即每 _2_ 级 +_1_ 格，满级 _10_ 格。\n\n_自动闪现_：点击的目的地，需要走7步以上时自动发动（可用「自动闪现」开关）：沿最短路径传送至范围内最靠近终点的空格，可穿墙。自动触发只获得 _一半_ 经验。\n\n_升级_：按闪烁跨越的距离获得经验（每格 _+1_，切比雪夫距离），升级阈值 _(等级+1)×(等级+2)×2_。\n\n_满级_：获得场上所有绵羊周围 _3×3_ 区域的视野（共享绵羊视野）。\n\n_诅咒_：无法闪烁，每回合有 _1%_ 几率触发以自身为中心半径 _2_ 的羊群陷阱。

