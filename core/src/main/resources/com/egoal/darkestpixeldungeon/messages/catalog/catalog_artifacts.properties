# HandOfTheElder 依据: items/artifacts/HandOfTheElder.kt:30-53（levelCap=10、chargeCap=2、初始充能2、最多融合5枚戒指）; 103-123（每回合 +0.025×1.05^等级）; 126-140（融合戒指：升级 clamp(戒指等级+1,1,剩余)，诅咒戒指传染诅咒）; 166-212（一指：消耗1充能、暗影伤害 目标生命上限/10~/5、持续(等级/2+2)×加成、定身与戒指负面）; 226-246（戒指→负面映射表、MAX_RINGS_TO_WEAR=5）
items.artifacts.handoftheelder.catalog_desc=等级上限 _10_，充能上限 _2_（初始满）。\n\n_充能_：每回合充能 _+0.025×1.05^等级_。\n\n_主动_：\n· 一指（消耗 _1_ 充能，必中）：造成目标生命上限 _10%~20%_ 暗影伤害，施加 _缠绕_ _floor(等级/2)+2_ 回合（Boss 减半）及所有融合戒指的对应负面状态。\n· 融合：最多融入 _5_ 枚不同戒指，每枚使等级 _+clamp(戒指等级+1, 1, 剩余上限)_。\n\n_戒指负面_：精准→震撼、暴击/根骨→虚弱、抗性→冻伤、闪避→失衡、武力→狂乱、狂怒→迟缓、疾速→残废（双倍）、神射→失明、生命→眩晕（双倍）、财富→魅惑、奥术→白雾。\n\n_诅咒_：无法融合戒指；一指持续时间 _×1.25_；融入诅咒戒指会导致骨手被诅咒。

