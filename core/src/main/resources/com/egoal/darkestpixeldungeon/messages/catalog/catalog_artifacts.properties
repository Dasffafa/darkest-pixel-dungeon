items.artifacts.riemannianmanifoldshield.catalog_desc=等级上限 _10_。生成时 _70%_ 几率诅咒。\n\n_被动_：完全抵消一次非精神伤害，随后进入 _56-4×等级_ 回合冷却（初次装备冷却为 _1_），冷却完毕恢复格挡。\n\n_升级_：每次格挡经验 _+1_，升级阈值 _floor(等级²/3)+等级+1_（_+0→+1_ 需 _2_ 次）。\n\n_满级_：格挡消耗时对周围 _3_ 格内敌人造成 _10 ~ 目标生命上限/5_ 魔法伤害。\n\n_诅咒_：不提供格挡，且装备者魔法与元素抗性降为 _0_。

