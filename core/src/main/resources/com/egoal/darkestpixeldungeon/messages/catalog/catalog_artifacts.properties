items.artifacts.heartofsatan.catalog_desc=等级上限 _10_。\n\n_被动_：每回合额外自然回复 _生命上限×0.003×1.18^等级_ 生命（饥饿减半，极度饥饿归零）。\n\n_主动_：血祭（耗时 _3_ 回合，未满级）：承受 _max(1, 护甲减免后(3×等级²))_ 物理伤害，存活即升 _1_ 级。\n\n_满级_：自然回复上限提升至 _生命上限×1.5_。\n\n_诅咒_：无法血祭升级，自然回复变为每回合 _-0.025_ 生命。

