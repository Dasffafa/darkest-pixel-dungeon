items.artifacts.talismanofforesight.catalog_desc=等级上限 _10_，充能上限 _100_。\n\n_充能_：每回合充能 _+0.04+0.006×等级_。每发现一处秘密充能 _+2+floor(等级/3)_、经验 _+1_。\n\n_被动_：被动侦测 _3_ 格内暗门；基础探知加成 _+0.1_。\n\n_主动_：占卜（满充能）：消耗全部充能，揭示本层全部暗门与密室，获得 _2_ 回合感知。\n\n_升级_：每累计 _4_ 点经验升 _1_ 级。\n\n_满级_：基础探知加成由 _+0.1_ 提升至 _+0.25_。\n\n_诅咒_：被动侦测失效，主动搜索耗时 _×3_。

