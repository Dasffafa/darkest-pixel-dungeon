items.artifacts.etherealchains.catalog_desc=等级上限 _5_，充能上限 _5+2×等级_（初始 _5_）。\n\n_充能_：每回合充能 _+1/(s-(上限-当前)×2)_（_+0~+4_ 时 _s=32_；锁定楼层停止）。\n\n_主动_：施放（消耗等同位移格数的充能）：\n· 普通敌人：拉至身边并致残 _2+等级/2_ 回合。\n· 霸体/Boss：自身飞至其身边并触发必中普通攻击。\n· 地形：自身飞至目标位置。\n\n_升级_：英雄获得经验时同步转化：经验 _+= round(经验/升级需求×100)_，充能 _+= 经验/升级需求×10_；升级阈值 _100+50×等级_。\n\n_满级_：充能基数 _s_ 提升至 _40_，提升高充能上限下的回充效率。\n\n_诅咒_：技能禁用且停止充能，每回合有 _1%_ 几率使自身致残 _10_ 回合。

