# 图鉴文本：造物（神器）
#
# 每一条都从实现里读出来，紧随其后的注释给出依据（文件:行）。造物靠充能与经验升级，
# 不使用升级卷轴；等级上限、充能与经验阈值见各条。

# CapeOfThorns 依据: items/artifacts/CapeOfThorns.kt:40-47（levelCap=10、chargeCap=100）; 70-81（每回合递减 cooldown）; 83-123（85 力量<16 直接返回、89 充能 += floor(伤害×(0.5+0.05×等级))、91-92 充满后 charge=0 且 cooldown=10+等级、98 偏转 NormalIntRange(1,伤害)、100-103 暴击时剩余伤害 ×3/2、105-109 满级或相邻才反伤、111-117 经验阈值 5×(等级+1)）; actors/hero/Hero.kt:554（defendDamage 中调用 proc）; actors/Char.kt:595-597（仅非魔法、非纯粹伤害走 defendDamage）; actors/hero/Hero.kt:285-300（暴击率来源）; SPD-classes/src/main/java/com/watabou/utils/Random.java:57-59（NormalIntRange 为三角分布）
items.artifacts.capeofthorns.catalog_desc=需要 _16 点力量_才生效：力量不足时既不积攒充能也不反射伤害。只对_物理_伤害生效。\n\n未激活时，每次受到物理伤害都会积攒充能：_充能 += floor(伤害 × (0.5+0.05×等级))_，因此攒满 _100_ 点需要累计承受 _200_ 点（_+0_）、_133_ 点（_+5_）、_100_ 点（_+10_）伤害。充满后充能清零，并进入 _10+等级_ 回合的_激活期_（_+0_ 为 _10_ 回合，_+10_ 为 _20_ 回合）。激活期内不再积攒充能。\n\n激活期内每次受到物理伤害会先随机偏转 _1~伤害_ 点。攻击者必须是怪物，且只有怪物与你相邻_时，怪物才会受到与偏转量等量的_反伤_。\n\n每次偏转都累积经验（无论攻击者是否真的被反伤），升级需要累计偏转 _5×(等级+1)_ 点：_+0→+1_ 需 _5_ 点，_+9→+10_ 需 _50_ 点，从 _+0_ 到满级共需 _275_ 点。等级越高积攒充能越快（同一份伤害换来的充能更多），但激活期也越长（冷却随等级从 _10_ 涨到 _20_ 回合）；满级后激活期的反伤_无视距离_。

# ChaliceOfBlood 依据: items/artifacts/ChaliceOfBlood.kt:44-49（levelCap=10）; 53-55（MaxVolume=等级+5、状态栏显示 体积/上限）; 78-102（80 dp=HT×0.11+1、81-82 need/consumed、84 effect=min(HT-HP, consumed×floor(dp))、87 满级时 SHLD+=回复量/2、91 耗时 1 回合）; 115-118（upgrade 保留诅咒）; 146-165（148-150 击杀体积 0.2~0.8 或 0.1、诅咒 +0.1、上限 MaxVolume；153-159 经验按怪物经验占英雄一级的百分比、阈值 100+20×等级）; actors/hero/Hero.kt:1514（击杀时调用 onEnemySlayed）; actors/hero/Hero.kt:1156（maxExp=4+lvl×6）
items.artifacts.chaliceofblood.catalog_desc=装备后被动积攒_体积_（状态栏显示 _体积/上限_），上限为 _等级+5_：_+0_ 为 _5_，_+10_ 为 _15_。每次击杀单位获得体积：有经验的怪物给 _0.2~0.8_ 点，无经验单位（召唤物等）给 _0.1_ 点；_被诅咒时额外 +0.1_。\n\n升级经验按击杀怪物的经验占英雄升一级所需经验的百分比累计（_round(怪物经验 / 英雄升级所需经验 × 100)_），累计超过 _100+20×等级_ 时升一级：_+0_ 需 _101_ 点，_+9_ 需 _281_ 点（满级后不再累计）。\n\n主动_饮用_（耗时 _1_ 回合，需体积 ≥ _1_）：每点体积回复 _floor(生命上限×0.11+1)_ 点生命，一次消耗的体积为 _floor((生命上限-当前生命) ÷ (生命上限×0.11+1))_（不超过现有体积）。以生命上限 _100_ 为例：每点体积回 _12_，从空血约需 _8_ 点、回满约 _96%_；上限 _200_ 时每点回 _23_，从空血约需 _8_ 点、回满约 _92%_。体积不足时按现有体积结算，回复量会打折。\n\n满级（_+10_）后饮用时额外获得等于_回复量一半_的护盾。被诅咒的血精之盅体积积累更快，但_升级不会解除它的诅咒_——这是少数无法靠升级解咒的造物，诅咒状态会一直跟到净化为止。

# CloakOfShadows 依据: items/artifacts/CloakOfShadows.kt:48-64（levelCap=14、chargeCap=等级+6、初始即满充能、unique）; 66-69（充能>1 才能潜行）; 73-108（潜行开关、88 满级时耗时 0.01 回合）; 135-138（每次升级 chargeCap++）; 174-212（176-190 回复 1/(50-(chargeCap-charge))、192-193 冷却递减）; 214-256（221-229 隐身并在满级时附带 2 回合极速、231-250 每 3 回合扣 1 点充能与 +10+英雄等级 经验、241-245 阈值 40×(等级+1)、288-295 detach 时 charge-- 且 cooldown=6-等级/4）; actors/hero/Hero.kt:597（极速使速度 ×3）; actors/hero/Hero.kt:416-417（蓝图强化后未闪避系数 ×0.8）; items/unclassified/GreatBlueprint.kt:52-67（强化入口）; actors/buffs/Invisibility.kt:74-79（被显形的统一 dispel）
items.artifacts.cloakofshadows.catalog_desc=盗贼专属的_唯一_造物。潜行需要装备且充能 _>1_；进入后每 _3_ 回合消耗 _1_ 点充能，并获得 _10+英雄等级_ 点经验。充能耗尽、主动显形、或被打断/被显形时都会结束潜行，并同样扣除 _1_ 点充能与结算经验。\n\n充能上限为 _等级+6_：_+0_ 为 _6_（一次潜行约 _18_ 回合），满级 _+14_ 为 _20_（约 _60_ 回合）。非潜行状态下每回合回复 _1 / (50-(充能上限-当前充能))_，越接近满越慢：从空充满 _+0_ 需约 _279_ 回合，_+10_ 需 _664_ 回合，_+14_ 需 _790_ 回合。在封锁楼层的可回复窗口外不会充能。\n\n升级需 _40×(等级+1)_ 点经验：_+0→+1_ 需 _40_，_+13→+14_ 需 _560_，满级共 _4200_ 点；每升一级充能上限 _+1_。结束潜行后进入 _6-等级/4_ 回合冷却：_+0~+3_ 为 _6_，_+4~+7_ 为 _5_，_+8~+11_ 为 _4_，_+12~+14_ 为 _3_。\n\n满级（_+14_）后：进入潜行只花 _0.01_ 回合，并额外获得 _2_ 回合_极速_（移动速度 _×3_）。\n\n用_伟大蓝图_强化后斗篷会变得模糊：未闪避系数乘以 _0.8_，即闪避率 _P_ 变为 _1-0.8×(1-P)_——原本 _10%_ 提升到 _28%_，原本 _50%_ 提升到 _60%_。

# CrackedCoin 依据: items/artifacts/CrackedCoin.kt:38-49（levelCap=5、chargeCap=100、初始满充能）; 67-76（动作解锁，满级多出落雷）; 157-164（诅咒时每 10 回合扣 等级 点金币）; 168-193（172 满充能直接返回、174-176 金币与减伤、178-185 充能 += round(max(1,金币)×5×0.75^等级)、189 dpg=0.25+0.25×等级）; 195（炮击金币 10+10×等级）; 197 与 219-226（升级经验 等级²/2+等级+1，每次炮击 +1）; 201-242（炮击流程）; 285-303（287-292 直线伤害 8+5×等级~8+10×等级、麻痹 1~1.5+等级/2；295-298 摧毁可燃地形；302 照亮路径）; 244-283（落雷：245 金币 10+20×等级；259-268 半径 1 内 8+6×等级~12+12×等级、麻痹 3 回合）; actors/hero/Hero.kt:724（takeDamage 中调用护盾）
items.artifacts.crackedcoin.catalog_desc=银币以_金币_为燃料，充能上限 _100_，入手时满充能。金币只在_护盾_开启期间消耗。\n\n_护盾_（主动开关，耗时 _1_ 回合）：仅当充能 _< 100_ 时生效——满充能时它不再替你挡伤，必须先放电才能再次运作。每次受到_非精神_伤害时，按 _每金格挡 = 0.25+0.25×等级_（_+0_ 为 _0.25_，_+5_ 为 _1.5_）扣除金币 _round(伤害/2 ÷ 每金格挡)_，并减免 _round(金币 × 每金格挡)_ 点伤害（即恰好挡掉该次伤害的一半，不足则由受击那一刻持有的金币决定），同时回复充能 _round(max(1,金币) × 5 × 0.75^等级)_。举例：_+0_ 时每挡 _1_ 点伤害要花约 _2_ 金、换回 _5_ 点充能；_+5_ 时每挡 _1_ 点伤害约花 _0.33_ 金、换回约 _1.19_ 点充能。等级越低充能越快，但烧钱越凶。\n\n_炮击_（需满充能 _100_，耗时 _1_ 回合）：消耗 _10+10×等级_ 金币（_+0_ 为 _10_，_+5_ 为 _60_），充能清零；沿直线命中路径上的每个单位，造成 _8+5×等级 ~ 8+10×等级_ 点电属性魔法伤害（_+0_ 恒为 _8_，_+5_ 为 _33~58_），并麻痹 _1~1.5+等级/2_ 回合（_+0_ 为 _1~1.5_，_+5_ 为 _3.5~4_）；沿途可燃地形会被摧毁。\n\n_落雷_（仅满级 _+5_，需满充能，耗时 _1_ 回合）：消耗 _10+20×等级_ 金币（满级为 _110_），充能清零；对目标格及相邻格的每个怪物造成 _8+6×等级 ~ 12+12×等级_ 点电属性魔法伤害（满级 _38~72_），并麻痹 _3_ 回合。\n\n升级：每次成功炮击经验 _+1_，升级需 _等级²/2+等级+1_ 点（_0→1_ 需 _1_，_1→2_ 需 _2_，_2→3_ 需 _5_，_3→4_ 需 _8_，_4→5_ 需 _13_，共 _29_ 次炮击满级）。被诅咒时护盾、炮击、落雷全部无法使用，且每 _10_ 回合流失 _等级_ 点金币（_+0_ 时为 _0_）。

# HornOfPlenty 依据: items/artifacts/HornOfPlenty.kt:50-60（levelCap=30、chargeCap=10+visiblyUpgraded()）; 144-148（升级后重算 chargeCap）; 164-194（174 充能 = STARVING×经验比例×(0.25+0.035×等级)、177-179 每 STARVING/10 记 1 点）; 62-69 与 71-123（83-85 食用消耗 max(1,饥饿/50) 点、每点回 50；87-88 ≥3 点触发美食家；90-97 ≥7 且满级 → 护盾 ×3、生命上限 +1~点数；100 回复 1~点数-1 点压力）; 202-221（贮存食物按 hornValue 升级、上限 30、拒绝未烹调无味果）; items/food/Food.kt:23-24（默认 hornValue=3）; items/food/Pasty.kt:12（5）、Blandfruit.kt:16（6）、OrchidRoot.kt:8（0）、OverpricedRation.kt:26（1）、ChargrilledMeat.kt:26（1）、FrozenCarpaccio.kt:42（1）、StewedMeat.kt:9,23（1）、MysteryMeat.kt:36（1）; actors/buffs/Hunger.kt:226-227（STARVING=500）、167-177（诅咒号角进食效率 67%）; actors/hero/Hero.kt:1156,1163-1165（gainCharge 收到的是本次经验占一级的比例）; actors/hero/perks/function.kt:160-184（美食家）; items/artifacts/Artifact.kt:109-111（visiblyUpgraded）
items.artifacts.hornofplenty.catalog_desc=_贮存_：把食物投进号角，按该食物自身的价值提升等级——普通口粮（基类）_+3_，_馅饼_ _+5_，_无味果_ _+6_，烤肉／炖肉／冻肉片／神秘肉／高价口粮 _+1_，_兰根_ _0_；未经烹调的无味果会被拒绝。上限 _+30_。\n\n充能上限 = _10 + round(等级/3)_：_+0_ 为 _10_，_+3_ 为 _11_，_+15_ 为 _15_，_+29_ 为 _20_。\n\n充能随英雄获取经验（击杀等）积累：每获得_相当于一级所需_的经验，充能 _+10×(0.25+0.035×等级)_，即 _+2.5+0.35×等级_ 点（_+0_ 为 _2.5_，_+10_ 为 _6_，_+20_ 为 _9.5_，_+30_ 为 _13_）。每点充能相当于 _50_ 点饥饿值。\n\n_食用_（耗时 _3_ 回合，需充能 ≥ _1_）：消耗的充能 = _max(1, floor(当前饥饿 ÷ 50))_，不超过现有充能；每点充能回复 _50_ 点饥饿（饥饿值上限 _500_，即极度饥饿状态下一次最多消耗 _10_ 点）。消耗 _≥3_ 点时触发_美食家_ perk 的进食效果；_≥7_ 点且满级时额外获得 _点数×3_ 护盾、生命上限永久 _+1~点数_；每次食用还会回复最高 _点数-1_ 点压力（至少 _1_ 点）。\n\n被诅咒的号角无法充能、也无法贮存食物，食用时的食物效果只有 _67%_（饥饿回复打折）。给号角喂食升级会解除它的诅咒。

# MasterThievesArmband 依据: items/artifacts/MasterThievesArmband.kt:39-45（levelCap=10、初始充能 0、未设 chargeCap）; 58-118（59-61 拾取金币 +floor(金币/2)、69-72 卸下时 ×0.95、74-96 steal、91-94 升级阈值 250+50×等级、98-102 成功率公式、104-117 满级偷袭 9% 窃取/盲目 2 回合/冷却 5）; items/unclassified/Gold.kt:58-64（拾取时调用 collect）; actors/mobs/npcs/Merchant.kt:86-89,206-241（商店偷窃入口与失败处理）; actors/mobs/Mob.kt:538（偷袭时调用 onSneakAttack）; items/Item.kt:302-309（升级会清除诅咒）
items.artifacts.masterthievesarmband.catalog_desc=充能全部来自_金币_：每拾取 _G_ 点金币，充能 _+floor(G/2)_，且_没有上限_。卸下袖章时充能 _×0.95_（永久损失 _5%_）。\n\n在像素商店对某件商品选择"偷窃"时，以商品价格 _v_ 计算成功率 _(充能 + min(50×等级, v×等级/30)) / v_。若 _v ≤ 充能_，必定成功并扣除 _v_ 点充能；否则按该几率判定，成功后若几率 ≤ _1_ 则充能清零，否则扣除 _floor(充能 ÷ 成功率)_。举例：_+0_ 时成功率就是 _充能/价格_（充能 _300_ 偷 _1000_ 的商品为 _30%_）；_+10_ 时额外获得 _min(500, v/3)_ 点虚充能（充能 _500_ 偷 _1000_ 为 _83%_；充能 _1000_ 偷 _1000_ 为 _133%_，必定成功）。偷窃失败会被店主察觉，商店关闭、店主逃离。\n\n每成功偷窃一次获得等于该商品价格的_经验_，升级需 _250+50×等级_：_0→1_ 需 _250_，_9→10_ 需 _700_，满级共需 _4750_ 点。升级会解除袖章的诅咒。\n\n满级（_+10_）：发动_偷袭_（怪物尚未发现你）时有 _9%_ 几率直接从怪物身上窃取其掉落物（怪物无掉落则改为金币），并使其_盲目_ _2_ 回合；触发后有 _5_ 回合冷却。该冷却不写入存档，重新载入游戏即可重置。

# SandalsOfNature 依据: items/artifacts/SandalsOfNature.kt:80（levelCap=3）; 50-75（喂食草籽，62 行 seeds.size>=3+level×3 → 升级并清空）; 87-92（actions）; 199-206（Naturalism.charge，203 行 round((HT-charge)×(0.01+level×0.01))）; 101-120（ROOT 主动，104-108 已扎根时返还 level×9/10）; 227-245（Rooted 继承 Earthroot.Armor）; plants/Earthroot.kt:81-91（absorb 减半机制）; 185-197（fixOn/fixOff 全元素抗性 +0.1）; levels/features/HighGrass.kt:54-77（采集充能与草籽掉落 73-76）; actors/Damage.kt:21-22（6 种元素）
items.artifacts.sandalsofnature.catalog_desc=等级上限 _3_。装备后可用 _喂食_ 把不同种类的_草籽_喂给鞋：每升一级需要 _3+3×当前等级_ 种（第一次 _3_ 种、第二次 _6_ 种、第三次 _9_ 种，共需 _18_ 种），集满即清空库存并升级。_0_ 级时没有被动充能。\n\n被动：在_高草_中采集时，按 _round((生命上限-当前充能) × (等级+1)%)_ 累积充能，充能上限等于_生命上限_；同一采集还令高草掉落草籽的概率变为 _1/(18-(等级+1)×3)_：_0_ 级 _1/15_、_1_ 级 _1/12_、_2_ 级 _1/9_、_3_ 级 _1/6_。\n\n主动 _扎根_（需等级>0）：清空充能，附着_根须护甲_，护甲值 = 本次消耗的充能。受击时若护甲 ≥ _ceil(伤害/2)_，该次伤害减半并扣除 _ceil(伤害/2)_；否则护甲耗尽、伤害减去_剩余护甲值_后解除。_移动_即解除效果。已扎根时再次使用会提前解除，并返还剩余护甲的 _90%_。\n\n满级（_3_ 级）额外：装备期间_全部 6 种元素抗性各 +10%_。

# TalismanOfForesight 依据: items/artifacts/TalismanOfForesight.kt:44-55（levelCap=10、chargeCap=100）; 121-178（Foresight.act，164-167 每回合 partialCharge+=0.04+level×0.006）; 180-188（charge()：+2+level/3 充能、exp++、每 4 点经验升 1 级）; 148-160（3 格范围警告）; 64-98（SCRY 消耗全部充能并揭开本层秘密）; actors/buffs/Awareness.kt:36（DURATION=2f）; actors/hero/Hero.kt:1221-1229（awareness 基础 0.1，Foresight +0.1，满级 +0.25，上限 1）; 1385-1448（搜索：intentional 用 2w-w²、非 intentional 用 w；1408-1415 每发现一处秘密调用 charge()；被动探知 1440-1451；1400/1425-1427 诅咒时非主动探知不可能且主动搜索 ×3 耗时）
items.artifacts.talismanofforesight.catalog_desc=等级上限 _10_，充能上限 _100_。\n\n被动充能：每回合累积 _0.04+0.006×等级_，把 _100_ 充能充满需 _2500_ 回合（_0_ 级）到 _1000_ 回合（_10_ 级）。_探知_：被动侦测周围 _3_ 格内的可见暗门，发现时发出提示并打断英雄；同时把基础探知值 _0.1_ 提升至 _0.2_，满级提升至 _0.35_（上限 _1_），提高非主动搜索发现密门的概率。每发现一处秘密，获得 _2+等级/3_（向下取整）点充能与 _1_ 点经验，每累计 _4_ 点经验升 _1_ 级。\n\n主动 _占卜_（需满充能）：消耗全部 _100_ 充能，揭开本层全部暗门与密室，并获得 _2_ 回合_感知_。\n\n诅咒时：不再发出警告、也无法被动探知，主动搜索耗时变为 _×3_。

# TimekeepersHourglass 依据: items/artifacts/TimekeepersHourglass.kt:26-37（levelCap=5、初始满充能）; 85（chargeCapacity=(2+(√(8×2×lvl+1)-1)/2).toInt()）; 50-72（ACTIVATE，62 行手动解除 cooldown=5）; 125-147（Recharge，129 行 1/(40-(cap-charge)×2)）; 150-262（TimeFreeze；155-168 processTime 每单位时间扣 1 充能）; actors/hero/Hero.kt:864-868（spend 经 processTime 扣充能）; 599-601（满级冻结期间 speed×2）; actors/Char.kt:178-183（冻结期间伤害延迟）; actors/mobs/Mob.kt:470-473（冻结时敌人 paralysed）; levels/Level.kt:893-903（冻结时陷阱延迟触发）; 272-294（SandBag 拾取升级）; levels/diggers/specials/MerchantDigger.kt:166-180（地下 6/11/16/21 层掉落沙袋）
items.artifacts.timekeepershourglass.catalog_desc=等级上限 _5_，充能上限为 _2 + floor((√(16×等级+1)-1)/2)_：_0→2、1→3、2→4、3→5、4→5、5→6_。\n\n主动 _时间冻结_（需充能>0、未诅咒、冷却为 _0_）：启动后，英雄每消耗 _1_ 单位行动时间即扣 _1_ 充能，期间敌人被_定身_、陷阱推迟触发、英雄受到的伤害延迟到解除时才结算；充能耗尽则自动解除。手动解除会进入 _5_ 回合冷却。\n\n充能速度：每回合 _1/(40-(上限-当前充能)×2)_，充能越少越快；从空充满 _0_ 级约 _74_ 回合、_5_ 级约 _198_ 回合。\n\n升级靠拾取_沙袋_：在地下有 _6/11/16/21_ 层时，按距离满级还差的进度掉落。满级（_5_ 级）额外：冻结期间英雄移动速度 _×2_。

# UnstableSpellbook 依据: items/artifacts/UnstableSpellbook.kt:79-101（levelCap=10、初始 charge/chargeCap=等级/2+2）; 170-177（upgrade 后 chargeCap=(level+1)/2+2，满级清空 scrolls）; 51-77（喂入索引前 3 项之一的已鉴定卷轴，每张升 1 级）; 112-166（READ：136 行 Random.Int(80+10×soudorps)<=满级?2:1；137/141 charge--；151-158 已鉴定卷轴缓存）; 217-239（bookRecharge，221 行 1/(150-(cap-charge)×15)）; actors/hero/Hero.kt:179-191（canRead）; items/scrolls/Scroll.kt:86-88（诅咒书封禁除祛邪外所有卷轴）; items/Generator.kt:242-257（SCROLL 池）
items.artifacts.unstablespellbook.catalog_desc=等级上限 _10_，充能上限为 _floor((等级+1)/2)+2_：_0→2、1→3、2→3、3→4、4→4、5→5、6→5、7→6、8→6、9→7、10→7_。\n\n主动 _阅读_（需 _1_ 充能）：有 _1/80_ 几率释放_升级卷轴_（满级 _10_ 时提高为 _2/80_），否则随机生成一张卷轴，其中_鉴定、祛邪、魔法地图_有 _50%_ 概率被重掷。若抽到的是已鉴定卷轴，则改为_缓存_，下次阅读可免费使用、不消耗充能。阅读需角色未处于_目盲、酒醉、紧张/崩溃_状态。\n\n充能速度：每回合 _1/(150-(上限-当前充能)×15)_，充能越少越快；从空充满 _0_ 级约 _255_ 回合、_10_ 级约 _630_ 回合。\n\n升级：向书页索引的_前 3 项_中喂入与之同名的_已鉴定重复卷轴_，每张升 _1_ 级；满级后索引清空，无法再喂。诅咒时：除_祛邪卷轴_外无法阅读任何卷轴。

# DriedRose 依据: items/artifacts/DriedRose.kt:28-41（levelCap=10、chargeCap=100、初始满充能）; 53-94（SUMMON：满充能召唤 GhostHero(level)、charge 归零）; 69（召唤时 hero.recoverSanity(Random.Float(level))）; 140-152（Recharge：仅未召唤时 partialCharge+=100/300）; 111-118（upgrade）; 183-210（Petal 拾取升级，需玫瑰在背包且未满级）; levels/Level.kt:1124-1137（花瓣生成 ceil((depth/2-droppedPetals)/3)，最多 11 片）; actors/mobs/npcs/GhostHero.kt:52（HT=10+roseLevel×5）; 54（timeLeft=30×roseLevel+60）; 95-100（每 15 回合治疗 ceil(HT×(0.05+0.01×roseLevel))）; 163-168（伤害 NormalIntRange(((HT-10)/3)/2, 5+(HT-10)/3)）; 168（免伤 NormalIntRange(0,(HT-10)/3)）; 120-121（攻击距离≤4）; 248（治疗冷却 15f）; actors/hero/Hero.kt:1317-1334（满级玫瑰死亡时以满血复活、解除诅咒并卸下、幽灵牺牲）
items.artifacts.driedrose.catalog_desc=等级上限 _10_，充能上限 _100_（初始充满）。\n\n主动 _召唤_（需满充能且当前没有幽灵）：召唤一名_幽灵英雄_，其等级等于玫瑰等级，存在 _30×等级+60_ 回合（_0_ 级 _60_ 回合、_10_ 级 _360_ 回合），并回复 _Random.Float(等级)_ 点理智。\n\n幽灵属性：生命 _10+5×等级_；远程魔法伤害 _((5×等级)/3)/2 ~ 5+(5×等级)/3_（_10_ 级约 _8~21_）；每次受击减免 _0 ~ (5×等级)/3_；每 _15_ 回合为 _2_ 格内的英雄回复 _ceil(生命上限×(0.05+0.01×等级))_ 生命；可攻击 _4_ 格内的敌人，并能与英雄_互换位置_。\n\n充能：仅在未召唤时每 _3_ 回合 _+1_，从空充满需 _300_ 回合；召唤期间不再充能。\n\n升级靠拾取_花瓣_（每层按 _ceil((层数/2-已掉落数)/3)_ 生成，累计最多 _11_ 片）。满级（_10_ 级）额外：装备时死亡会以_满血复活_，玫瑰随即解除诅咒并自动卸下，场上的幽灵英雄牺牲。

# LloydsBeacon 依据: items/artifacts/LloydsBeacon.kt:131-141（levelCap=3、chargeCap=3+level）; 143（random 返回自身，永不诅咒）; 169-241（SET 记录层数/坐标；RETURN 跨层或同层传送；191 行 ZAP 消耗 depth>20?2:1）; 56-129（zapper：58-62 先扣充能；65-71 目标为英雄自身时传送英雄；85-119 怪物传送到 randomRespawnCell，最多 10 次）；245-250（upgrade chargeCap++）; 265-285（beaconRecharge：1/(100-(cap-charge)×10)）; 288（TIME_TO_USE=1f）; actors/mobs/Tengu.kt:171、King.kt:159、DM300.kt:269（击败对应 boss 自动 upgrade）; items/scrolls/ScrollOfTeleportation.kt:97-114（满级 IntendTeleportHero 指定目标格）; levels/traps/DistortionTrap.kt:44-47（本层被扭曲陷阱重置则清除该记录点）
items.artifacts.lloydsbeacon.catalog_desc=等级上限 _3_，充能上限 _3+等级_（_3/4/5/6_）；这件神器_永不诅咒_。\n\n_设置_：记录当前层数与坐标，不消耗充能，耗时 _1_ 回合；_返回_：同层时传送回记录点，跨层时直接返回该层，同样不消耗充能。当本层_存在 Boss_，或英雄周围 _8_ 格内有任何生物时，无法设置或返回。\n\n_传送_：对目标发射，消耗 _1_ 充能（地下 _20_ 层以下为 _2_）。命中怪物时将其传送到随机格（最多尝试 _10_ 次；目标_不可移动_或 Boss 存活时失效）；若目标是英雄自己，则改为传送英雄。满级（_3_ 级）时，自我传送可_指定一个已探索的落点_。\n\n充能速度：每回合 _1/(100-(上限-当前充能)×10)_，充能越少越快；从空充满 _0_ 级约 _240_ 回合、_3_ 级约 _390_ 回合。\n\n升级：击败 _Tengu（地下 10 层）、King（15 层）、DM300（20 层）_ 时各自动 _+1_ 级。若某层的记录点被_扭曲陷阱_清空，该点的返回记录会失效。

# EtherealChains 依据: items/artifacts/EtherealChains.kt:180-190（levelCap=5、初始充能5）; 241-263（充能目标 5+2×等级，每回合 +1/(s-(目标-当前)×2)，+0~+4 时 s=32、+5 时 s=40，LockedFloor 限制）; 101-121（拉敌人：消耗=目标移动格数，Cripple 2+等级/2.0 回合）; 130-167（拉自己/抓地形：消耗=自身移动格数）; 265-283（经验 round(英雄经验/英雄升级需求×100)，阈值 100+50×等级）; actors/hero/Hero.kt:1156-1164（英雄升级需求 4+6×等级）; actors/Actor.kt:47-49,90（TICK=1）
items.artifacts.etherealchains.catalog_desc=装备时每回合自动回复充能；施放"施放"会消耗充能，消耗量等于本次把单位或自己移动的格数。入手时带有 _5_ 点充能，等级上限 _5_。充能上限 = _5 + 2×等级_：_+0_ 为 _5_，_+5_ 为 _15_；处于"锁定楼层"（战斗中禁止回复）时停止充能。\n\n每回合充能增量为 _1/(s-(上限-当前)×2)_：_+0~+4_ 时 _s=32_，满级 _+5_ 时 _s=40_。因此越接近上限越慢：_+0_ 时每格约 _22~30_ 回合，_+5_ 时每格约 _10~38_ 回合；从空充满分别约 _130_ 与 _360_ 回合。\n\n施放效果：\n· 目标为普通敌人：将其拉到你身边，消耗等于它移动的格数，并使其_残废_ _2+等级/2_ 回合（_+0_ 为 _2_，_+1_ 为 _2.5_，_+5_ 为 _4.5_）。\n· 目标为不可移动/重型/静止/首领单位：改为你飞向它，消耗等于你移动的格数，并对其发动一次_必中_普通攻击。\n· 瞄准可抓取的地形：你飞向该处，消耗等于移动格数；射程内没有有效目标则不消耗。\n\n升级与经验：获得英雄经验时会同时转化——经验进度 += _round(本次经验/英雄升级需求×100)_，充能进度 += _本次经验/英雄升级需求×10_（约一格英雄经验即 _10_ 点充能）。升级阈值为 _100+50×等级_（_+0_ 需 _100_、_+4_ 需 _300_），满级共需 _1000_ 点经验，约合 _10_ 个英雄等级。充能超过 _5+2×等级_ 后，经验带来的充能收益按比例衰减。\n\n诅咒：无法施放、不再充能，且每回合有 _1%_ 几率使自身_残废_ _10_ 回合。

# RiemannianManifoldShield 依据: items/artifacts/RiemannianManifoldShield.kt:25-34（levelCap=10、初始冷却1）; 37-54（格挡被消耗时冷却=56-4×等级、满级范围伤害）; 69-93（每回合递减冷却，冷却归零且无 ResistAny 时赋予 1 层格挡；经验+1，升级阈值 等级²/3+等级+1，升级后 exp -= 阈值，故余 1 点经验结转）; 57（70% 几率诅咒）; actors/buffs/ResistAny.kt:16-40（resistCount=1）; actors/Char.kt:185-189,601-606（非精神伤害被完全抵消）; actors/hero/Hero.kt:698-708（诅咒时直接返回原始伤害）
items.artifacts.riemannianmanifoldshield.catalog_desc=装备后自动获得 _1_ 层"格挡"（ResistAny），可完全抵消_一次非精神伤害_（近战、远程、魔法、元素均有效）。格挡被消耗后进入冷却，冷却期间不再提供格挡。\n\n冷却 = _56 - 4×等级_ 回合：_+0_ 为 _56_，_+5_ 为 _36_，_+10_ 为 _16_。装备瞬间冷却仅为 _1_，因此首次格挡几乎立刻可用。\n\n每次格挡提供 _1_ 点经验，升级阈值随等级升高：_+0→+1_ 需 _2_ 次格挡（需严格超过阈值 _等级²/3+等级+1_），此后每级所需次数正好等于该阈值：_+1→+2_ 需 _2_ 次，_+2→+3_ 需 _4_ 次，_+5→+6_ 需 _14_ 次，_+9→+10_ 需 _37_ 次；升至满级累计约 _148_ 次格挡。\n\n满级 _+10_ 额外效果：每次格挡被消耗时，对_视野内且距离 3 格以内_的所有敌人造成 _10 ~ 敌人生命上限/5_ 的魔法伤害。\n\n诅咒：以 _70%_ 几率生成。被诅咒时护盾_不再提供格挡_，并_移除装备者的全部魔法与元素抗性_（所有伤害按原值结算）。\n\n提高等级只缩短冷却、增加升级所需格挡次数并解锁满级范围伤害，不改变"完全抵消一次"这一核心效果。

# GoldPlatedStatue 依据: items/artifacts/GoldPlatedStatue.kt:19-23（levelCap=10）; 33-53（投入金币升级，金币需求 100×1.27^等级）; 72-83（拾取金币加成 等级×10%，诅咒 -30%，满级时 10% 几率再 +100%）; items/unclassified/Gold.kt:55-67（拾取金币时结算）
items.artifacts.goldplatedstatue.catalog_desc=没有充能机制，只能靠投入金币升级，等级上限 _10_。装备后拾取金币即获得额外收益。\n\n金币加成 = _等级×10%_：_+0_ 无加成，_+1_ _+10%_，_+5_ _+50%_，_+10_ _+100%_（即翻倍）。加成按拾取量取整后额外入手。诅咒状态改为 _-30%_（拾取会损失三成）。\n\n满级 _+10_ 额外效果：每次拾取有 _10%_ 几率_再额外 +100%_（该次合计 _+200%_，即三倍收益）。\n\n主动"投入"：每次消耗 _floor(100×1.27^当前等级)_ 金币使等级 +1，诅咒时无法投入。各级花费依次为 _100、127、161、204、260、330、419、532、676、859_ 金币，从 _+0_ 升到 _+10_ 共需 _3668_ 金币；等级越高单次投入越贵，但每级固定只提升 _10%_ 收益。

# HandOfTheElder 依据: items/artifacts/HandOfTheElder.kt:30-53（levelCap=10、chargeCap=2、初始充能2、最多融合5枚戒指）; 103-123（每回合 +0.025×1.05^等级）; 126-140（融合戒指：升级 clamp(戒指等级+1,1,剩余)，诅咒戒指传染诅咒）; 166-212（一指：消耗1充能、暗影伤害 目标生命上限/10~/5、持续(等级/2+2)×加成、定身与戒指负面）; 226-246（戒指→负面映射表、MAX_RINGS_TO_WEAR=5）
items.artifacts.handoftheelder.catalog_desc=等级上限 _10_，充能上限 _2_ 且入手时满充能。每回合充能 _+0.025×1.05^等级_，每点充能约需 _40_ 回合（_+0_）、_31_ 回合（_+5_）、_25_ 回合（_+10_）。\n\n主动"一指"：消耗 _1_ 点充能，指向一名非自身单位，_必定命中_，造成约 _目标生命上限/10 ~ /5_ 的_暗影_伤害（不含物理成分），并施加_缠绕_ _等级/2+2_ 回合（整数除法：_+0_ 为 _2_、_+2_ 为 _3_、_+4_ 为 _4_、_+10_ 为 _7_）。诅咒时上述持续时间 _×1.25_；对_首领/迷你首领_ 则 _×0.5_。\n\n融合戒指：可将 _最多 5_ 枚已鉴定戒指融入骨手（不能重复同类、不能是已装备的）。融合使等级提升 _clamp(戒指等级+1, 1, 剩余等级上限)_，戒指被永久消耗；若戒指被诅咒，骨手也会被诅咒。因此镶入高等级戒指是主要升级途径，_+10_ 封顶后无法再提升。\n\n一指会同时施加每枚已融合戒指对应的负面状态：_精准之戒→震撼_、_暴击之戒→虚弱_、_抗性之戒→冻伤_、_闪避之戒→失衡_、_武力之戒→狂乱_、_狂怒之戒→迟缓_、_疾速之戒→残废_、_根骨之戒→虚弱_、_神射之戒→失明_、_生命之戒→眩晕_、_财富之戒→魅惑_、_奥术之戒→白雾云_。持续时间默认等于缠绕时长；其中_残废_与_眩晕_翻倍，_魅惑_与_白雾_按各自的回合数结算。\n\n诅咒：无法再融合戒指，但"一指"的持续时间 _×1.25_（充能与伤害不受影响）。

# HandleOfAbyss 依据: items/artifacts/HandleOfAbyss.kt:23-34（levelCap=10、charge/chargeCap=100）; 45-80（召唤消耗满充能并清零，决定友敌）; 103-136（每回合 +100/(200+10×等级)，仅无存活召唤物时；诅咒 1% 几率召唤敌人）; 83-89,138-148（觉醒后经验）; 151-160（SetDefeated）; actors/mobs/npcs/AbyssHero.kt:54-64（友方数值）; 66-81（仿英雄数值）; 100-113（伤害与减伤）; 118-145（寿命与满级光环）; 168-184（经验换算、召唤自伤）
items.artifacts.handleofabyss.catalog_desc=等级上限 _10_，充能 _100/100_，入手时满充能。仅当充能全满且场上没有存活召唤物时才能"召唤"，召唤后充能清零。\n\n若尚未击败过深渊战士（或剑柄被诅咒），召唤出的是_敌对的仿制品_：等级按 _英雄等级/2-(3-层数/5)_ 取 _1~10_，防御随英雄等级，生命取英雄生命上限一半与当前生命的较大值，永久存在。首次召唤通常为敌，击杀它后剑柄"觉醒"。\n\n觉醒且未诅咒时，召唤出_友方深渊战士_，等级等于剑柄等级：攻击/防御 _10+2×等级_，生命 _20+5×等级_，持续 _20×等级+50_ 回合；近战伤害 _1+等级 ~ 5+6×等级_ 并附带 _1 ~ 2×等级_ 暗影伤害，_15%_ 几率暴击 _×1.25_；抗光 _0.5_、抗暗 _1.25_（受暗影伤害更重）。_+10_ 时每回合对自身视野内的敌人（若英雄在视野内也包括英雄）施加 _1.25 倍受创_ 的_易伤_ _3_ 回合。\n\n每次召唤都会对英雄造成 _Random.Int(等级)+1_ 点_精神_伤害。\n\n充能速度：每回合 _+100/(200+10×等级)_ 点，从空充满需 _200+10×等级_ 回合（_+0_ 为 _200_、_+5_ 为 _250_、_+10_ 为 _300_）；有存活召唤物时不再充能。\n\n升级：觉醒后，召唤物获得经验（每次召唤立即获得约 _20×1.35^(层数/2-等级)_ 点，其击杀怪物另计），每 _100_ 点经验升 _1_ 级；在层数约等于 _2×等级_ 时约 _5_ 次召唤升一级，低等级在深层升级更快。\n\n诅咒：无法正常召唤，改为每回合 _1%_ 几率自动召唤一名_敌对_深渊战士。

# HeartOfSatan 依据: items/artifacts/HeartOfSatan.kt:20-24（levelCap=10）; 26-31,36-45（血祭仅未诅咒且未满级）; 47-72（自伤 3×等级²，经护甲减伤至少 1、耗 3 回合、存活即升级）; 74-79（外观随等级）; 97-99（满级回复上限 +生命上限/2）; actors/hero/Hero.kt:197-231（额外回复 生命上限×0.003×1.18^等级，诅咒改为 -0.025，饥饿减半）; actors/buffs/Regeneration.kt:29-51（回复上限与突破）
items.artifacts.heartofsatan.catalog_desc=等级上限 _10_，升级方式为主动"血祭"：对自己造成 _3×等级²_ 点物理伤害（会被武器与护甲的物理减伤削减，至少 _1_ 点），耗时 _3_ 回合，只要存活就 +1 级。_+0_ 实伤 _1_（受下限影响），_+1_ 为 _3_，_+2_ 为 _12_，_+5_ 为 _75_，_+10_ 为 _300_；从 _+0_ 升满累计原始自伤 _855_ 点。\n\n当自伤超过当前生命的 _3/4_ 时会先弹出确认框。诅咒时不能血祭。\n\n被动治疗：装备期间每回合额外回复 _生命上限×0.003×1.18^等级_ 点生命，计入自然回复。以生命上限 _100_ 为例：_+0_ 约 _0.3/回合_，_+5_ 约 _0.69/回合_，_+10_ 约 _1.57/回合_（按累积值取整入账）。饥饿状态会使该增益减半，极度饥饿或狂暴时为 _0_。\n\n满级 _+10_ 额外效果：自然回复的上限由 _生命上限_ 提高到 _生命上限×1.5_，即可以回复并停留在生命上限之上（最多 _+50%_）。\n\n诅咒：回复速率被改为每回合 _-0.025_（若原本已为负则再 _×1.5_ 加重），即持续流失生命，与血祭升级互斥。

# CloakOfSheep 依据: items/artifacts/CloakOfSheep.kt:30（levelCap=10）; 63-65（cd=20、range=5+level、requireExp=(level+2)(level+1)）; 67-74（每次闪烁 exp+1，exp>requireExp 时升级）; 76-81（原地生成 Sheep，lifespan=2+Random.Int(depth+10)）; 86-87（传送后 spendAndNext(0.5)）; 125（超出 range 判定）; 50-52、106-119（诅咒：无法闪烁、每回合 1% 触发 FlockTrap）; actors/mobs/npcs/Sheep.kt:39-50（绵羊寿命与无害化）; levels/traps/FlockTrap.kt:60-71（半径2生成）
items.artifacts.cloakofsheep.catalog_desc=装备后获得主动技能_闪烁_。等级上限 _10_，不能靠卷轴强化，只能通过每次闪烁积累经验升级：升级所需经验为 _(等级+1)×(等级+2)_，且经验需严格超过该值。\n\n_闪烁_：消耗 _0.5_ 回合，瞬移到已探索且可到达的格子，可穿越墙壁，但不能落在实心格、被占据的格或封闭区域。最大距离为 _5+等级_ 格：_+0_ 为 _5_，_+5_ 为 _10_，_+10_ 为 _15_。每次闪烁后冷却 _20_ 回合，冷却不随等级缩短。\n\n闪烁会在出发位置留下一只不主动攻击的绵羊，其存在时间随楼层深度增加，约为 _2_ 至 _深度+11_ 回合。\n\n升级所需闪烁次数逐级递增：_+0→+1_ 需 _3_ 次，_+1→+2_ 需 _6_ 次，_+2→+3_ 需 _12_ 次，_+5→+6_ 需 _42_ 次，_+9→+10_ 需 _110_ 次，累计约 _441_ 次。等级只影响闪烁距离，没有其他被动加成；满级（_+10_）后不再提升。\n\n被诅咒时无法闪烁，也无法积累经验；取而代之的是每个回合有 _1%_ 的几率在穿戴者位置触发_羊群陷阱_，在以自身为中心 _半径2_（最多 _5×5_）范围内生成绵羊。

# DragonsSquama 依据: items/artifacts/DragonsSquama.kt:30-32（levelCap=10、chargeCap=100、初始满）; 50-54（装备 +0.6 火抗，下标 0=火 见 actors/mobs/Mob.kt:91）; 42-47、74-82（轻叩需满充能、exp>=2+level 升级）; 86（radius=3+level/3）; 101-107（除自身格外点燃地面）; 111-118（burnChar 伤害 Random.IntRange(2+2level,6+5level)、非英雄存活者 Shock 1.5）; 123-143（暴击减免 0.12+0.01×level、被击中充能 4-level/5、暴击再 +1、满级 25% 点燃 2 格内攻击者）; 145-153（每 act 恢复 1 充能、spend 2）; actors/buffs/Burning.kt:194-202（燃烧约 8 回合）
items.artifacts.dragonssquama.catalog_desc=装备时火焰元素抗性 _+60%_。等级上限 _10_，拥有 _100_ 点充能且初始充满；充能与升级经验是两套独立机制。\n\n_充能_：未满时每 _2_ 回合自动恢复 _1_ 点；被非精神伤害击中时额外恢复 _4-等级/5_ 点（_+0~+4_ 为 _4_，_+5~+9_ 为 _3_，_+10_ 为 _2_），暴击再 _+1_，上限 _100_。\n\n_轻叩_（需满充能）：消耗全部充能，在以自身为中心 _3+等级/3_ 格的范围内引发火焰新星：_+0~+2_ 为 _3_ 格，_+3~+5_ 为 _4_ 格，_+6~+8_ 为 _5_ 格，_+9~+10_ 为 _6_ 格。范围内每个单位（包括英雄自身）受到 _随机(2+2×等级 ~ 6+5×等级)_ 点火焰附加伤害：_+0_ 为 _2~6_，_+5_ 为 _12~31_，_+10_ 为 _22~56_。除自身格外，范围内地面会被点燃；未死亡的敌人额外被_震慑_ _1.5_ 回合。\n\n_升级_：每次轻叩获得 _1_ 经验，需要 _等级+2_ 次轻叩升一级：_+0→+1_ 为 _2_ 次，_+5→+6_ 为 _7_ 次，_+9→+10_ 为 _11_ 次，累计 _65_ 次。\n\n_暴击减免_：被暴击时本次主伤害按 _12%+1%×等级_ 结算，_+0_ 减 _12%_，_+5_ 减 _17%_，_+10_ 减 _22%_；被诅咒时方向反转，受到的暴击伤害反而提高同等比例。\n\n满级（_+10_）后，被击中时有 _25%_ 的几率点燃 _2_ 格内的攻击者，燃烧约 _8_ 回合。

# GoddessRadiance 依据: items/artifacts/GoddessRadiance.kt:23-25（levelCap=10、chargeCap=100、初始满）; 122（viewAmend 满级 +1）; 123（evadeRatio=0.4-0.4×0.9^level）; 125-146（每次 act 充能 100/(4+0.6×level)、spend 10、earnExp(1)）; 106-117（mexp=15+10×level）; 59-72（祝福需 DewVial Volume>=10、earnExp(Volume/2) 并清空）; 43-49（满级后无祝福）; 75-104（激活：Light 10+3×level、range=4+level/2、Blindness 3+level/2、Shock 与击退力度均为 range-dis）; actors/buffs/Light.kt:105、112-119（光照半径 5）; actors/buffs/Pressure.kt:76-93（ignoreChance 用 evadeRatio 忽略压力上涨）; actors/hero/Hero.kt:166-169（viewAmend 计入视野）; items/unclassified/DewVial.kt:195（MAX_VOLUME=30）
items.artifacts.goddessradiance.catalog_desc=等级上限 _10_，拥有 _100_ 点充能且初始充满。它随时间自行成长，也可用露水瓶的祝福加速；被诅咒时充能、激活与祝福全部失效。\n\n_充能_：每 _10_ 回合结算一次，每次增加 _100/(4+0.6×等级)_ 点充能，充满需 _40+6×等级_ 回合：_+0_ 为 _40_，_+5_ 为 _70_，_+10_ 为 _100_。\n\n_成长_：每次充能结算同时获得 _1_ 点经验，升级所需经验为 _15+10×等级_：_+0→+1_ 需 _15_，_+5→+6_ 需 _65_，_+9→+10_ 需 _105_，满级累计 _600_ 经验（约 _6000_ 回合）。\n\n_祝福_（需背包中有露水瓶且露水 _≥10_，且未满级）：消耗全部露水，获得 _露水量/2_ 点经验，满瓶 _30_ 露水给 _15_ 点。\n\n_激活_（需满充能）：驱散自身隐身并产生光耀，获得 _10+3×等级_ 回合的强光（照亮周围 _5_ 格）。对视野内 _4+等级/2_ 格内的所有怪物造成 _3+等级/2_ 回合_失明_、_范围内距离差_ 回合_震慑_，并以同样的距离差为力度沿视线方向将其击退；随后充能归零，消耗 _1_ 回合。范围 _+0_ 为 _4_，_+4_ 为 _6_，_+10_ 为 _9_。\n\n_被动_：有 _0.4-0.4×0.9^等级_ 的几率忽略一次_压力_上涨（即精神层面的侵蚀）：_+1_ 约 _4%_，_+2_ 约 _7.6%_，_+5_ 约 _16.4%_，_+10_ 约 _26%_，上限趋近 _40%_。等级达到 _+10_ 时额外永久提供 _+1_ 视野距离。

# EyeballOfTheElder.Left 依据: items/artifacts/EyeballOfTheElder.kt:191-198（levelCap=10）; 200-202（70% 诅咒）; 212-217（cd=20、zapRange=5+level、zapDamage=Random.IntRange(3+level,4+3×level)、诅咒×1.3）; 219-236（requireExp=level²+2、升级时造成 2+Random.Int(0,level) 精神伤害、保留诅咒）; 238-275（射线 dist=min(zapRange,beam.dist)、摧毁 Level.flamable 地形、路径上每个单位受暗影附加伤害）; 279-296（Prepare 每回合自动锁定射程内首个可见敌人）; 409-433（Combin 合体：等级取左眼、cursed=左||右）; 62-72（合体 35/30/25/10 触发）; 93-176（合体各效果与冷却）; actors/mobs/Mob.kt:778、actors/hero/HeroAction.kt:348（Disarm 无法攻击）
items.artifacts.eyeballoftheelder$left.catalog_desc=古老者之眼（左），等级上限 _10_，生成时 _70%_ 几率带诅咒。装备后每回合自动锁定视野内 _5+等级_ 格范围内首个可见敌人，朝其发射_死亡射线_：_+0_ 为 _5_ 格，_+5_ 为 _10_ 格，_+10_ 为 _15_ 格，随后冷却 _20_ 回合。\n\n射线沿直线贯穿射程内每一格，格上每个单位都会受到 _随机(3+等级 ~ 4+3×等级)_ 点暗影附加伤害：_+0_ 为 _3~4_，_+5_ 为 _8~19_，_+10_ 为 _13~34_；被诅咒时伤害 _×1.3_。射线还会摧毁沿途所有可燃地形。\n\n_升级_：每次成功发射获得 _1_ 经验，升级需经验严格超过 _等级²+2_，即每级所需发射次数为 _等级²+2_：_+0→+1_ 为 _3_ 次，_+2→+3_ 为 _6_ 次，_+5→+6_ 为 _27_ 次，_+9→+10_ 为 _83_ 次，累计 _306_ 次。升级时诅咒保留，并对英雄造成 _2+随机(0~等级-1)_ 点精神伤害。\n\n_合体_：当左眼与右眼同时在你身上时，两件会自动合并为_古老者之眼_。合并后的等级等于左眼的等级，只要任一只眼带诅咒，合体后即为诅咒状态，且合体后无法卸下。合体后每回合在 _35%_ 死亡射线、_30%_ 群体凝视、_25%_ 群体缴械、_10%_ 秒杀之间随机触发一种；四种效果的冷却分别为 _15~25_、_8~15_、_15~20_、_10~20_ 回合，期间不触发也不积累经验。合体射线伤害为 _4+等级 ~ 6+4×等级_（诅咒 _×1.3_），群体凝视使视野内敌人受到 _×1.3_（诅咒 _×1.5_）的魔法易伤持续 _5.1+等级_ 回合，群体缴械持续 _1.1+等级_ 回合，秒杀对视野内随机一名非 Boss 敌人造成等于其生命上限的纯粹魔法伤害（仅在该敌人死亡时反噬英雄 _1~4_ 点精神伤害）。

# EyeballOfTheElder.Right 依据: items/artifacts/EyeballOfTheElder.kt:307-315（levelCap=10）; 353-355（70% 诅咒）; 375-392（被动：视野内所有活敌 Vulnerable ×1.25/×1.4，持续 1.1）; 336-337（cooldown=20-level、duration=2+level/2）; 339-351（凝视施放 Disarm、spendAndNext(1)）; 409-433（合体）; actors/buffs/Vulnerable.kt:26-27、68-94（按 ratio 缩放对应类型伤害）; actors/mobs/Mob.kt:778、actors/hero/HeroAction.kt:348（Disarm 无法攻击）
items.artifacts.eyeballoftheelder$right.catalog_desc=古老者之眼（右），等级上限 _10_，生成时 _70%_ 几率带诅咒。\n\n_被动_：只要装备着，视野内所有活着的敌人会持续获得对_魔法伤害_的易伤，受到的魔法伤害变为 _×1.25_（被诅咒时 _×1.4_）；效果每回合刷新，单次仅持续约 _1.1_ 回合，因此只对处于视野内的敌人生效。\n\n_凝视_（主动，无充能限制，冷却完毕即可使用）：对视野内任一目标施加_缴械_（目标无法攻击），持续 _2+等级/2_ 回合，冷却 _20-等级_ 回合，消耗 _1_ 回合。按等级 _L_：_+0_ 为 _2_ 回合缴械 / 冷却 _20_，_+5_ 为 _4.5_ 回合 / 冷却 _15_，_+10_ 为 _7_ 回合 / 冷却 _10_。\n\n右眼不能通过使用升级，其等级在正常游戏中恒为 _0_，因此实际效果为 _2_ 回合缴械、_20_ 回合冷却；上面的等级缩放只有在通过转移强化等其他途径改变其等级时才会生效。\n\n_合体_：当左眼与右眼同时在你身上时，两件会自动合并为_古老者之眼_。合并后的等级取左眼的等级，任一只眼带诅咒则合体后为诅咒状态，且合体后无法卸下。合体后每回合随机触发一种群体效果（_35%_ 死亡射线、_30%_ 群体凝视、_25%_ 群体缴械、_10%_ 秒杀），不再保留右眼单独装备时的持续魔法易伤。
