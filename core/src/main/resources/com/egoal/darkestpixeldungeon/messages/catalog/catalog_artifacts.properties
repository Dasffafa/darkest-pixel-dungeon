items.artifacts.handleofabyss.catalog_desc=等级上限 _10_，充能上限 _100_（初始满）。\n\n_充能_：无召唤物时每回合充能 _+100/(200+10×等级)_。\n\n_主动_：召唤（满充能）：消耗全部充能，自身受到 _1~等级+1_ 精神伤害。未觉醒时召唤敌对仿制品（击杀后觉醒）；觉醒后召唤同级友方战士，持续 _20×等级+50_ 回合。战士攻防 _10+2×等级_、生命 _20+5×等级_，普攻附带暗影伤害。\n\n_升级_：觉醒后召唤物获取经验，阈值 _100_。\n\n_满级_：友方战士每回合对自身视野内所有目标施加 _3_ 回合易伤（受创 _×1.25_，含英雄）。\n\n_诅咒_：无法主动召唤友方，每回合有 _1%_ 几率自动召唤敌对战士。

