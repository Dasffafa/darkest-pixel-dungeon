items.artifacts.goddessradiance.catalog_desc=等级上限 _10_，充能上限 _100_（初始满）。\n\n_充能_：每 _10_ 回合充能 _+100/(4+0.6×等级)_ 并获得 _1_ 经验。\n\n_被动_：有 _0.4-0.4×0.9^等级_ 几率免疫压力上涨。\n\n_主动_：\n· 激活（满充能，耗时 _1_ 回合）：消耗全部充能，获得 _10+3×等级_ 回合强光（半径 _5_）；对视野内 _4+floor(等级/2)_ 格内敌人施加 _3+floor(等级/2)_ 回合失明、距离差回合震慑并击退。\n· 祝福（露水 ≥ _10_ 且未满级）：消耗全部露水获得 _露水/2_ 经验。\n\n_升级_：升级阈值 _15+10×等级_。\n\n_满级_：永久提升 _+1_ 视野范围。\n\n_诅咒_：停止充能与经验成长，激活与祝福均失效。

# EyeballOfTheElder.Left 依据: items/artifacts/EyeballOfTheElder.kt:191-198（levelCap=10）; 200-202（70% 诅咒）; 212-217（cd=20、zapRange=5+level、zapDamage=Random.IntRange(3+level,4+3×level)、诅咒×1.3）; 219-236（requireExp=level²+2、升级时造成 2+Random.Int(0,level) 精神伤害、保留诅咒）; 238-275（射线 dist=min(zapRange,beam.dist)、摧毁 Level.flamable 地形、路径上每个单位受暗影附加伤害）; 279-296（Prepare 每回合自动锁定射程内首个可见敌人）; 409-433（Combin 合体：等级取左眼、cursed=左||右）; 62-72（合体 35/30/25/10 触发）; 93-176（合体各效果与冷却）; actors/mobs/Mob.kt:778、actors/hero/HeroAction.kt:348（Disarm 无法攻击）
items.artifacts.eyeballoftheelder$left.catalog_desc=等级上限 _10_。\n\n_被动_：每回合自动朝 _5+等级_ 格内首个可见敌人发射死亡射线（冷却 _20_ 回合）：沿途造成 _3+等级 ~ 4+3×等级_ 暗影伤害并摧毁可燃地形。\n\n_升级_：发射经验 _+1_，升级阈值 _等级²+2_。升级对英雄造成 _2+0~等级-1_ 精神伤害。\n\n_合体_：双眼同行自动合体（继承左眼等级，任一诅咒则诅咒，无法卸下）。合体后每回合独立触发：\n· _35%_ 死亡射线：造成 _4+等级 ~ 6+4×等级_ 暗影伤害（冷却 _15~25_）。\n· _30%_ 群体凝视：视野内敌人受魔法伤害 _×1.3_，持续 _5.1+等级_ 回合（冷却 _8~15_）。\n· _25%_ 群体缴械：持续 _1.1+等级_ 回合（冷却 _15~20_）。\n· _10%_ 秒杀：对视野内非首领敌人造成等同生命上限魔法伤害，反噬英雄 _1~4_ 精神伤害（冷却 _10~20_）。\n\n_诅咒_：生成时 _70%_ 几率诅咒；射线伤害提升 _30%_，升级保留诅咒；合体后继承诅咒并使合体射线伤害 _×1.3_、群体凝视魔法易伤提高至 _×1.5_。

# EyeballOfTheElder.Right 依据: items/artifacts/EyeballOfTheElder.kt:307-315（levelCap=10）; 353-355（70% 诅咒）; 375-392（被动：视野内所有活敌 Vulnerable ×1.25/×1.4，持续 1.1）; 336-337（cooldown=20-level、duration=2+level/2）; 339-351（凝视施放 Disarm、spendAndNext(1)）; 409-433（合体）; actors/buffs/Vulnerable.kt:26-27、68-94（按 ratio 缩放对应类型伤害）; actors/mobs/Mob.kt:778、actors/hero/HeroAction.kt:348（Disarm 无法攻击）
items.artifacts.eyeballoftheelder$right.catalog_desc=等级上限 _10_（常规恒为 _0_ 级）。\n\n_被动_：视野内敌人受到的魔法伤害 _×1.25_。\n\n_主动_：凝视（耗时 _1_ 回合，冷却 _20-等级_ 回合）：对视野内目标施加 _2+floor(等级/2)_ 回合缴械。\n\n_合体_：双眼同行自动合体（继承左眼等级与诅咒，无法卸下；机制见左眼），合体后移除右眼独立被动易伤。\n\n_诅咒_：生成时 _70%_ 几率诅咒；被动魔法易伤由 _×1.25_ 提升至 _×1.4_；合体后继承诅咒。
