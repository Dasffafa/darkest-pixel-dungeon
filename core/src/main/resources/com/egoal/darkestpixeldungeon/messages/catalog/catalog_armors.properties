items.armor.warriorarmor.catalog_desc=装备后以默认动作发动「英勇之跃」：选定目标格后跳过去，落点被其他单位占据时自动后退一格，落地后使周围 _8_ 格内所有单位_麻痹_ _3_ 回合。\n代价是当前生命的 _1/3_，动作耗时 _1_ 回合；技能不消耗充能与次数，但当前生命不满 _10_ 时无法发动。此外只有战士套装在改造时会继承原甲上的_破损纹章_，因此它是唯一能继续携带纹章的职业甲。
