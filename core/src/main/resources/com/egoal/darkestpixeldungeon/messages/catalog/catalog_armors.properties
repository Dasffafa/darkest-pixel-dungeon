items.armor.clotharmor.catalog_desc=初始护甲
items.armor.leatherarmor.catalog_desc=在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _70%_、_25%_、_10%_、_5%_、_2%_。
items.armor.mailarmor.catalog_desc=在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _20%_、_50%_、_40%_、_20%_、_8%_。
items.armor.scalearmor.catalog_desc=在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _8%_、_20%_、_40%_、_50%_、_20%_。
items.armor.platearmor.catalog_desc=在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _2%_、_5%_、_10%_、_25%_、_70%_。
items.armor.warriorarmor.catalog_desc=消耗当前生命值的1/3，使用1回合发动「英勇之跃」：跳到目标地点，落点被其他单位占据时自动后退一格，落地后使周围 _8_ 格内所有单位_麻痹_ _3_ 回合。\n\n但当前生命不满 _10_ 时无法发动。
items.armor.magearmor.catalog_desc=消耗当前生命值的1/3，使用1回合发动「熔火陷地」：点燃视野内的所有敌人（_燃烧_持续 _8_ 回合，受目标抗性影响），并使其_缠绕_ _3_ 回合，期间无法移动。\n\n当前生命不满 _10_ 时无法发动。\n\n若长袍用_伟大图纸_强化过，还会解锁「低空漫游」：跳到视野内选定的位置，之后冷却 _20~25_ 回合。
items.armor.roguearmor.catalog_desc=消耗当前生命值的1/3，使用1回合发动「烟幕爆炸」：传送到视野内选定的格子，落点必须在你当前的视野内、是能落脚的地面，而且不能有别的单位站在上面，否则会被拒绝；墙体可以隔着传送过去。传送的同时使所有能看见你的敌人_失明_至少 _2_ 回合（沉睡中的敌人闭眼不受影响），正在追击你的敌人会放弃追踪、转为盲目游荡。\n\n当前生命不满 _10_ 时无法发动。
items.armor.huntressarmor.catalog_desc=消耗当前生命值的1/3，使用1回合发动「幻影飞刀」：向视野内 _8_ 格以内的每个敌人各投出一把飞刀，每把都会以你当前的武器（远程武器优先）进行一次攻击，全部攻击结束后行动才结束。\n\n当前生命不满 _10_ 时无法发动。
items.armor.sorceressarmor.catalog_desc=消耗当前生命值的1/3，使用1回合发动「深红之潮」：使视野内 _8_ 格以内（不含 _8_ 格）的所有敌人_剧毒_并_恐惧_。剧毒持续 _5_ 回合，期间每回合受到毒属性伤害，初值为 _使用者对该敌人的一次攻击伤害的 1/5+2_，之后每回合增加 _1_ 点，最高不超过 _(层数+1)/2+1_；恐惧持续 _3_ 回合。\n代价是当前生命的 _1/3_，耗时 _1_ 回合；技能不消耗充能与次数，但当前生命不满 _10_ 时无法发动。
items.armor.exilearmor.catalog_desc=在当前生命不高于生命上限的 _3/4_ 时可用，消耗当前生命值的1/3，使用1回合发动「坚忍」：把_护盾_提高到 _max(当前护盾, 发动后已损失生命的一半)_。\n\n当前生命不满 _10_ 时无法发动。
