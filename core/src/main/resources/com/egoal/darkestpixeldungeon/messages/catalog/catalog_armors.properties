items.armor.sorceressarmor.catalog_desc=装备后以默认动作发动「深红之潮」：使视野内 _8_ 格以内（不含 _8_ 格）的所有敌人_剧毒_并_恐惧_。剧毒持续 _5_ 回合，期间每回合受到毒属性伤害，初值为 _使用者对该敌人的一次攻击伤害的 1/5+2_，之后每回合增加 _1_ 点，最高不超过 _(层数+1)/2+1_；恐惧持续 _3_ 回合，受到任何伤害即解除。\n代价是当前生命的 _1/3_，耗时 _1_ 回合；技能不消耗充能与次数，但当前生命不满 _10_ 时无法发动。
