items.armor.clotharmor.catalog_desc=没有任何附加机制，强度完全由材质决定。它不会随机出现在地下城里，也不会随英雄的骸骨留给下一位冒险者，只会在开局时分配给每一位新人。开局的力量恰好够穿它，不会有任何重量惩罚。对任何流派来说，它都只是第一层的遮体之物，捡到更厚的甲之后就该换掉，离开初期的层数后基本不会再见到它。
# LeatherArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/armor/LeatherArmor.kt:25
# LeatherArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:71
items.armor.leatherarmor.catalog_desc=没有任何附加机制：防御、护盾与魔法抗性的成长只由材质品阶与强化等级决定。它是最常见的低阶护甲，在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _70%_、_25%_、_10%_、_5%_、_2%_，因此几乎每位冒险者都会在开局遇上它，把它当作布甲与链甲之间的过渡。越到深层它越少见，到那时它既挡不住伤害，也不值得再投入强化卷轴，通常会被换掉或处理掉。除刻印外它没有任何触发效果。
# MailArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/armor/MailArmor.kt:25
# MailArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:71
items.armor.mailarmor.catalog_desc=没有任何附加机制：全部强度只由品阶与强化等级决定。它集中出现在中层，在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _20%_、_50%_、_40%_、_20%_、_8%_。重量介于皮甲与鳞甲之间，因此常常是刻印与强化卷轴长期留用的一件，也是多数流派中期的过渡主力；在拿到鳞甲或板甲之前，它通常就是身上最厚的那层保障。除刻印外它没有任何触发效果。
# ScaleArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/armor/ScaleArmor.kt:25
# ScaleArmor 依据: core/src/main/java/com/egoal/darkestpixeldungeon/items/Generator.kt:71
items.armor.scalearmor.catalog_desc=没有任何附加机制：强度同样只来自品阶与强化等级。它是后期护甲，在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _8%_、_20%_、_40%_、_50%_、_20%_。此时它已相当沉重，力量跟不上时护甲的实际减伤会缩水，移动与闪避也会变慢，因此穿它之前最好先把力量补齐。它没有主动技能，价值几乎全部取决于你愿意投入多少强化卷轴；除刻印外它没有任何触发效果。
