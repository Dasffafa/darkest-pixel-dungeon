items.armor.platearmor.catalog_desc=没有任何附加机制：强度只由品阶与强化等级决定，靠厚度换取最高的成长。它是最重的普通护甲，在 _1~4_、_5~9_、_10~14_、_15~19_ 与 _20_ 层以后，占护甲掉落的比重依次为 _2%_、_5%_、_10%_、_25%_、_70%_。重量惩罚在它身上体现得最明显：力量不足时每差 _1_ 点，护甲实际减伤减少 _2_ 点、移动速度乘以 _1/1.2_、闪避乘以 _1/1.5_，所以力量没堆够时它可能还不如一件轻甲好穿。除刻印外它没有任何触发效果。
