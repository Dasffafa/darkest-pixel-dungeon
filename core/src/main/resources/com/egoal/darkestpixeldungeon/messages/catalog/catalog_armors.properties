items.armor.exilearmor.catalog_desc=装备后以默认动作发动「坚忍」，但仅在当前生命不高于生命上限的 _3/4_ 时可用；生命更高时只会得到一句「还不到时候」，不产生任何消耗。发动时先失去当前生命的 _1/3_，再把_护盾_提高到 _max(当前护盾, 发动后已损失生命的一半)_，相当于把损失的生命转化为护盾。\n动作耗时 _1_ 回合；技能不消耗充能与次数，但当前生命不满 _10_ 时无法发动。
